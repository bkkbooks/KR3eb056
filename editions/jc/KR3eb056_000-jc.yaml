body:
  text: 緒言嘗觀近世科學家之學說莫不先有理想而後成實驗醫學一道何莫不然如聽病有筒診脈有表探淋有管度寒暑有針食管尿管直腸各有探耳目喉陰俱有鏡此外醫家用器不勝枚舉皆可補耳力目力藥力所不及較之我國之四診法可謂精而細約而明然亦只能辨其有形之實跡不能察其無形之氣化若我中醫望舌一端用以察病纖毫攸分較之用器尤為明著陶保廉云舌無隔膜且為心苗目視明澈勝於手揣林慎庵曰觀舌為外症要務以其能別虛實死生也利濟外乘云欲知消化器之情形可辨舌色如何便知大略周雪樵云舌膜與消化部各器具連故能顯消化部之病又與津液器循環器亦有密切之關係新靈樞云舌與消化器有密切之關係凡腸胃有病必現於舌苔舌鑑辨正云舌居肺上腠理與腸胃相連腹中元氣熏蒸蘊釀親切顯露有病與否昭然若揭徐靈胎曰舌為心之外候苔乃胃之明徵察舌可占正之盛衰驗苔以識邪之出入有病與否昭然若揭柯為良云凡舌上面有刺刺中有腦蕊能主嘗味有苔可以察病劉吉人云舌為胃之外候以助輸送食物入食管胃脘之用其舌體之組織系由第五對腦筋達舌其功用全賴此筋運動舌下有青紫筋二條乃下焦腎脈上達有穴二名曰金津玉液所以生津液以濡舌質拌化食物者也見圖三舌之表面乃多數極小乳頭鋪合而成此乳頭極小微點以顯微鏡窺之則時見形如芒刺摸之棘手或隱或見或大或小或平滑或高起隨時隨症變易不定中醫以舌苔辨症者苔即胃中食物腐化之濁氣堆於乳頭之上此明舌苔之所由生也常人一日三餐故苔日亦三變謂之活苔無病之象也其所以能變者因飲食入胃時將腐濁遏郁下降故苔色一退至飲食腐化濁氣上蒸苔色又生胃中無腐濁則苔薄而少有腐濁則苔厚而多此其常理也嘉約翰云凡各種重病舌皆有苔傷鳳發熱病第一層時喉核生炎舌上有一層白蜜色之苔發熱病第二層舌有厚黃色或黑色之苔若胃腸中有燥糞膽汁則逆流而上其色即黃苔色黑者表明血中有炭氣為有毒也血不清潔生津不爽並大便惡臭之時舌有一層厚黑干舌牙有黑垢舌有紫色乾薹惹厭之病將退舌即漸變濕潤黃疸病舌有膽汁色之苔身虛泄血病舌有濕苔好飲酒其舌上常有裂紋則舌體多紫其他病理西醫重實跡中醫重氣化科學哲學事實不同惟辨舌苔參西衷中義理皆同然西醫不若中醫之精且細也蓋上古之言舌苔者始自內經繼則仲景華佗素問云舌轉可治金匱云舌黃下之傷寒論云有舌白苔滑及舌乾即下諸說華佗察色訣云舌卷黑者死觀舌察病自古有之惟古人略而不詳耳至元杜清碧之金鏡錄始增至三十六舌逮後觀舌心法增廣至一百三十七舌張氏誕先取觀舌心法正其錯誤削其繁蕪共得一百二十舌名曰傷寒舌鑑而後西蜀王文選所編活人心法內有舌鑑一卷據云合張氏一百二十舌金鏡錄三十六舌正誼瘟疫十三舌擇錄一百四十九舌張氏之說亦居其九厥後梁特岩將王氏原文逐條辨正更為精密其他如傷寒舌辨一百三十五舌徐洄溪舌鑑一百二十九舌皆有可考脈理正義汪氏遵經傷寒折衷胡玉海傷寒一書郭元峰脈如周澂之傷寒補例形色簡摩診家直訣葉氏溫熱論醫門棒喝馬氏醫悟等書雖非辨舌專書然皆各有經驗發明猶當參考又如近出劉吉人察舌辨證心法紹興醫會刊印流行能獨具識見多特別發明為診斷上所需之常識亦醫家必要之書也他如何廉臣君刊行之感症寶筏原名傷寒指掌為吳坤安著邵仙根評其辨舌亦甚精確何氏增入梁氏辨正馬氏醫悟更為完備如辨舌十法原書僅六法自第七瓣暈起至第十從舌鑑辨正補入察舌八法錄舌鑑辨正者十之八馬氏醫悟者十之二惟吳氏原書無此篇為何君所增訂亦嘉惠後人之盛心也余願為表揚之其餘辨舌之法雖散見各書然其間有博而不精或略而不詳且東鱗西爪不易卒讀猶不能盡備其書如傷寒舌鑑一書近世雖已風行海內然其斷病用藥有非治溫暑時疫所宜以致初學者無入門之直徑有有書不如無書之嘆據炳章二十餘年臨證之實驗無論內傷外感以察舌為最有確憑早有斯見爰將古今名家醫書百五六十家東西洋近譯醫書三十餘家及各埠醫報雜誌三十餘種等書廣搜博採凡關於驗舌治病諸法摘錄無遺先後十年積稿盈篋戊午春悉心熏理以刪繁就簡去粕存精計存四冊凡生理解剖之實質則參用西法氣化理想之經驗則仍衷中醫越時三載稿凡五易首總論以明舌之生理解剖及功用與生苔種種之原理二編總綱以察形容質本神色津液苔垢顏色之要領三編證治以識諸家察舌辨證之法及舌病治法四編各論以別各舌病證之用藥並附精繪十一色彩圖一百三十餘枚五編雜論方案以徵明辨舌察病之實據釐訂六卷列為三十二章名曰辨舌指南茲將各章總目重述於下俾明大要第一章辨舌之生理解剖及功用分舌之構造舌之乳頭舌之脈管舌之腦氣筋舌之骨與舌根舌之細胞與神經舌之唾液腺舌之能別味與發聲功用為八節第二章辨舌之味覺神經之機能第三章辨舌審內臟經脈之氣化分手少陰心足少陰腎足太陰脾足陽明胃足太陽膀胱手少陽三焦足厥陰肝為七節第四章辨舌察臟腑之病理第五章辨舌明體質稟賦之鑑別第六章辨舌生苔之原理第七章辨舌苔有根無根之鑑別第八章辨舌察時溫與伏熱第九章觀舌之心法第十章辨舌之形容分軟硬脹癟戰痿歪斜舒縮吐弄為六節第十一章辨舌之質本分刺點瓣暈星斑裂紋凸凹直橫為六節第十二章辨舌之神氣分濃淡深淺榮枯老嫩為四節第十三章辨舌之精液分潤燥滑澀腐膩糙黏為四節第十四章辨舌之苔垢分常變觸染偏全薄厚化退滯郁為六節第十五章辨舌之顏色分白苔黃苔紅色絳色灰色黑色紫色青滑藍色為十節第十六章仲景察舌辨證法第十七章胡玉海察舌辨證法第十八章吳坤安察舌辨證歌第十九章察舌辨證之鑑別分虛實寒熱真假陰陽順逆生死為六節第二十章辨舌病證治之鑑別甲舌之體質病分腫舌木舌重舌舌菌舌黃舌疔舌癰舌瘡舌衄舌斷為十節乙舌之功用病分舌強舌瘖舌痹舌麻舌縱舌齧舌吐舌短為八節第二十一章辨舌病之治療法分舌病簡效方舌病針灸法舌病導引法為三節第二十二章白苔類診斷鑑別法計三十四舌第二十三章黃苔類診斷鑑別法計二十五舌第二十四章黑舌類診斷鑑別法計三十二舌第二十五章灰舌類診斷鑑別法計十四舌第二十六章紅舌類診斷鑑別法計二十舌第二十七章紫舌類診斷鑑別法計十三舌第二十八章醬色舌類診斷鑑別法計三舌第二十九章藍舌類診斷鑑別法計三舌統計一百四十四舌附彩圖一百二十二枚墨圖六枚第三十章辨舌雜論補遺第三十一章察舌辨證醫案第三十二章辨舌證治要方每篇列章分節或由節再分子目條分縷析各有發明須將各條互相參合方能知其真理能知綱要則其變化自可類推隅反也且可認色分經據證立方先淺見而後精深非敢貢高明之研究第以為初學之導線至於精益求精密益加密仍當參之診斷諸書以窮其變而達其微庶幾審病用藥靡有孑遺矣是乎否乎敢質博雅諸君務乞指余之不逮則余實厚幸矣中華民國九年九月重九日四明曹赤電炳章氏序于越城和劑藥局
