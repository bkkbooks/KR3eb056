front:
  text: 周序竊維四診以望居其先望者何察面色觀目神辨舌苔驗齒垢四者而已四者之中尤以辨舌為最要蓋舌為心之外候苔乃胃之明徵人之有病與否但觀苔色如何即可知其大略較之西醫用器探病尤為確切故林慎庵曰觀舌為外診要務非虛語也惜我中國四千餘年以來往聖昔賢之著作或言病理或言脈理或言治法醫籍繁多幾於汗牛充棟而辨舌之書獨少概見如杜清碧金鏡錄張誕先傷寒舌鑑梁特岩舌鑑辨正徐洄溪舌鑑等書世皆奉為圭臬然亦語焉不詳其餘散見於各書者或但舉一隅而未能綜合全體或僅述外象而不能洞澈中藏至於生理若何氣化若何功用若何則更缺焉不講以診斷上最親切最重要之點而無人焉為之發明其蘊奧闡別其機能宜乎後人之無所取法也吾友曹君炳章潛心醫學歷數十寒暑手不釋卷筆不停揮著述等身不可悉數曩有辨舌新編登諸紹興醫報海內醫林無不爭先快睹而曹君自謂辨之未詳心猶未愜近十年來復精心結撰纂成辨舌指南篇中援引古今名家醫書不下百數十家東西洋近譯名家醫書亦不下數十家且旁及各埠醫報雜誌無不廣羅博採棄其糟粕擷其精華書分六卷卷中列章分節按節又分子目條理井然且有論有圖有治法有醫案又有藥方可謂毫髮無遺憾矣自此書出庶使後之學者辨舌察病審病用藥不致茫無依據則此書詢不啻南針之指也稿既成曹君命余參校余自慚觀書不多兼年老才疏懼無以膺斯任然念曹君數年來撰述之苦心且已將敝名汞列鴻編俾駑駘下乘亦得附驥尾而顯名則余雖簡陋亦何敢負其雅意遂不得不拭老眼之昏花為之逐條披閱錯誤者更正之遺落者添注之間亦略為修飾之惟是證引既多校讎非易且搜採多西醫之說文經翻譯辨別尤難故雖反復推詳恐不免猶有疏漏之處尚望海內外博雅之士詳覽而指正之此則曹君之幸亦鄙人之幸也是為序中華民國九年季冬之月古越周炳墀越銘氏書於濂溪別墅之小隱廬
