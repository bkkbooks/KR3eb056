body:
  text: 卷四第四編辨舌各論第二十二章白苔類診斷鑑別法白苔總論一舌鑑舌乃心苗心屬火其色赤心居肺內肺屬金其色白故當舌地淡紅舌苔微白而紅必紅潤內充白苔微不厚或略厚有花然皆乾溼得中不滑不燥斯為無病之苔乃火藏金內之象也一經傷寒白苔必滑傷溫傷熱紅光必外露矣是以傷寒苟能盡解其所傷之邪而不脫其苔本來之白此善能使邪正分局元津元氣無傷焉其溫病熱病之舌亦必使紅色漸斂漸淡白苔漸有漸生此邪始得分越而元陰日漸內充也當知紅乃臟氣所蘊所發白為津液所布所結耳夫傷寒邪犯皮毛舌上先有白沫繼則白涎白滑再後則白屑白砂甚則白泡白疳有舌中舌尖舌根之不同見寒邪入里之淺深微甚即元氣之厚薄邪熱之輕重從此可測矣蓋舌固心之苗其色本當赤今反見白苔滑甚者是火不制金乃水來剋火之象故稱大病其寒鬱毛膚毛竅不得疏通陽氣不得外發故惡寒發熱在太陽時頭痛身疼項背強腰脊痛至陽明經則有白屑滿舌症雖煩躁脈如浮緊猶當汗之系少陽者白苔不滑小柴胡湯和之胃虛白苔滑甚者理中湯加桂枝托之邊白中黃大柴胡小承氣分輕重下之白苔亦有死症者即水來剋火之賊邪也其溫病熱症實由火爍金傷元陰告匱劇症臟氣安危皆關驗舌虛實寒熱之機一一分別圖論於下辨正白色為寒表證有之里證有之而虛者實者寒者熱者皆有之故白色舌苔辨病較難凡白色亦可以辨傷寒其類不一白浮滑薄其苔刮去即還者太陽表證受寒邪也白浮滑而帶膩帶漲刮之有淨有不淨者邪在少陽證半表半裡也全舌白苔浮漲浮膩漸積漸干微厚而刮不脫者謂刮去浮面而其底仍有寒邪欲化火也辨傷寒舌大約如此傷寒有黃苔黑苔分論於後若雜病之人舌白嫩滑刮之明淨者裡虛寒也無苔有津濕而光滑其白色與舌為一刮之不起垢膩是虛寒也口唇必潤澤無縫白厚粉濕滑膩苔刮稍淨而又積如麵粉發水形者裡寒濕滯也舌白粗澀兼有朱點有罅裂紋之苔粗澀則不光澤朱點則顯其臟腑有熱裂罅紋多固誤服濕藥之故白乾膠焦燥滿苔刮不脫或脫而不淨者刮去垢泥後底子仍留汙質膩澀不見鮮紅皆裡熱結實也此舌頻多其苔在舌比之面上傅粉刮之多垢其白色與舌為二物是熱證也又按此與前論之虛寒舌相反當認明此苔由淺而深將黃未黃或竟黑變者不可用溫補之藥也若白苔夾變別色見於某部即是某經病重凡表裡寒熱虛實證皆同嘉約翰云凡驗病人之舌而見其色或白或黃或濕或燥即可知其病之輕重也如舌苔有白而濕濕而厚者此必身發微熱而非大熱也至若舌白唇白則恐流血過多或因久病或因肺有壞所致也其他小兒之病舌上每有白衣內傷者身體弱極其舌亦有白衣倘以顯微鏡照之見其形似生草絲樣者險症也白為肺色胃中陽氣被飲食抑遏胃中正氣不能直達而上故有暫白之時凡病初起體溫不高津液未消耗舌必淡白而有涎沫若固消化器有妨礙又食物過多停滯不化而口腔起酸酵腐敗發生濃厚濁沫則舌起黏糊濁苔若固病有內熱使口腔津液失殺菌之力而細菌乘機發育則舌起白屑如鵝口樣若因病菌發生毒素妨礙吸氧放炭之機能致炭多氧少而分泌之口涎必腐敗則舌起白色濁膩苔若因傳染病之毒素傳至口白苔如積粉此參黃國材法也見圖八十四白苔證治圖說微白薄苔舌第一圖說中根微白邊尖淡紅苔光滑有津舌鑑此無病之舌元氣元津不厚故見此苔辨正此脾胃寒而心膽虛也無病人見此舌可勿藥裡虛證有此舌宜投溫補若初感寒邪在太陽頭痛身熱惡寒無汗脈浮緊而見此舌宜溫散表藥凡感邪尚淺者多未顯於舌必執此為傷寒之舌則謬凡風寒初入表分則舌無苔或生苔亦白潤而薄雖有發熱惡寒而口必不渴此風寒之邪雖重而津液不虧宜辛溫汗之可也白苔略厚舌第二無圖圖說中根白苔滑厚有花舌尖紅舌邊淡紅舌鑑此苔不但無病乃元津元氣充厚故見此舌辨正此脾胃微寒而心經熱也無病人有此苔可勿藥薄白滑苔舌第三無圖圖說中根苔薄白而滑尖深紅或淡紅舌鑑此太陽里證舌二三日未得汗致邪熱深入丹田急宜汗解或太陽與少陽合病宜柴胡桂枝湯汗之若舌白苔滑有津尖淡紅為寒邪初入太陽頭痛身熱惡寒宜香蘇飲羌活湯發散之辨正此脾胃微寒而心經熱也若偏於脾胃寒濕則舌白滑濕而多津宜用辛溫表散之若偏於心經熱重則舌深紅少津宜用清涼藥若初感熱邪在太陽則頭痛身熱無汗眩暈口乾鼻氣熱者宜用辛涼散邪得汗自愈此係初感邪未見於舌也不可拘定白舌為寒誤用溫散舌鑑泥二三日傷寒未曾汗太陽與少陽合病方有是舌則謬甚凡白舌苔雖薄而燥或舌邊舌尖帶紅此風熱之邪傷於氣分病在手太陰肺經只宜輕清涼解氣分如前胡蘇子杏仁連翹黃芩薄荷竹葉之類若白苔邊尖深紅少津是溫邪入肺灼干肺津不可辛溫過表宜清輕涼散為當厚白滑苔舌第四圖說中根白厚滑苔邊尖淡紅舌鑑病三四日其邪只在太陽苔純白而厚卻不幹燥症發熱頭疼脈浮緊不渴仍須汗解而愈辨正此脾胃有寒濕也表裡證皆有之傷寒邪在太陽口不幹舌不燥頭痛發熱無汗惡寒身痛脈浮緊者宜麻黃湯發汗自愈凡表證兩臉必熱若雜病里證宜茯苓白朮蒼朮乾薑附子等味若舌厚白不滑無津而燥是實熱也斷不可用此溫燥藥舌鑑治法亦合僅言表證未及里證耳如舌白苔厚而干是邪已到氣分宜解肌清熱如葛根荊芥薄荷連翹之類不可用辛溫猛汗也乾厚白苔舌第五無圖圖說中根乾白苔厚無砂邊不紅舌鑑病四五日未汗熱深微渴過飲生冷停積在內營熱胃冷故發熱煩躁厥冷苔白乾厚滿口白屑四逆散加生薑淡豆豉脈理正義云舌見白苔而乾厚者此太陽熱病過服寒劑或誤飲冷水抑遏其熱而致也先以薑桂撤其寒而後以香蘇飲汗之張石頑云白厚滑苔為胃虛寒飲結聚膈上之候每於十三四日過經改變不可泛視也辨正此脾胃熱滯也里證宜三仙丹黃芩川樸枳實加鮮石解山楂麥芽等若傷寒表證見此舌是邪熱在少陽其症多口苦耳聾發熱煩躁四肢逆冷寒熱往來宜小柴胡湯舌鑑說營熱胃冷未合若舌苔白厚而乾燥者此胃燥氣傷也而濁結不能化當先養津而後降濁若苔薄而乾者肺津傷也必用輕清之品方能達肺如麥冬蘆根汁之類若初病舌即干是津氣素竭也急當養正略佐透邪若初起舌乾脈滑脘悶乃痰阻於中液不上潮宜宣肺順氣清熱化痰未可投補也淡白透明苔舌第六圖說全舌明淨無苔淡白濕亮間或稍有白浮胖似苔且非苔也舌鑑年高胃弱雖有風寒不能變熱或誤服湯藥傷其胃氣故無苔而舌淡白通明也補中益氣湯加鹽水炒益智醋炒升柴辨正不論老幼見此舌即是虛寒宜補中益氣湯加薑桂附如風寒傷寒證均無此舌此舌為虛寒之本色若感寒邪者必有薄浮滑苔故云傷寒無此舌正義云舌白無苔而明淡外證熱胃虛也凡言苔者有垢上浮是也若無苔垢而色變者則為虛也林慎庵云光亮無苔俗名鏡面舌多見於老弱久病之人是津液枯竭之候余嘗用大劑生脈散合六味地黃湯治之因而得生者多矣左邊白苔舌第七圖說全舌淡紅薄白苔惟左邊中截至根白苔偏厚舌鑑此臟結之證邪併入臟最難療治若屬陽症口渴腹脹喜冷者宜承氣湯下之若陰結口渴而不喜飲冷胸中痞滿者宜濟川煎當歸川芎蓯蓉升麻澤瀉枳殼辨正云舌鑑治法是也右邊白苔舌第八圖說全舌淡紅薄白苔惟右邊中截至根白苔偏厚舌鑑此舌病在肌肉邪在半表半裡必往來寒熱宜小柴胡湯和解之辨正舌鑑之說是也或加茯苓有咳嗽引脅下痛而見此舌宜小青龍湯夏月自利多汗宜人參白虎湯白苔黃心舌第九圖說全舌白苔中心黃苔仍潤滑者熱輕老黃兼黑者熱重舌鑑太陽初傳陽明府病舌微黃仍潤再宜汗之苔燥腹痛葛根湯加大黃下之發熱嘔吐煩躁大柴胡湯加減下之亦有下淡黃水沫無稀糞者大承氣湯下之辨正此舌傷寒傳至陽明也若微黃而滑潤仍當汗解宜葛根湯若苔焦口渴煩躁譫語燒熱宜白虎三黃等湯若苔燥大便閉宜大柴胡湯柴胡大黃枳殼半夏赤芍黃芩生薑大棗若雜病里證見此舌中黃刮不淨者脾胃實熱也宜白虎三黃大黃酌用若中間黃苔一刮即明淨余苔俱白色不紅而多津濕潤者則為寒證宜分經辨准用辛溫藥舌鑑未盡善正義云凡舌見白苔中微黃者此太陽陽明合病也如太陽未罷雙解散太陽已罷選承氣下之張石頑云若舌苔中心黃黑而邊白滑潤者表證未盡風寒尚未化熱也傷寒則大柴胡湯解之溫熱時疫則涼膈散或白虎合承氣湯攻下之白苔黃邊舌第十圖說中根白滑邊黃薄滑苔舌鑑舌中白邊黃此裡寒外熱兼惡寒者必泄瀉五苓散加姜豉惡熱者敗毒散加葛根木香辨正白苔黃邊舌如刮之淨者無病人也所謂淨者必須清潔光明見淡紅潤澤之底若底留粗澀垢膩如腐漿一層者為不淨即是內熱刮不脫或不淨者是脾胃真熱假寒黃色是真熱白色是假寒心肺膀胱肝為陽火逼迫邪熱實火均為陽火而移熱於大腸也其為病多咳痛心胸熱小便澀大便或結或泄或瀉紅白痢熱極則脾縮不靈故亦瀉不等宜生石膏知母三黃花粉竹茹等藥小便澀者宜木通車前三黃等藥大便結或泄者宜調胃承氣湯下之紅白痢者宜芩連治痢湯舌鑑拘於白為寒誤也白苔雙黃舌第十一圖說白苔中夾兩條黃色苔然必不如圖之整齊舌鑑此陽明裡證夾溫舌也邪熱上熏土色上溢故令雙黃脈長煩躁惡寒轉矢氣者大柴胡湯下之或用調胃承氣湯辨正治傷寒以前說是也若別證見此舌是脾胃熱而諸經無病宜用生大黃三黃枳殼厚朴等藥治之半白滑半黑黃舌第十二圖說半邊白苔半邊或黑或老黃苔不拘或左或右舌鑑此舌皆寒邪結熱在臟也黃連湯加附子淡豉結在咽者不能語言宜生脈散去五味加蔥白合四逆湯十中可救一二辨正家訓云歷見此舌依此等治法十無一生白滑無苔舌虛寒體也感寒邪者色亦如此若半邊有黃黑苔則寒邪已傳裡鬱結在臟久而化火矣當舍其白滑急治其標看某邊色見老黃或黑者即從黃黑邊治左黃黑者邪火逼肝也宜用胡黃連羚羊角犀角青蒿山梔石膏知母等藥右黃黑者邪火逼膽也宜龍膽草青蒿柴胡石膏知母三黃等品黃黑苔不論結左右喉痛不能言語者宜山豆根石膏知母三黃大黃桔梗甘草等藥對病施治瞑眩乃瘳見此舌能知治法可保萬全脈理正義云舌上白苔或左或右而余見黃黑外證下利痛引少腹者熱結也熱甚者桂枝大黃湯下之無熱者用真武湯十中可救一二也白舌黑根苔第十三圖說舌苔白漸黑至根者非如圖式中根之黑白如截也舌鑑舌黑根中尖苔白者為火被水克之象雖下亦難見功辨正若黑根無積膩白苔薄滑刮之即淨舌上多津口不渴或渴而不消水者真寒假熱也宜十全辛溫救補湯加減不次急投黑根自退病即愈若黑根積膩粗澀白苔乾厚刮之不淨無津燥苔口渴消水者真熱假寒也宜十全苦寒救補湯加減不次急投黑根漸退疾乃廖舌鑑泥於火被水克之象固甚謬甚白苔雙黑舌第十四圖說黑苔兩輪布於白苔中舌鑑乃太陽少陽之邪併入胃府中氣衰竭水反上侮故手足厥冷胸中結痛理中湯瀉心湯合用如邪結在舌根不能言者不治辨正此舌乃寒邪入里化火熱逼脾胃也實熱雜證皆有之宜白虎湯去粳米甘草加大黃治之舌鑑用理中湯醫家多如此誤人不少宜慎之白苔黑點舌第十五圖說全舌白苔中見黑點是也舌鑑此少陽陽明也有表者涼膈散合小柴胡湯里證已具調胃承氣湯身有斑者從斑治用化斑湯辨正凡傷寒白苔中黑小點亂生尚有表證者其病來之雖惡宜用涼膈微表之連翹焦梔桃仁大黃甘草朴硝條芩竹葉薄荷白蜜表退即當下用調胃承氣湯舌鑑說是也白苔黑斑舌第十六圖說白苔中黑斑滿布舌鑑此苔為火伏水乘即是水來剋火涼膈散加炮薑附子炭下之十中可救一二辨正白苔黑斑舌如刮之即淨者微濕熱也宜瀉濕清熱若刮不淨者底子膩澀粗燥乾枯十二經皆實熱陽火燒陰將竭也皆里證無表證不論傷寒傳裡及諸病證見此舌者宜十全苦寒救補湯加減不次急服至黑斑退盡方愈舌鑑指白中斑點謂水剋火僅能十救一二謬甚白苔黑刺舌第十七圖說白苔上滿生黑芒刺舌鑑白苔中生滿乾黑芒刺乃少陽不解熱鬱陽明府也其症不惡寒反惡熱脈實者有宿食大柴胡湯加芒硝急下然亦多危證也辨正白苔滿黑干刺舌如刮之黑刺即淨光潤不幹口渴而消水不多身灼熱欲剝衣滾地者在雜病為真寒假熱之裡證甘溫除大熱法加減甘溫救補湯治之愈若刮之不淨乾燥粗澀乃十二經皆熱極不獨傷寒傳陽明裡證始有此舌也舌鑑謂其證不惡寒而惡熱者大柴胡湯加芒硝急下之遵傷寒舌鑑不錯今人感於時書偏說謂芒硝等藥不可輕服見有此舌不敢急投或限以一日一劑誤人多矣能辨舌利害者凡各病里證見此舌即以十全苦寒救補湯生石膏知母黃芩黃連黃柏大黃芒硝川樸枳實犀角不次急救服至黑刺退淨為止履險不必如夷白苔尖灰刺舌第十八圖說白滑苔尖微黃而有灰刺圖上白苔下多一黃字舌鑑夾食傷寒胃冷膈熱脈長者小承氣加黃芩淡豉脈弦者死辨正如濕潤刮之即淨者真寒假熱也表裡證均有宜辛溫燥濕若干厚刮不淨者是脾胃為濕熱所困心肺熱極里證也宜苦寒藥若傷寒見此舌而乾厚者亦邪熱入里熱逼心肺矣不必論脈之長短即用大承氣湯不次即下以灰刺退淨為止十不失一若服藥限於一日一劑則非救急之法舌鑑指為陽明兼少陽舌脈弦數者死拘定舊法不能急瀉裡熱宜其死也脈理正義云舌見白苔尖微有刺者此少陽陽明也表未罷者柴葛湯表已罷者承氣下之津潤者生乾枯者死白苔尖中灰根黃舌第十九圖說全舌苔白尖中兼灰根黃色舌鑑此太陽經濕熱並於陽明也舌根黃潤面黃目黃小便黃宜茵陳蒿湯加淡豆豉紫背浮萍辨正此舌太陽經濕熱並於陽明也如根黃色間白目黃小便黃者宜茵陳蒿湯加減如舌鑑之說是也白苔雙灰舌第二十圖說全舌白苔雙路灰色舌鑑此傷寒夾冷食舌七八日後見此舌而有津者可治枳實理中湯一本理中四逆選用加淡豉蔥白無津者不治如干厚見里證者下之得瀉後次日灰色去者生辨正白苔雙灰舌如潤滑一刮即亮淨者中寒鬱滯也宜薑桂附厚朴春砂香附等藥如干厚無津刮不淨者乃傷寒化火鬱熱攻裡也宜大承氣急下灰色退淨乃愈舌鑑云無津者不治非也白苔尖紅舌第二十一圖說滿舌白苔而尖色鮮紅舌鑑此乃熱邪內盛而復感客寒入少陽經也小柴胡湯加淡豆豉辨正若舌根白舌尖紅濕漸化熱余濕猶滯宜辛泄佐清熱如蔻仁半夏豆卷連翹菖蒲焦梔子綠豆衣六一散若舌邊尖紅中心燥白乃上焦氣分無形之熱其邪不在血分切勿妄投滋膩血分之藥宜輕清涼解為治白苔中紅舌第二十二圖說白苔舌中輪紅尖亦兼白舌鑑此太陽經初傷寒邪之舌乃元津內虧亦有少陽受寒經血素虛而鬱熱俱不能解者均宜小柴胡湯去半夏加淡豆豉又云有汗者解肌無汗者發汗辨正白苔中紅舌太陽經初傳也無汗發汗有汗解肌亦有在少陽者小柴胡湯加減治之舌鑑之說是也白苔尖紅根舌第二十三圖說舌尖苔白根里紅潤舌鑑此邪居半表半裡經血內虧而鬱熱不解小柴胡湯去半夏加淡豆豉辨正白尖紅根舌邪在半表半裡也其症寒熱往來耳聾口苦腳痛脈浮弦小柴胡湯和解之舌鑑之說是也根白苔尖紅舌第二十四圖說舌尖紅根苔白厚與二十一舌不同舌鑑此表邪不解而遏熱不化故惡寒身熱頭疼者汗之不惡寒身熱煩渴者此邪在太陽之裡五苓散主之辨正舌紅尖是本色白苔為表邪白浮薄滑者如惡寒頭痛身熱宜汗之不惡寒身熱頭痛煩躁者太陽表證也宜五苓散兩解之舌鑑尚是若表證初起往往不顯於舌若白苔厚膩則又為裡熱證也薛生白雲舌根白舌尖紅為濕漸化熱之兆白尖中紅根黑舌第二十五圖說舌尖中心紅舌根灰黑舌鑑為少陽邪熱傳府熱極而傷冷飲也如水停津液固結而渴者五苓散自汗而渴者白虎湯下痢而渴者解毒湯如黑根多白尖少中不甚紅者難治辨正白尖中紅黑根舌如舌尖白而根灰黑少者乃少陽邪熱傳腑熱極而傷冷飲也照舌鑑治法甚是若黑根多白尖少中鮮紅或不甚紅而乾澀者宜大承氣湯不次急投黑根退淨乃愈白苔弦淡紅舌第二十六無圖圖說全舌白苔邊沿淡紅舌鑑白苔薄白沿紅在表證為邪初入里丹田有熱胸中有寒乃少陽半表半裡證宜小柴胡湯梔子豉湯辨正舌鑑治法甚善凡邪在半表半裡者多宜散表防里若里證見此舌白苔一刮即光淨者乃寒結脾胃也宜理中湯白苔紅點舌第二十七圖說白苔滿布不滑中有硃砂紅點舌鑑此暑疫失解抑鬱心陽故見此舌宜青蒿石斛飲汗之痧疫舌亦如之脈芤澀有別宜清涼至實飲辨正此舌暑熱入營表邪未解宜清營熱泄暑邪純熟白苔舌第二十八無圖圖說白苔老極如煮熟相似到底不變厚如物裹舌者舌鑑此舌多心氣絕而肺之真臟色見也因食瓜果冰水冷物胃氣先傷陽氣不得發越所致為必死之候急用枳實理中間有生者辨正純熟白舌乃氣血兩虛臟腑皆寒極也宜十全甘溫救補湯加薑附桂不次急投至白色生活轉為淡紅乃愈若用藥遲疑虛寒過度急難治傷寒證無此舌如舌鑑謂冷食停滯用枳實理中湯必致十無一生所見多矣遍白舌第二十九無圖圖說全舌光白無苔舌鑑全舌光白為虛寒也如淡白兼微紅無苔則無病人也若瘟疫見此舌則舌上必有煙霧白色蓋滿而有惡寒發熱胸脘不清或嘔吐頭痛身痛日晡煩熱口臭難聞等症宜以十全苦寒救補湯急救之非表證也舌鑑云疫邪在表用達原飲檳榔川樸草果仁知母白芍黃芩各一錢生甘草八分二劑安者或是白滑苔舌則可否則謬蓋辨色未明懵然施治而偶中者也白苔積粉舌第三十圖說白苔厚膩如積粉邊沿紅者舌鑑此瘟疫初犯膜原舌宜達原飲見三陽表證隨經加柴胡葛根羌活見里證加大黃辨正吳坤安云凡時疫初起苔形粉白而厚四邊紅絳者此疫症初入膜原未歸胃腑其勢最雄頃刻傳變吳又可用達原飲加引經表藥透之達之如兼太陽加羌活陽明加葛根少陽加柴胡章虛谷云瘟疫白苔如積粉之厚其穢濁重也若舌本紅絳則邪熱為濁所閉故當急急透解此五疫中之濕疫又可主以達原飲梁特岩云倘舌白如積粉遍布滑而不黃者乃寒滯也宜溫中行滯表證無此舌舌鑑云邪在胃家又三陽表證用柴葛羌活湯里證加大黃俱謬余師愚云疫證苔如膩粉此火極水化誤認為寒妄投溫燥病反增劇其苔愈厚津液愈耗水不上升二火煎熬變白為黑其堅如鐵其厚如甲言語不清非舌短也宜甘露消毒飲增石膏元參犀連知翹加花粉等味白苔燥裂舌第三十一圖說舌苔白厚甚燥而裂舌鑑傷寒胸中有寒丹田有熱所以心煩舌白因過汗傷營血不能上榮於舌故滿舌無津燥裂胃無實結上熏故舌不黃黑也宜小柴胡湯加芒硝微利之脈不沉數急宜清熱養津辨正白苔燥裂舌舌鑑用小柴胡加芒硝微利之此說似是而非此方罕效白苔燥裂多因誤服溫補灼傷真陰所致非傷寒過汗所致也無黃黑色者真陰將枯竭舌上無津苔已乾燥故不能變顯他色臟腑有逼壞處故舌形罅裂也治宜大承氣湯合增液湯急下以救其陰歷試良效白苔乾硬舌第三十二圖說白苔乾硬舌有似砂皮或燥如白砂舌鑑白苔乾硬舌一名水晶苔凡厚白苔本能變黃色若此苔當其白時津液已干燥邪雖入胃不能變黃宜即下之然白苔潤澤者邪在膜原也邪微苔亦微邪毒既盛苔如積粉滿布此時未敢遽下而苔色不變口渴喜飲冷者宜服三消飲即達原飲加大黃羌活柴葛薑大棗次早即顯黃色苔梁氏辨正亦云如是辨正石芾南云其有初起白苔即燥如白砂者亦名白砂苔此溫燥之邪過重宜速下之佐以甘涼救液亦有苔至黑而不燥者或黃黑苔中有一二條白者或舌前雖燥舌根苔白厚者皆夾濕夾痰飲之故亦有苔雖黃色澆薄無地質者胃陰虛故也珍珠白泡舌第三十三圖說舌質紅或紫起粉白薄苔間雜白泡如珍珠舌鑑舌上白泡如珍珠乃火極水化之象較之紫赤黃黑古人謂之芒刺者更重宜甘露消毒飲增石膏犀連元參連翹加花粉銀花金汁水之類亦有舌見白苔組成欄圈子者曾見冬月傷寒嘔惡誤服白虎湯脈伏舌苔成圈如白豹紋用正氣散加肉桂丁香炮姜數服愈孕婦白苔舌第三十四無圖圖說孕婦白苔與前各條鑑別無異然必須兼察面色舌鑑孕婦初傷於寒即見面赤舌苔白滑發熱惡寒當微汗以解其表如誤與涼劑則腠理密秘而邪氣漫無解期甚則入里必厥逆吐利而死辨正孕婦傷寒白舌初傷於寒身熱頭痛無汗兩臉鼻氣俱熱脈浮舌上白浮滑者宜溫散太陽表藥得汗則愈若無表邪而有白浮滑苔或白嫩無苔濕潤者則裡虛寒也宜溫中之藥舌辨云舌白麵赤言孕婦初傷於寒微汗之表解邪退則安不然恐邪傳經如八九月胎受邪熱致令不安恐有墮墜之驚湯內可加黃芩白朮保固其胎又云孕婦面白舌亦白皆因傷寒四五日發熱多食冷水瓜果冷物致令陽極變陰雖有煩躁而手足厥逆當先治厥逆為重以溫中之藥加減治之則安若見煩躁用清涼則危殆矣又一孕婦傷寒證愈次病頭面腫大而癰甚難禁余用三黃俱酒浸煮鼠黏子薄荷白芷石膏四劑全安第二十三章黃苔類診斷鑑別法黃苔總論二舌鑑黃苔者里證也傷寒初病無此舌邪傳少陽亦無此舌直至陽明腑實胃中火盛或邪遏胃虛土氣洋溢均能見此初起微黃不滑次則深黃苔尚滑甚則干黃焦黃也種種不同當分輕重治之夫微黃不滑者火初入胃宜清解梔子豉湯主之深黃苔尚滑者乃邪郁胃虛熱迫於胃而土氣洋溢也宜汗解葛根解肌湯干黃邪雖外解火實內熾宜白虎湯焦黃土燥火炎陰液告竭宜急下謂胃承氣湯若濕熱發黃則目黃如金身黃如橘茵陳蒿湯分利之至蓄血發黃在上焦犀角地黃湯中焦桃仁承氣湯下焦代抵當湯然必大熱不解大渴飲水或漱水不欲咽及便秘譫語痞結自利或小腹滿硬小便不利大便反黑臍下作痛此血瘀證也見血必愈不可與飲冷水飲之必死方可議清議下若胃虛黃色外溢又當補中而佐以和解大抵舌黃證雖重劇脈長是中氣有權為可治如黃中見黑脈急弦細為水土無氣必不可治矣辨正黃色舌苔表裡實熱證有之表裡虛寒證則無刮之明淨即為無病必須清潔光明見淡紅潤澤之底凡言淨者皆仿此刮之不淨均是熱證刮後仍留粗澀垢膩如薄漿腐一層者或競刮不脫者淺黃膩薄者微熱也乾澀深黃膩厚者大熱也芒刺焦裂老黃或夾灰黑色者極熱也黃苔見於全舌為臟腑俱熱見於某部即是某經之熱表裡證均如此辨乃不易之理也表證風火暑燥皆有黃舌惟傷寒邪在太陽少陽時均無黃苔待邪傳陽明府其舌必黃初淺久深甚則老黃或夾變灰黑其症多大熱大渴或無汗或自汗譫語痞結咽乾目暗大小便閉衄血吐血蓄血如狂自利清水不等以舌脈相較審證無誤皆邪火里逼實熱里結諸危證其脈往往伏代散亂奇怪難憑則當舍脈憑舌專經急治斯為盡善若泥於火乘土位故有黃苔之說迂執誤人矣凡舌苔淡黃為正色虛病黃苔必嫩而潤實病黃苔必粗而燥黃苔有因病熱漸重而口涎為病毒變壞酸素減少炭氣堆積致滿口穢濁故苔厚而黃如化學之輕綠然活則色黃亦有因膽汁不能出清肝液困在血里而舌現黃色也黃苔證治圖說初病微黃舌第三十五圖說舌邊淡紅中根淡黃而潤滑舌鑑初病舌微黃者此表邪將罷而入里也雙解散主之表未罷者小柴胡湯合天水散表已罷者大柴胡湯下之辨正傷寒初病大汗謂當用表散之時失誤未表也表邪入里見此舌者每發譫語宜並用雙解散防風荊芥連翹麻黃薄荷川芎當歸白芍白朮山梔黃芩石膏枯梗甘草滑石解表兼解里調氣復和血故曰雙解解毒湯汗下兼行舌鑑之說亦是若熱邪內傳入深及雜病里證見此舌均為實熱宜白虎三黃等湯治之久病微黃舌第三十六無圖圖說舌微黃而不甚燥舌鑑表邪失汗而初傳於裡也用大柴胡湯身目俱黃者茵陳蒿湯辨正日久微黃舌如傷寒表病未罷者宜小柴胡湯合益元散若微黃而兼膩者宜大柴胡湯下之若身目俱黃者熱濕也宜茵陳蒿湯表裡併除舌鑑是也如雜病里證見此舌者均為實熱如黃色一刮即淨者為無病可以勿藥張石頑云黃濕而滑者為熱未盛結當未定不可即攻攻之初硬後溏也冬時宜守此例俟結定乃攻不得已大柴胡湯微利之若在夏日一見黃苔便宜潤下以夏月伏陰在內多有下證最急而苔不燥者不可泥也若苔黃薄而滑者是熱邪尚在氣分津液未亡宜用柴葛芩翹梔豉薄荷之類輕清泄熱以透表邪從肌分而解微黃不滑舌第三十七無圖圖說白中帶黃或微黃而薄苔不滑邊尖仍淡紅舌鑑少陽證罷初見陽明裡證故苔變黃色不燥兼矢氣者大柴胡湯倍半夏以下之若舌見黃苔而澀者此必初白苔而變黃正陽陽明也大承氣湯下之下後黃不退者死身有黃者茵陳大黃湯辨正白苔變微黃舌傷寒表邪失於汗解初傳陽明寒邪已化火其證多大熱大渴宜竹葉白虎湯從陽明經發汗清解之自愈此邪在半表半裡不可驟下如舌鑑急下之必致陷胸矣如全舌皆變黃而苔澀則宜大承氣湯下之吳坤安云如見舌苔白中帶黃或微黃而薄是邪初傳陽明猶帶表證微兼惡寒宜涼散之若微黃黏膩口不渴飲而胸中滿悶者此濕邪結於氣分宜白蔻橘紅杏仁鬱金枳殼桔梗之屬開泄氣分使邪仍從肺衛而出則解矣不可用瀉心苦泄之法逼邪入里凡舌苔黏膩口不渴為濕邪之證據白而黏膩者寒濕黃而黏膩者濕熱更驗其小便不利大便反快為濕邪痞滿結於中焦宜蒼樸二苓二陳之類苦溫以開泄之若舌黃黏膩痞悶嘔惡大小便俱不利此濕熱結於中焦宜瀉心湯之類苦辛寒以開泄之可也深黃尚滑舌第三十八圖說苔色深黃而滑邊尖淡白微紅舌鑑邪熱失汗迫於中宮故見此舌急宜涼解以發泄之不致斑黃狂亂耳辨正凡舌見黃滑苔外證身目俱黃小便亦黃宜用茵陳梔子湯如便閉加大黃下之舌辨舌見黃苔而滑者此身已發黃茵陳梔子湯茵陳五苓散正義黃滑而濕者為熱未盛結當未定不可便攻石頑黃苔不甚厚而滑者熱未傷津猶可清熱透表苔雖薄而乾者邪雖去而津受傷也苦重之藥當禁宜甘寒輕劑可也葉天士純黃微干舌第三十九無圖圖說全舌純黃微干少津舌鑑舌見黃苔胃熱迫於內黃色見於舌火灼津干急宜調胃承氣湯下之勿令變黑致危耳舌辨云舌見純黃苔胃熱已板宜急下之遲恐由黃老變黑色為惡證調胃承氣湯下之張石頑云苔黃厚而燥者為熱已盛下之無疑厚苔漸退而底見紅舌如豬肝者火灼水虧津液枯竭也辨正純黃微干舌傷寒傳經至陽明府寒邪已化火故舌中猶黃其症多大熱大渴譫語不等宜白虎湯不次急投至黃苔漸退乃愈如雜病里證見此舌者是臟腑皆熱極宜三黃承氣酌用吳坤安曰舌苔黃而兼燥外證不惡寒反惡熱是傷寒外邪初入陽明之裡或濕熱內邪欲出陽明之表斯時胃家熱而來實宜梔豉白虎湯清之可也又云苔雖黃而未至焦老裂紋起刺大便雖秘而未至痞滿鞕痛尚屬胃家熱而來實宜清不宜攻必再驗其舌形黃厚焦老中心裂紋或起刺腹中鞕滿脹癰方用承氣下之則安黃干舌第四十圖說全舌乾黃舌鑑舌見干黃裡熱已極急下勿緩下後脈靜身涼者生反大熱而喘脈躁者死正義云舌中心黃苔者此太陽陽明也必作煩渴嘔吐之症兼有表者五苓散合益元散表證已罷調胃承氣湯下之辨正黃干舌全舌乾黃臟腑均大熱有病皆屬裡證不論傷寒雜證見此舌即為實熱宜十全苦寒救補湯不次急投雖大熱喘煩頻瀉亦不慮以服至黃退色潤為愈十無一失舌鑑云下後脈靜者生大熱喘煩者死是未知舍脈憑舌之法又不敢連用苦寒何以望生黃尖舌第四十一圖說中根淡紅舌尖苔黃舌鑑舌尖苔黃此熱邪傳入胃腑而元陰素虧也謂胃承氣湯加入參生地脈浮惡寒表未盡解大柴胡加生地人參正義云黃苔在尖者此太陽合陽明也表未罷者雙解散表證已罷者調胃承氣湯其根紅者為太陽其根白者為少陽其根黑者死候也辨正黃尖舌邪熱初傳胃腑也宜調胃承氣湯大黃芒硝甘草如脈浮惡寒表證未盡則宜大柴胡湯兩解之舌鑑是根中漸黃舌第四十二圖說根中漸黃邊尖白滑厚苔舌鑑根中漸黃舌外有白厚苔熱邪傳膜原也舌根漸黃至中央邪初入胃也如有疫證已傳三陽宜達原飲如胸膈滿痛大渴煩躁者伏邪內攻也宜急用三消飲下之如既下後大便燥結又難再攻者宜清燥養榮湯知母花粉當歸白芍陳皮地黃汁甘草燈心疫為熱病暴攻之後餘邪未盡陰血未復不可遮補致生異證凡陰桔血澀者宜用此湯或承氣養榮湯即小承氣加知母當歸白芍生地治伏邪未盡攻補兩難者如痰壅不清胸悶脅脹者宜蔞貝養榮湯知母花粉貝母瓜蔞霜橘紅白芍當歸蘇子生薑如疚中帶血加藕節鮮茅根辨正舌鑑治法甚是黃尖白根舌第四十三圖說黃尖中根白厚舌鑑舌根白尖黃者其色倒見反乎尋常必少陽邪熱傳入陽明府也陽明證多者大柴胡湯少陽證多者小柴胡湯若譫語煩躁調胃承氣湯少和之辨正黃尖白根舌傷寒少陽膽經傳陽明府病也若陽明證多者宜大柴胡湯少陽證多者宜小柴胡湯如譫語煩躁內熱者宜調胃承氣湯前說是也白尖黃根舌第四十四圖說舌尖白舌根黃苔舌鑑凡尖白根黃乃表邪將解而裡熱盛也天水散涼膈散合用如陽明無汗小便不利心中懊憹者必發黃茵陳蒿湯辨正舌鑑治法亦是如大便難胸中悶睡時多夢者里證實熱也宜調胃承氣湯又云如傷寒見尖白根黃為表證未罷宜先解表熱然後攻裡如大便塞者宜涼膈散小便澀者宜四苓散合益元散加木通是也若雜病見此舌屬實熱里證宜分經審病用苦寒藥舌辨云黃根白尖乃合病有之是太陽表證傳入陽明裡證循經而傳也如有表邪一分必須解表必待表邪盡方可攻裡也正義云根黃尖白表少里多宜天水一涼膈二合服之脈弦者防風通聖散又云舌上黃苔在根者此邪傳太陽也身有黃者茵陳大黃湯身無黃者涼膈散加硝黃其尖白者桂枝大黃湯小便澀者五苓散合六一散加木通生薑汁其說亦是黃根白尖短縮舌第四十五圖說舌根黃中心紅尖色白短縮不能伸出口外舌鑑根黃尖白短縮不能伸出但多譫妄煩亂此痰挾宿食佔據中宮大承氣湯加生薑半夏治之辨正若黃根白尖短縮而硬不燥不滑但不能伸出口不渴其症多譫語煩亂乃痰挾宿食佔據中宮大承氣湯加薑汁半夏前法是也若黃根白尖中紅赤者表少里多也宜涼膈散黃大脹滿舌第四十六圖說舌黃脹大滿口舌鑑舌黃脹大乃陽明胃經濕熱蘊結不消也身黃便閉口渴煩躁茵陳蒿湯小便不利無熱者四苓散加茵陳梔子黃連治之辨正黃大脹滿舌乃陽明胃經濕熱上乘心位也致令人眼黃身黃身熱便閉口渴煩躁茵陳蒿湯茵陳先煎梔子大黃後入若小便不利而發黃者宜四苓散白朮茯苓豬苓澤瀉加茵陳梔子黃連木通如舌鑑是也如大便自利而發黃者宜茵陳梔連湯治之如無上各症而發熱煩躁胸中滿悶困倦不安者宜大承氣湯葉天士云若神情清爽舌脹大不能出口者此脾濕胃熱鬱極化風釀痰而毒延口也用大黃磨入當用劑內則舌脹自消矣黃苔黑心舌第四十七圖說全舌黃苔中心黑滑或通尖舌鑑舌黃而有黑滑心者陽明裡熱甚也雖不幹燥亦當下之下後身涼脈靜者生大熱不止脈躁者死若黃苔中心黑膩是胃熱蒸動脾濕蘊結中宮以致痞悶嘔吐便閉用瀉心湯開泄中焦嗜酒人多此症此亦舌鑑說也辨正黃苔黑滑舌其黑滑在中者均陽明胃裡證宜白虎湯加三黃不次急投至舌淨而止如大便閉則加大黃舌鑑謂下後身涼脈靜者生大熱脈躁者死若舍舌執脈以判生死實因閱歷未深欺己欺人耳下同正義云舌中心起黑苔者此陽明病也以大承氣湯下之津滑者生乾澀者死未傷飲食可治脈沉微者難治若黑色淺淡而有表證雙解散加解毒湯吳坤安曰舌中心屬胃凡腸中有燥屎舌心必有黃燥黑燥等苔若腹無鞕滿耕痛之狀亦須養陰潤燥不可妄用承氣攻之黃苔中黑通尖舌第四十八圖說全舌黃苔從中至尖皆黑色舌鑑黃苔從中至尖通黑者乃火土燥而熱毒最深也兩感傷寒必死惡寒甚者亦死如不惡寒口燥咽乾而下利臭水者可用調胃承氣湯下之十中可救四五口乾齒燥形脫者不治辨正黃苔中黑通尖舌乃心肺脾胃腎大腸小腸均熱極也皆里證無表證若兩感傷寒見此舌則邪已入陰矣治法與實熱證同若昏懵或惡寒或不惡寒口乾苦齒燥咽乾頭面自汗如珠出至頸而止大小便秘下利臭水六脈怪奇伏代各證若見此舌醫書俱云不治然用十全苦寒救補湯分為三黃白虎湯大承氣湯白虎湯三劑分三則服力足循環連服不次急投約兩點鐘內三劑各飲一服如舌中黑漸退則可略疏至黑苔退淨乃愈此舌多為危病能對症用藥十可救七舌鑑用調胃承氣湯又不急投十中恐難救一黃尖黑根舌第四十九圖說舌尖黃中根皆黑黃少黑多舌鑑尖黃少根黑多雖無惡證惡脈誠恐暴變一時以胃氣竭絕故耳舌辨云根黑多而尖黃少為心胃無氣雖無熱候脈雖有力恐暴變一時耳辨正黃尖黑根舌黑處多而尖尚黃是各經皆極熱而心經尚未甚極也不論何病皆屬裡證即用苦寒救補湯分單間服以大承氣另為一單不次急投以服至黑根退淨為準病即愈若畏用苦寒雖胃氣未竭亦必轉瞬而絕也如舌鑑之迂甘心坐視見死不救矣根淡紅尖黃舌第五十圖說舌根淡紅中灰黃尖嫩黃苔滑膩舌鑑舌根紅尖黃者乃濕熱乘於心位也傷寒里證初受其症身熱燥渴便秘大柴胡湯主之溫熱初病亦有此舌涼膈散解毒湯酌治之辨正黃尖紅根舌溫熱初病多有此舌宜涼膈散連翹大黃芒硝甘草梔子黃芩薄荷竹葉解毒湯黃連黃芩黃柏黃梔等消息之舌鑑之說是也紅心黃滑舌第五十一圖說舌根黃滑中淡紅尖紅赤舌鑑濕熱內盛陽明胃腑受病故舌根微黃頭汗小便難者茵陳蒿湯加桅子香豉辨正中紅根微黃滑苔傷寒邪傳陽明胃腑宜白虎湯若頭汗身涼小便難者宜茵陳蒿湯加梔豉舌鑑之說是也若無病人見此舌為臟腑微熱可以勿藥倘有病發勿投溫補黃變沉香色舌第五十二圖說舌苔老黃而兼灰焦燥之狀似沉香之色舌鑑黃變沉香色老黃焦燥之狀也若胸滿熱甚則全舌將變黑生芒刺邪毒最深宜三消飲加重大黃或以大承氣下之後酌用養榮諸湯辨正吳坤安云舌苔老黃燥裂即沉香色為陽明實滿滿及臍下少腹若舌苔白而黏膩為太陰濕滿滿在心下胃口大陰濕滿宜苦溫開之蒼樸二陳二苓之類陽明實滿按之痛者熱痰固結也小陷胸湯主之嘔惡溺澀者濕熱內積也宜瀉心法石芾南云若舌如沉香色或黃黑而燥脈沉實而小甚者沉微似伏四肢發厥或渴喜熱飲此皆裡氣不通酌用三承氣湯下之陰傷者加鮮生地元參鮮蘆根之類速下其邪即所以存津液也必得苔退脈靜身涼舌之兩旁生白薄新苔方為邪盡黃苔灰尖舌第五十三圖說舌根黃中淡紅尖灰色舌鑑舌乃心位今見根黃尖灰是胃土來侮心火不吐不利心煩而渴者乃胃中有鬱熱邪火甚則上乘客位或渴甚有轉矢氣者調胃承氣湯加黃連下之乃安辨正舌鑑治法亦是因舌尖屬心灰色在尖故兼清心吳坤安云黃苔中心絳者心受胃火蒸灼也於清胃藥中加清心之品其勢必孤矣黃苔灰根舌第五十四圖說舌根灰色而中尖黃滑舌鑑舌根灰色而尖黃雖比黑根稍輕再過二三日亦黑根也難治無煩躁直視脈沉有力者宜大柴胡加減治之如煩躁直視宜大承氣湯下之辨正舌鑑治法甚是惟只舉一端耳黃苔黑點舌第五十五圖說全舌黃苔上間生黑點舌鑑黃苔黑點舌乃臟腑俱熱也宜先投調胃承氣湯後進雙解散辨正黃苔黑點為臟腑實熱也如傷寒傳裡化火或感暑熱邪逼里及雜病實熱里證皆有此舌均宜白虎湯與大承氣湯間服不次即投候黑點退淨方愈舌鑑治法尚非妥當黃苔黑斑舌第五十六圖說全舌黃燥間生黑斑無津舌鑑黃苔中亂生黑斑者必大渴譫語身不發斑大承氣湯下之如脈澀譫語循衣摸床身黃斑黑者俱不治下出稀黑糞者死見黃糞者生正義云舌見黃苔而中有斑者此身有斑也化斑湯合解毒湯治之無斑者大承氣湯下之次進和解散十中可救四五辨正黃苔黑斑舌在雜病為臟腑實熱在傷寒為邪傳陽明轉入三陰其症或大熱大渴譫語狂亂口燥咽乾循衣摸床身熱黃黑斑不等醫書多雲不治如見此舌即用十全苦寒救補湯倍加生石膏限定時刻不次急投服至黃黑苔漸退則病立愈舌鑑治法未周到黃苔膈瓣舌第五十七圖說舌黃乾澀中隔有花瓣形舌鑑舌黃乾澀而有隔瓣者乃邪熱入胃毒結已深煩躁而渴者大承氣湯發黃者茵陳蒿湯舌辨加大黃下之少腹痛小便利者有瘀血也抵當湯結胸頭汗大陷胸湯水在兩脅作痛十棗湯辨正黃苔生瓣舌苔黃而澀中有花瓣形者熱入胃府邪毒深矣心火煩渴宜大承氣湯急下之身黃如橘目黃如金者宜茵陳蒿湯如下焦蓄血者宜桃仁抵當湯熱在下焦少腹鞕瘀血在裡小便自利屎硬如狂善忘諸症宜通瘀湯大黃生地歸尾桃仁穿山甲元明粉猺桂心蓄血在脅內腫脹者宜十棗湯莞花醋炒甘遂麵煨大戟蒸曬大棗先煮結胸甚者宜大陷胸湯傷寒當表而誤下之脅痛煩躁心下鞕癰者為結胸方用大黃芒硝甘遂先煮大黃有瘀血者宜大黃瀉心湯舌鑑盡善凡用諸方皆須重劑勿妄用須熟於傷寒隨症詳審黃苔黑刺舌第五十八圖說全舌老黃苔中有黑刺舌鑑舌苔老黃極中有黑刺者由失汗邪陷毒結已深急用調胃承氣下之十中可保一二辨正黃苔黑刺舌乃臟腑熱極也在雜病為實熱里結在傷寒為邪己傳裡不論何病均宜白虎湯及大承氣湯循環間服至苔刺退淨乃愈舌鑑用調胃承氣僅微下之不敢連投苦寒臟腑必壞逡巡亦是誤人吳坤安曰如厚黃燥刺或邊黃中心焦黑起刺臍腹脹滿硬痛乃陽明裡證也承氣湯下之葉天士曰舌上生芒刺者皆上焦熱極也章虛谷云凡舌生芒刺者苔必焦黃或黑無苔者舌必深絳其苔白或淡黃者胃無大熱必無芒刺或舌尖或兩邊有赤小瘰是營熱鬱結當開泄氣分以通營清熱也上焦熱極者宜涼膈散主之秦皇士云凡渴不消水脈滑不數亦有舌苔生刺者多是表邪夾食用保和湯加竹瀝萊菔汁或梔豉湯加枳實並效若以寒涼抑鬱則譫語發狂愈甚甚則口噤不語矣亦不可不知也孕婦黃苔舌第五十九無圖圖說孕婦黃苔燥潤老嫩同前看法然必須參合面色舌鑑孕婦傷寒發熱不惡寒舌苔黃此邪入陽明表裡俱熱當清解以泄其熱熱解而胎自安矣孕婦面赤舌黃一二月是表證當汗之芎蘇等藥輕表出汗則安如五六月見里證時無凶證當微利之庶免熱邪傷胎之患若面色俱黃此失於發汗濕熱入里所致當用清熱利水藥辨正孕婦傷寒黃苔舌邪已化火宜白虎湯急服則愈若稍遲疑恐即傳三陰傷寒治法男女無殊若非傷寒即為裡熱宜白虎三黃審證酌用第二十四章黑苔類診斷鑑別法黑苔總論三舌鑑傷寒五七日舌見黑苔者最為危候熱在表無此舌如兩感一二日間偶見黑舌此心腎之氣敗絕於內臟色外見於舌黑獨見而赤不見者水能滅火為必死也若白苔上漸漸中心黑者是傷寒邪熱傳裡之候紅舌上漸漸有黑心者乃濕熱疫癘傳變壞證將至也蓋舌色本赤今反見黑者是水來剋火水極似火火過炭黑之理然有純黑有黑暈有芒刺不隔瓣更有瓣底紅瓣底黑之不同舌苔雖黑苔底色紅外證雖危尚可救治大抵尖黑猶輕根黑最重如全黑而舌底亦黑者雖有神丹亦難救治也辨正凡舌苔見黑色病必不輕寒熱虛實各證皆有之均屬裡證無表證也在傷寒病寒邪傳裡化火則舌苔變黑自舌中黑起延及根尖者多自根尖黑起者少熱甚則芒刺干焦罐裂其初必由白苔變黃由黃變黑甚至刮之不脫濕之不潤者熱極傷陰也病重脈亂舍脈憑舌宜用苦寒以瀉陽急下以救真陰在雜病見黑苔皆因實熱傳裡也亦惟連瀉熾火毋使枯竭若虛寒而舌黑者則必濕滑無苔多津口不苦唇不燥無朱點無芒刺無罅裂刮之明淨如水浸豬腰有淡淡融融之形是臟腑極寒之舌也宜用十全辛溫救補湯亦有真寒假熱證而見黑舌者其舌必全黑而不分經且必由淡白之時忽然轉黑其初無變黃之一境約略望之似有焦黑芒刺干裂之狀然刮之必淨濕之必潤環唇皆白而不紅焦寒結在臟也其症亦周身大熱煩躁惡衣被與實熱邪火證相似實則中宮寒極陽氣盡發於外也口大渴喜飲冷水且不多與實熱諸證略異外假熱內極寒也患此假證之人必煩亂昏沉六脈必遲弱無力大便結常欲下而不下宜甘溫救補湯更有腎陰水虧而舌黑者頗似寒舌之光亮無苔又似熱舌之焦乾無津宜六味地黃湯加減即投然陰虛內陽之舌大都絳色無苔若腎虛絕則舌黑過尖言歸於命別無治法舌色全黑當即死而有遲延未死者非臟腑熱極即為極寒尚留一線生機苟能辨准且可不死亦有煙癮舌黑與誤食物而染黑看法當比平常病人之黑舌減二等推算按舌現黑色者因肺不能改換炭氣漸侵營分而入血分黑色者血分火爍瘀濁之極也若燥硬而隱隱見紫者是因血分受熱蒸灼以致血絡中被酸素燃燒放出發酸二空質於舌上故舌呈黑色之苔熏蒸日久則血敗壞故舌質亦黑為不治證也若舌柔潤隱隱淡黑者水飲結而氣不流行以致血瘀也若苔燥黑為熱邪深入少陰陰液全乾血瘀氣濁發見枯滯之死色也黑苔證治圖說純黑苔舌第六十圖說全舌純黑有潤有燥舌鑑全舌黑苔火極似水也臟氣已絕也脈必代結一二日必死辨正滿黑舌凡舌色純黑本為陰絕當即死而有遲延未死者非臟腑極熱即為極寒尚留一線生機苟能辨准寒熱卻可不死如全黑無苔而底紋粗澀乾焦刮之不淨者極熱也不論何證何脈皆宜十全苦寒救補湯數倍生石膏急投必愈如全黑無苔而底紋嫩滑濕潤如浸水腰子淡淡融融洗之不改色者極寒也不論何證何脈宜十全辛溫救補湯重加薑桂急投可愈舌鑑有謂水來剋火百無一生則迂甚矣純黑無苔舌第六十一圖說全黑無苔無點刺舌鑑全舌無苔而中心淡黑冷而滑者少陰寒證也四逆湯主之辨正全黑無苔舌如無點無罅濕滑多如水浸腰子淡淡融融者極虛寒也宜十全辛溫救補湯如無點無罅乾燥少津光亮似錢者即絳舌之變陰虛腎水涸也妊娠者亦有之宜十全甘寒救補湯生地麥冬天冬生玉竹元參北沙參山藥丹皮地骨皮澤瀉加減酌用如有點有罅乾燥無津澀指如銼者極實熱也宜十全苦寒救補湯數倍生石膏不次急投服至黑色轉紅則痊如黑色暗淡無苔無點無罅非濕非干似亮不亮者陽虛氣血虧也久病見之不吉宜十全甘溫救補湯凡見此舌皆危證也寒熱虛實務當詳辨稍有不明便易取禍純黃黑苔舌第六十二無圖圖說純黃舌質滿黑苔垢滑潤者舌鑑舌黃而苔黑滑者陽明裡證全也宜下之下後身涼脈靜者生仍大熱煩躁者死也辨正純黃黑苔舌乃實熱已極逼傷真陰也不論何病何脈均里證無表證病人氣血不舒脈多伏亂難憑確見其舌純黃兼黑苔厚乾澀刮不淨謂底子不清潔光明不顯淡紅潤澤之色也或刮不脫者即用破格三黃白虎湯黃芩黃連黃柏生石膏知母破格重用也與承氣湯大黃芒硝川樸枳實循環間服不次即投服至黑苔退淨則愈中心黑苔舌第六十三圖說邊黃白色中心黑苔舌鑑中心黑苔舌若身熱溲短便閉者宜承氣湯酌下之辨正中心黑苔舌若刮之即淨濕潤多津者真寒假熱也治宜十全辛溫救補湯不次急投至舌色不黑則病愈若刮之不淨乾焦膩厚者脾胃熱極也不論何症何脈宜破格苦寒救補湯加石膏不次急投服至黑淨則愈舌鑑但知用承氣下之而不兼涼脾胃勢難全愈也黑燥厚心苔舌第六十四無圖圖說舌中心黑厚苔乾燥而邊尖紅色舌鑑中心黑厚乾燥邊紅者此邪熱灼爍津液枯槁之候宜生脈散合黃連解毒湯黃龍湯以下之辨正中心黑厚苔舌苔燥厚脾胃熱極也宜破格三黃白虎大承氣湯相間連服至黑淨乃愈舌鑑用生脈散合黃連解毒湯雖無大誤然病難愈吳坤安曰舌苔黑燥為陽明之熱腹無痞滿硬痛非承氣證只宜清解若清之不應是腸中有燥矢與熱固結胃土過燥腎水不支胃中陰液已干宜大小甘露飲以救胃汁陰液充溢陽邪自解二便自通也中黑無苔乾燥舌第六十五無圖圖說舌黑無苔邊紅乾燥舌鑑此津液受傷而虛火用事也脈必細數證必昏沉急宜生脈散合附子理中湯主之辨正中黑無苔乾燥舌此舌宜詳辨如中黑無苔而舌底乾燥有小點紋可見者乃胃經實熱並無六氣侵擾也宜破格白虎三黃湯治之如中黑無苔而舌底濕嫩光滑無苔無點紋者乃胃經虛寒亦非六氣所擾也宜附子理中湯加肉桂黃耆治之舌鑑不辨寒熱專用生脈散合附子理中湯誤人不少中黑無苔枯瘦舌第六十六圖說舌形枯瘦質不甚赤色黑無苔舌鑑傷寒八九日過汗津枯血燥舌黑無苔而枯瘦大便五六日不行腹中不硬滿神昏不得臥或時呢喃嘆息者炙甘草湯減桂加當歸知母主之辨正舌鑑治法是也若雜病里證見此舌者乃脾胃素熱而又誤服溫補辛燥藥傷其真陰也宜大承氣湯下之張石頑曰中黑而枯或略有微刺色雖黑而中無積苔舌形枯瘦舌質而不甚赤其證煩渴耳聾身熱不止大便五六日或十餘日不行腹不硬滿按之不病神識不昏晝夜不得睡稍睡或呢喃一二句或常笑或嘆息此為津枯血燥之候急宜炙甘草湯或生料六味地黃丸換生地合生脈散加桂滋其化源庶可獲生誤與承氣必死誤與四逆亦死亦有直中少陰真寒始病不發熱舌心便黑色非由黃白而變黑其苔雖黑而滑舌亦瘦小此真臟寒外證必厥冷昏沉自利嘔吐脈沉遲四逆附子輩急溫之稍緩則不救吳坤安云若苔黑而堅斂焦刺如荔子形者乃陽亢陰竭胃汁腎液俱竭也不治黑干短舌第六十七圖說舌乾焦黑短縮舌鑑黑干短舌乃手厥陰三焦足厥陰肝經二經熱勢已深至危症也或食鬱熱極舌腫所致宜急大承氣湯舌辨加芒硝下之服後糞黃熱退則生糞黑熱不止者雖下亦死辨正黑干短舌舌鑑謂厥陰熱極或食填中脘腫脹所致急用大承氣下之所論甚是又云十中可救一二服後糞黃熱退則生否則死者此識見未透僅知試用承氣而不敢多投若能連服十中必能救八九也白滑黑心舌第六十八圖說邊白苔中心黑苔舌鑑白苔中黑為表邪入里之候若太陽不解大熱譫語承氣等加淡豉鮮生地下之倘食復發熱不止下利者死辨正白滑苔黑心舌若刮之即淨而濕潤者真寒假熱舌也宜十全辛溫救補湯附子乾薑肉桂半夏豆蔻川椒丁香藿香若刮不淨而膩澀粗燥者實熱里證也宜平陽清裡湯生石膏知母黃芩黃連黃柏犀角羚羊角生甘草表邪入里者亦有之大熱譫語或食復發熱不止者皆宜十全苦寒救補湯加減不次急投凡言不次急投者皆當循環連進此余歷代家傳經驗者也服至黑苔退淨為準遲疑難治乾白黑心舌第六十九圖說舌心燥黑邊乾白無神舌鑑舌苔邊白中心乾黑太陽汗出不徹熱已入府也頭汗者可下之調胃承氣湯少加淡豉多加鮮生地二三日未汗者死辨正乾白苔黑心舌其黑苔濕潤一刮即淨者里證真寒假熱舌也當以十全甘溫救補湯人參黃耆白朮大熟地川芎歸身鹿茸白芍茯神甘草若干黑刮不淨是傷寒邪已化火傳陽明胃腑證常發熱譫語口乾渴不惡寒或自汗從頭面出至頸而止者不等宜白虎湯不次急服至黑苔漸退周身出汗透徹燒退即愈矣倘服白虎數劑而中苔仍乾黑燒熱未退大便閉結繼以大承氣湯間用破格白虎三黃湯不次急投必俟乾者濕黑者退則病愈若不明利害偏執臆斷之書忌用苦寒自誤其生別無補救之法如舌鑑云二三日未汗有此舌必死皆因臨證少未能憑舌求治耳辨傷寒舌必拘幾日見某色是食古不化以耳為目誤已誤人矣白苔尖根黑舌第七十圖說中邊白苔尖根黑苔舌鑑根尖俱黑而舌中尚白者金水交衰火土氣絕於內也傷寒得之雖無凶證終不可治辨正白苔尖根俱黑舌乾厚刮不淨者乃心腎熱極脾胃真熱假寒也其症多發熱譫語呃逆乾嘔食物即吐昏迷似睡而卻非睡惟十全苦寒救補湯不次急投勿稍遲緩黑色退淨方愈舌鑑謂金水太過火土氣絕乃臨證少治法窮之論也邊白中黑滑苔舌第七十一圖說中黑滑邊尖白滑舌鑑舌中心黑滑舌邊尖白滑此表裡虛寒夾濕相搏之候脈必微弱症必畏冷附子理中湯溫之夏月過食生冷而見此舌則宜大順冷香二方選用張石頑云黑而滑潤或邊白者必夾寒食古法用大順散然不若理中合小陷胸湯最當若挾痰者多見灰色之苔多由邪熱關及血分致此余如蓄血一證亦有寒有熱亦辨於苔之燥潤也辨正中黑邊白滑舌舌鑑謂表裡俱虛寒脈必遲弱外證畏寒附子理中湯人參白朮附子乾薑甘草夏月過食生冷而見此舌者則酌用大順散肉桂杏仁乾薑甘草治虛寒人夏月停冷食呃嘔者冷香散生附片草果仁橘紅甘草生薑治同上然此舌必當慎辨若黑色潤澤光滑無苔刮之平靜者是寒也可遵舌鑑治之若黑苔微厚粗膩雖滑而刮之不淨口苦唇燥外無寒證脈非遲弱者則是實熱宜用清涼脾胃藥寒熱之判勢如冰炭吳坤安云如白苔而兼灰黑色更有黏膩浮滑者此太陰在經之濕邪是從雨霧中得之宜解肌滲濕五苓散加羌防之類如雜病而現黑滑苔者必是濕飲傷脾宜溫中和脾逐飲治之沿白黑心舌第七十二圖說弦邊白燥中根黑苔舌鑑辨正弦白黑心舌在傷寒為邪入陽明化火已久熱逼太陰少陰也宜破格白虎湯及大承氣湯輪服不次急投黑心退淨則愈在雜病為實熱證如吐血者宜三黃白虎湯加犀角大便閉者宜大承氣湯大熱大渴者宜白虎湯若據於弦白為寒而不用苦寒藥則無救法舌鑑用五苓散大謬凡寒證舌底光滑濕潤刮之明淨無點罅絲紋者是也通尖乾黑邊白舌第七十三圖說兩邊白燥厚苔中心黑干通尖舌鑑兩感是少陰先傷一二日間便見中黑邊白厚苔者雖用黑膏湯合調胃承氣湯恐終無濟於病矣正義云此少陰瘟也五六日見之大柴胡湯涼膈散下之無下證者付葉石膏湯又云舌尖白二分根黑一分外證身熱惡寒曾飲水者五苓散自汗渴者白虎湯下利者解毒湯辨正通尖黑干邊白舌是臟腑實熱獨盛火燥煩躁熏蒸濕氣故邊白也其症多大熱大渴譫語煩躁便閉咽乾不等宜白虎湯大承氣湯合用連服以黑退為度如舌鑑指為陰陽兩感傷寒用大羌活湯羌活獨活防風細辛知母生地防已黃芩黃連蒼朮白朮川芎及沖和靈寶飲即大羌活湯去獨活防已黃連蒼朮白朮加柴葛白芷石膏誤人多矣蓋拘定白黑判陰陽而不知黑舌均里證無表證況既干而通尖裡急已極尚可雜投驅風燥藥乎黑苔灰紋舌第七十四圖說中心黑兩畔起灰紋重暈者舌鑑中黑灰紋舌若脈實者急用大承氣湯下之若脈浮渴飲水者涼膈散十人可救一二辨正前人治法不過如斯而已實則見此舌不論何症何脈用十全苦寒救補湯不次急投服至黑灰退淨則立愈非臨證多者不知其妙也亦有淡灰色中起深黑重暈者為瘟疫熱毒攻裡急用涼膈散雙解散等清中逐邪舌辨云灰黑重暈舌乃邪毒傳於手足少陰經也宜即下之解毒湯用大黃酒浸攛芒硝量輕重大小治之黑苔瓣底黑舌第七十五圖說全舌黑苔撥開瓣底黑色舌鑑凡黑苔瓣底黑者不可用藥雖無惡候脈必暴絕死不可救辨正黑苔瓣底黑舌此乃臟腑實熱已極或因六氣之燥火侵淫或因百藥之燥火逼迫燥火與陽火病人素有實火曰陽火虛火曰陰火是也交戰於中熏蒸於上而成此舌猶之當暑炎熱土木生菌惟大雨時行即自消滅可知舌有黑瓣非大寒涼藥斷難起死回生此證多熱大渴口開吹氣或絞腸痛絕或頭眼脹痛求死或口噤不言或渾身發臭難聞或卒然仆地不省人事雙目直視不等不論見何怪脈舍脈憑舌看黑瓣尚未敷滿仍可救治急用十全苦寒救補湯生石膏八兩知母六錢川柏四錢黃芩錢半犀角四錢四倍石膏或分為三黃白虎湯及大承氣湯分二罐主之不拘時刻不次急投凡言不次急投皆不限定劑數須輪流急灌服至黑瓣退淨舌底漸紅則病愈知此法者雖危不死倘不明利害忌服苦寒或不敢多服必死無疑別無救法也如舌鑑云見此舌不可用藥雖無惡候脈必暴絕不治此拘於切脈無知妄斷醫家卸肩之積習耳黑苔瓣底紅舌第七十六圖說舌根淡紅全舌黑苔夾瓣瓣底舌紅舌鑑黃苔失治久而變黑乃實熱亢極之候而又未經服藥肆意飲食而脈亦伏目閉口開譫語或自語如伏脈男見左女見右主脈者宜大承氣湯下之燥糞必黑蛔蟲必死醫見此舌必撅而視之瓣底紅者生瓣底黑者死辨正黑苔瓣底紅舌臟腑熱甚灼血爍津也多因實熱人誤服溫藥燥藥逼傷陰血故瓣底見淡紅其症口開目閉煩躁譫語狂妄便閉不等勿論脈之伏代怪奇即用破格三黃白虎湯加犀角與大承氣湯循環間服不次急投黑瓣脫淨方愈若舌鑑僅以承氣下之而不敢重用苦寒急涼血分知其一而不知其二安能救人乎滿黑刺底黑舌第七十七圖說滿舌黑苔黑刺芒刺底肉色亦黑舌鑑滿黑舌起刺芒刺底亦黑凡見此舌不必辨其何脈何經雖無惡候必死不治辨正刺底黑舌刮開芒刺底下舌色俱黑也用第七十五舌黑苔瓣底黑舌苦寒急救之法尚有可醫舌鑑謂不必辨其何經何脈雖無惡候必死勿治此固醫家搪飾之常法然病家往往見重證安於必死執定勿用苦寒亦足以釀成時醫之惡習也滿黑刺底紅舌第七十八圖說滿舌黑苔乾燥而生大刺揉之鯊魚皮觸手而響撥開黑刺瓣底紅者舌鑑滿黑燥苔起刺撥開刺底紅者心神尚在下之可生凡肥盛多濕熱人感冒發熱痞脹悶亂一見此舌急用大陷胸丸攻下之後與小陷胸湯調理舌辨云下之熱退脈靜者生辨正滿黑刺底紅舌全舌黑苔乾燥而生大刺手揉之有聲掘開刺底尚見紅色不論何病皆里證臟腑熱極宜合用破格三黃白虎湯大承氣湯不次急投以黑刺退淨為止病必愈舌鑑但知以大陷胸湯下之而不知寒涼急投其黑刺必不退倘能十救一二亦幸事也弦紅中微黑舌第七十九圖說舌心淡黑邊沿淡紅多津舌鑑弦紅中微黑舌外淡紅淡黑者惡風則表證未罷用解毒湯雙解散各半以微汗之汗罷即下之下後熱不退者不治辨正舌鑑治法甚是如結胸煩躁目直視者宜大陷胸湯及大承氣間服舌鑑云不治者非也紅邊黑心滑苔舌第八十圖說舌心黑滑有津邊紅潤不燥舌鑑紅邊中黑滑舌必表熱裡寒證見譫語者因邪在表時未曾服藥不戒飲食冷物結滯於胃而相搏也虛人黃龍湯去朴硝加乾薑或枳實理中湯合小陷胸湯壯實者備急丸熱下之夏月中暍亦多此舌以人參白虎湯主之林慎庵云此等舌屬大虛之候宜合脈證審慎而施也辨正紅邊中黑滑舌是脾胃肝膽俱熱而夾有濕邪也若傷寒證見譫語者為初傳陽明宜白虎湯發汗自愈大渴大熱則倍用之舌鑑謂冷食結滯虛人用黃龍湯即大承氣加黨參甘草當歸桔梗薑棗邪熱傳裡譫語發渴身熱心下硬痛下利皆清水此名結熱利證非內寒而利也宜此湯若年已表老者去芒硝壯實人用備急丸巴豆霜一錢乾薑三錢大黃三錢共研細末米糊為丸如豆大治熱邪暴死夏月中暍者用人參白虎湯三法雖不甚謬然難見效吳坤安云若全舌黑滑為太陰之寒理中證也若兼黏膩浮胖是濕痰寒飲伏於太陰當用溫藥和脾如二陳厚朴薑汁合五苓之類開之逐之痰飲自去舌辨云若邊紅中黑而津滑者必譫語因寒傷於營營傷則惡寒而汗頭疼表證時未曾服藥只以飲食為主因而食勝內外俱傷輕而變重重而致此急下之再不可食如犯之不可救也邊紅通尖黑干舌第八十一圖說舌邊紅中心黑干通尖舌鑑瘟疫內熾宿食不消故乾黑通尖而邊紅也急下一二次稍解再下之以平為期辨正邊紅通尖黑干舌臟腑實熱而心肺脾胃尤亟也傷寒傳少陰證燥暑中少陰證瘟疫症雜病實熱皆有之不論何病何脈宜十全苦寒救補湯不次連服則必愈舌鑑急下再下以平為期是也里黑舌第八十二圖說外見純紅色內有乾硬黑色如小長舌形甚則其上有刺舌鑑里黑舌外見紅色內有乾硬黑苔似小長舌其上有刺者熱毒盛熾為實熱堅結大腸急用調胃承氣湯下之辨正舌鑑治法雖是然不如用白虎湯大承氣湯相間連服必愈張石頑云亦有因中暑誤認外感而加溫覆多致中黑邊極紅而潤脈必虛大急用白虎湯清之虛者加人參竹葉如更誤認陰寒而與熱藥必致煩躁不救也夏月中暑多有黑舌黑而中乾者白虎無疑中焙舌第八十三圖說舌色純紅中心黑厚而干形似小舌舌鑑舌苔中心黑厚而干形如小舌邊畔純紅名中焙舌乃邪熱結里心火熾甚宜涼膈散大柴胡湯又云此舌為熱盛津枯之候急用生脈散合黃連解毒湯以解之林慎庵以甘露飲加人參黃連或生料人參固本丸加牛膝元參知母地骨皮辨正張三錫云余常見外感挾內傷宿食重而結於心下者五六日舌漸黃或中乾厚而邊潤名中焙舌此則裡熱尚淺若全舌乾無論黃黑皆屬裡證分輕重下之若曾經下或屢下不減乃宿滯結於中宮也診其脈之虛實及中氣如何實者潤而下之虛者神氣不足當生津固中氣有用生脈對解毒湯而愈者有用附子理中湯冷服而愈者一則陰極似陽一則陽極似陰不可不辨而正之里圈舌第八十四圖說舌根至中淡紅中夾紅暈而尖沿皆純黑舌鑑里圈舌淡紅中有紅暈而弦又純黑乃心包絡蘊熱復受邪火侵入二火相逼故顯此舌宜大承氣湯下之辨正舌鑑治法甚是炳章按此包絡熱甚宜清包絡之熱如犀角連翹鮮生地黑元參合承氣下之則更妥當黑尖紅舌第八十五圖說中根紅舌尖黑而有紫黑刺舌鑑瘟疫汗後食復而見紅尖紫黑刺證甚危殆急宜梔子枳實豉湯加大黃下之刮去芒刺不復生者安再生則更危辨正紅尖紫黑刺舌乃心經極熱而又受邪熏蒸也宜大承氣湯加黃連五錢連翹三錢急服則愈舌鑑用枳實梔子豉湯加大黃雖下而不甚涼芒刺再生又不敢連投安得不危紅根黑尖舌第八十六圖說舌中根紅而尖黑燥舌鑑舌本紅而尖黑者足少陰溫熱乘於手太陰也竹葉石膏湯辨正紅內黑尖舌為臟腑皆熱而心經尤熱也傷寒邪火逼手少陰溫熱直中手少陰誤服補心藥心血熱者有之宜大承氣湯加川連三錢連翹黃芩黃柏各二錢服至黑尖退淨則愈舌鑑謂足少陰溫熱乘手太陰用竹葉石膏湯未妥紅尖黑根舌第八十七圖說中尖純紅舌根黑色或灰黑舌鑑瘟疫二三日舌根黑色熱邪熾甚而宿食不消也涼膈雙解微下之至四五日火極似水漸變深黑少陰腎氣己絕下亦無濟矣若邪結咽嗌目瞑脈絕油汗者一日夜必死辨正紅尖黑根舌心腎火熾脾胃受困也傷寒邪入陰分瘟疫毒中陰經實熱鬱傷陰分皆有之不論何證何脈用大承氣湯急下以去其毒用三黃白虎急涼以救其陰二方連環服至黑退則愈舌鑑治法未善彼謂瘟疫二三日可微下之四五日後舌變深黑下無濟矣若邪結於咽目瞑脈絕油汗者一二日死蓋微下則不能去毒僅一下之而不間大涼藥則不能挽回已傷之陰又偶爾嘗試無膽無識安得不死耶紅中淡黑舌第八十八圖說紅舌中見淡黑心苔滑潤者舌鑑乃溫熱發於太陽也如有表證惡寒雙解散合解毒湯微微汗之汗罷急下若結胸煩躁直視者不治章虛谷云紅中有黑苔者熱毒入少陰也大承氣合白虎湯治之辨正紅中淡黑舌臟腑實熱也不論何病何脈皆里證傷寒傳裡大發燒熱結胸煩躁二便閉雙目直視或疫毒中三陰均有此舌宜十全苦寒救補湯不次急投舌淨必愈舌鑑說先汗後下又以結胸為不治殊未當也紅中焦黑心舌第八十九無圖圖說舌紅色中有焦黑厚苔形如小舌舌鑑乃瘟疫之毒內結於胃火極反兼水化也宜涼膈散若黑而乾硬指甲剔之有聲急用調胃承氣湯下之遲則不救辨正紅中焦黑舌臟腑俱熱而脾胃尤熱也誤服補劑及中時疫者有之不論何脈皆屬裡證宜十全苦寒救補湯倍加生石膏不次急投勿稍遲疑以服至焦黑退淨為準則必愈舌鑑近是尚嫌姑息黑爛自齧舌第九十圖說舌苔黑爛頻欲自齧舌鑑乃心腎火灼無以自安也必爛至舌根而死切勿用藥正義云舌黑而中爛者死候也不治舌辨云白爛瘡堪治黑舌齧爛根言黑爛無治法也辨正黑爛自齧舌臟腑極熱兼受穢毒也患楊梅瘡者多有之他症罕見宜三黃銀花承氣湯等劑土茯苓作茶飲治如不效則將如舌鑑所云黑爛而頻欲自齧必爛至舌根而死也孕婦黑苔第九十一無圖圖說孕婦舌黑有微黑深黑大不同舌鑑孕婦傷寒發熱舌苔黑此邪入少陰熱傷胎元也其子必死當下死胎以救其母凡孕婦面舌俱黑不必問其月數子母俱死面赤舌微黑者還當保胎如見灰黑乃邪熱入子宮其胎必不能固若面赤者為根本未傷當急下以救其母辨正孕婦傷寒灰黑舌乃熱逼三陰之候不論傷寒傳陰實火傷陰必須苦寒急涼宜三黃白虎湯生大黃元明粉川樸生枳殼等酌用熱清則胎安慎勿妄用安胎補藥致益熱而胎上衝舌鑑謂面舌俱黑水火相刑子母俱死下略云云此皆醫家相傳粉飾之談耳舌辨云面赤舌黑如舌微黑還可保胎如黑甚必墜用井底泥固臍內服清熱安胎藥如黃芩知母竹茹柴胡梔子等藥治之若胎安則穩不然必墜之
