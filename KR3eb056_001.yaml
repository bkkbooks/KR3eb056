body:
  text: 卷一第一編辨舌總論第一章辨舌之生理解剖及功用第一節舌之構造舌為動物司器官在口中下頜上乃一塊赤色筋肉質纖維所成其中有多絲能自由運動且以生津液表面包以黏膜如皮並浸口液之內有多數小粒之隆起即味覺之乳咀體內含血管及與腦相連之味神經滿布其中以辨食味而分布味神經及舌神經之小枝於其內故舌能顯明內筋條並腦線器具之情形並行血法與生津液器具之情形特能顯明消化器津液情形者因舌與胞膜及消化器相接為感覺最敏鋭處也第二節舌之乳頭舌乳頭當分三種圖見前一絲狀乳頭在舌旁及舌面其上面有絲形突起之絨二菌狀乳頭散在絲狀乳頭之間於舌尖為最多三輪廓乳頭在舌根近旁排列如人字形較前數種為大內藏味神經之末梢曰味蕾物質溶解後觸於乳頭時即透入內部而刺激末器味神經傳之於腦故感覺其味第三節舌之脈管舌之脈管由舌臉及上咽頭之管而來第四節舌之腦氣筋即分布舌上之腦氣筋也上連於腦有司味神經及動舌神經之別以司辨其運動舌體之用蓋舌之腦筋每半邊各三即第五筋之司味枝散於舌前端及邊之芒並舌咽頭之舌枝散於舌底與舌邊之嫩膜及大芒並舌下筋散於舌之肌質司味筋兩枝乃尋常知覺兼司味之用其舌下者乃運動舌之筋司味筋之一以供舌之芒與嫩膜其全路之列俱深同下牙先列於外後蹬肌之下即牙筋之裡邊與內牙床脈管之一枝相合其中竅絲亦與此處相合而為尖角後則此筋行於內後蹬肌與牙床枝裡邊之間斜過舌邊咽頭上縮肌之上第五節舌之骨與舌根舌骨附列於喉與舌根之小骨形以韌帶連於喉頭只有一枚為軀幹骨之一舌根猶言舌本謂舌之近喉處也第六節舌之細胞與神經凡舌面有刺名曰乳頭其兩旁有小刺名曰味蕾內含細長之細胞一個至十個即味細胞味細胞之下端味神經伏焉供給辨味之物質變成液體浸及味蕾刺激神經傳之於腦遂生味覺心理學要覽味神經觸神經蔓布全身而味神經惟口中有之此神經歸宿於舌皮及口後部之皮肉舌皮內有無數之小體狀若花蕾名曰味蕾味蕾展其外端於口內其中心有細胞細胞之末梢極細視之宛如纖絨因名曰絲綿梢絲綿梢植立於味蕾之罅隙內味神經達於味蕾並於其細胞間分枝食物未經溶解則不能辨其味必先溶化下降於味蕾內圍繞絲絨細胞之梢而後味神經傳至腦髓告以所嘗之物為何味也第七節舌之唾液腺唾液腺即分泌唾液腺之一有耳下腺頜下腺舌下腺三對末端各有球囊如葡萄血管纏絡其周圍如網有排泄細管常分泌唾液滋潤口內口含食物則腺之機能忽發分泌液甚多又飢餓而見食物及感香氣亦能流出唾液耳下腺最大在外耳之直下別有管開口於上頜面齒之近旁以輸送唾液喉痧及感冒時往往熱腫發脹俗稱痄腮頜下腺在下頜之內前部舌下腺在口底黏膜之下其輸送管皆開口於舌尖舌部之兩側黏液腺由唾液腺分泌之液亦曰口津以潤舌面及潤濕口腔及消化食物之用甲唾液性質唾液者稀淡無色而黏滑之鹼液也流出之始有泡沫而透明無何其上面清澄而生純白之沉澱物以顯微鏡觀之見微細之顆粉少許之油球及薄扁平之鱗形物即口窩裡膜剝落之內皮細胞也又有口中黏液膜所出之少許小球細胞混合之乙唾液效用唾液以濕潤口內言語及咀嚼時使舌易運動又溶解有味物之分子滲入舌之黏膜而覺其味咀嚼之際混淆於食物使成易咽之軟塊此皆唾液之效用也第八節舌之功用舌字從干從口干干戈也凡物入口必干於舌故舌之功用為食物辨味及發聲凡食物自口下於胃謂之下咽下咽有三期第一期由口及口蓋之筋送食物於咽喉第二期由咽喉之筋移於胃管第三期由胃管之筋下之於胃一別味舌為味官能辨食物之優劣凡物有味者無甘酸辛苦皆溶解於水惟金石不溶解故多無味但其味可溶而含於物其物自具一種味之原質然往往因多嘗和料薑桂芥辣等及習慣食物亦不克辨原嗜之味亦反失其功用味覺統常辨甘酸苦鹹四種澀與辣乃為皮下筋之收縮非真味覺謝氏生理學云舌背感鹹味苦味最敏而此處之腦腺為第九對與胃相感食鹹與苦每致嘔吐職是故也舌之兩旁感甘酸最敏而是處之腦腺為第五對其分支至面部故食酸則面現皺容新智囊云舌之尖端司辣及酸之味覺舌背司甘及苦之味覺舌根司燒肉及其他脂肪甚濃厚食物之味覺且味覺有時與嗅覺視覺觸覺等相聯絡聯絡嗅覺而感物之香味聯絡觸覺而辨物之為水質或脂肪質聯絡視覺而就物色之美惡以知味之如何二發聲舌者聲音之機也唐容川云舌為心苗言為心聲故舌能辨音究音之所由生則根於腎氣蓋腎挾舌本故先舌動而後能發音橫骨者神氣之所使主發舌者也橫骨在舌本心藏神而開竅於舌故橫骨為其所使以為發音之機以舌在口中作聲曰吒語音不正曰疆挺以上辨舌之生理解剖及味覺功用已略備大概其他味覺神經之科學上實驗研究下章引據霍令斯荷斯教授及和布芬勃葛博士之新發明詳辨之第二章辨舌之味覺神經之機能樓英曰濁氣出於胃走唇舌而為味凡物體入口溶解觸於舌面而生感覺能判斷其甘苦辛酸之作用謂之味覺且為消化器之保護此作用雖專屬於舌其兩頰之內側與口亦少助之謝氏生理學云司嘗之職舌與上齶之小刺任之滴醋一滴於舌上對鏡視之即可見刺之簇豎舌之皮突起小刺之上細如毛髮觀之不啻絲絨也功能收吸所嘗之液而達於腦腺故曰味覺此就其大要言之至於從科學上實質之研究茲再節録學生雜志之霍斯荷斯教授及和布芬勃葛博士之辨舌覺之新發現以俾我中醫界參考實質之借鏡專載學生雜志第七卷三號學藝門關於味覺的新發現第一節味覺神經從頭蓋過面龐到口內之頭蓋神經共有三條是皆含有味覺神經纖維其第一為舌神經其纖維占在舌面前部及兩側及舌尖約當全舌之長三分之二其第二為第九神經或稱喉舌神經其纖維占在舌根和軟顎其第三為肺胃神經自胃而來其纖維占在舌之極根及喉頭此謂滿布瘢舌之神經纖維之來源第二節神經種類及機能味官和腦筋處有許多各自分離小圈每小圈各自成一體體內包含一核和兩組神經細枝管中其一組是極短極多又一組比較略長卻單獨一支凡圈一群成一神經節為傳達感覺之樞紐聯絡腦筋和味覺神經節有四個皆經過舌本和味細胞纏繞味細胞在味蕾之內至於神經節他端之神經支管便直通腦海至大腦中樞而止其直接之神經幹便是大頭蓋神經之中樞神經名加色令神經節若將加色令神經割去據理知覺亦失豈知事實上則不然並不全舌知覺失卻只有前半部約占全舌三分之二失卻知覺似乎舌上其餘各部之神經纖維並不與神經節關聯卻另從一條路繞到腦中此是實驗時第一次奇異之發現後又照此法實驗一次割後若干時前部已失之知覺仍能回覆原狀此是第二次之發現且味覺可以借用耳神經逆達腦海據近世科學家詳考之後始知散布在舌前半部之神經纖維雖從第七頭蓋神經之神經節所發生而實則先須繞過耳鼓神經然後能達到舌頭前部所以耳鼓神經亦可以傳導味覺到腦海此是霍斯荷斯教授所發明科學家再加研究又試驗耳鼓神經不但能代傳達味知覺到腦海並且能夠直接感受味覺可以在中耳耳腔內耳鼓神經上實驗得之何以驗之假如耳腔內之耳鼓神經上行使一種機械刺激便能令腦海起一種酸味覺倘然行使一種化學刺激便起甜味覺行使電力刺激便起苦味覺只無鹹味味覺此是屢試不爽布博士又考查耳聾之人味覺亦鈍又如患傷寒熱病熱甚時舌起厚苔致失味覺而耳亦聾此更是味覺與耳朵有密切之關係為實驗證明之實情再觀舌官和腦海直接聯絡之神經即是上文所說自神經細胞一端發出之神經支幹其絡點便是居於腦底之延髓穴延髓是脊髓之頂端位在顱內較脊髓略大如繩端上一個結就是觸覺神經和腦海之聯絡是借脊髓做傳達中樞味覺神經和腦海卻有直接聯絡神經做傳達中樞不靠脊髓轉達但味覺神經仍和動作神經中心及咀嚼神經吞咽神經有關聯此關聯是在延髓中因此味覺器官與脊髓中樞有關係所以味覺能引起他官之感應比如吾人見了美食便不知不覺口內流涎此即是胃液分泌吾人從此可以證明味覺神經和動作神經協作此皆說明味覺神經內部之組織實有神妙不可思議之奇異再說舌頭外部即表面之味覺神經之組織亦有研究之價值第一先辨舌頭表面凡舌頭正面之皮最粗糙且最厚因常和食物相接觸所以格外生得厚些其餘如舌尖和舌邊之皮比較就薄了其正表面粗糙部分又可分為外內兩部有感覺神經頭露出即是和味覺相關連內部便都是血管神經纖維和無數之腺外部更有許多小點形狀不同分布亦甚散亂即此小點便是劃分舌面為內外兩部之表記內外部區分之處以一排較大之點為界線此等大點約數十二排列兩面成個英文字形式看圖中之三便知字形是尖端向內開端朝外又從字尖處起有條溝直達舌尖好比把舌面平分為兩邊再辨舌乳頭可分四類一圍狀乳頭二菌狀乳頭三線狀乳頭四卷葉乳頭圍伏乳頭就是排列成字形之十二或十個個大乳頭此種大乳頭中有小窪四圍略高猶如牆圍所以曰圍狀乳頭見圖五六上文所講關聯味覺之感覺神經頭便是露在此乳頭上尤以在乳頭四圍高起部分者為多總有幾百個故食物進口時皆從外部感覺味之好歹舌尖正面雖有極靈感覺其反面卻無感覺其餘賒舌面內部是無感覺前已說過外如軟齶及扁桃腺皆略有感覺嗓子頂頭和嗓口亦略有感覺惟上齶完全無感覺以上所云感覺是專指味感覺又嗅覺器官且有味感覺如甜味和鹹味鼻子亦可以略辨一二耳再看上文所說小乳頭如二三四種是何構造曰其小乳頭內皆含有無數小體稱為味杯察其形狀實似未開之花蕾所以又改名為味蕾味蕾和外界相通之路名為味竅為極細極微人目所不能見之孔開在小乳頭面上味蕾所以要如此深藏密躲無非使外界略粗食物不能接觸耳味竅之對徑有人測量之大約一英寸一千分之一可謂小至極矣味蕾上面又有毛刷一般從味蕾發出散布味竅左右以便收取食物之味傳達於味蕾第三節味覺之錯覺味覺亦常有錯覺譬如糖屬及硫酸鎂和其他一二物在舌邊及舌尖嘗時其味是甜但在舌根上嘗其味變為苦還有許多食物吾人常說有味其實無味不可因此物有濃入鼻中因而覺得所以亦可說是味覺之錯覺比如樟腦人皆說有味實在無味試掩鼻而舐之便知是無又如咖啡和金雞納霜之味一般蘋果和洋蔥之味亦是一般卻因為各有各的香氣便使味覺起了錯覺所以不同也注嘗探味也口中不需齒以舌解滋味曰嘗兒嘗膠飴之類是也舐凡舌出取無渣食物曰舐或作咶及餂如犬紙遺白仙藥是也凡原質之味只有四種甜酸鹹苦是也其餘之味皆不純粹與各感覺官皆略有關係與嗅覺關係亦最多曾有人實地試驗證明食物之中肉類麵包牛油乳油橄欖油以及各種果子各色蔬菜皆是相同之味若將食物形狀遮住食之便分別不出是何食物雞肉火雞鵪鶉等等更不能從味道上分別耳不過是香味形狀名目聯念等等合之不是從味道可以定名也又說甜和苦是絶對相反之味哪知舌上感覺甜和苦之味卻不在同一部位大概舌尖最能辨甜舌根最能辨苦所以直吞苦物往往不覺得苦舌邊最能辨酸又成人味覺和小兒味覺又有不同上文說過成人舌尖反面舌中心一條沒有一點味覺小兒便不然幾乎滿口筋肉皆有味覺所以最喜滿口含物此因為滿口含有味覺大抵一切生理狀況近乎低等生物此即是證據又如舌上小乳頭感覺機能亦各不同有些只能感覺一味有些便能感覺二個以上據科學家精細實驗曉得一百二十五人之中六十人是對甜酸苦三味皆起感覺十二人只感酸和甜餘十二人只感酸又七人感受苦和酸四人感覺苦和甜三人只感得甜此外味覺之幻覺最顯著者是甜和咸之比較若用一點鹹水滴在舌頭一側同時又將一點無味之蒸餾水滴在舌頭又一側竟覺得蒸餾水變為甜此是證明兩性相反之緣故能使無味之水生出相反之味感覺若改用糖水和蒸餾水照前法試驗則蒸餾水又變為咸其理正同所以味之性質若依感受性之難易而定次序便是一甜二酸三咸四苦是也以上從霍教授及和布博士之新發明參以生理學諸書而成之第三章辨舌審內臟經脈之氣化徹剩八篇云男子生鼻之後目即生焉目應肝膽女子生鼻之後舌即生焉舌應心腸目現於體外陽之用也舌隱於體內陰之用也蓋舌為心官主嘗五味以布五臟故心之本脈繫於舌根脾之絡脈繫於舌旁肝脈循陰器絡於舌本腎之津液出於舌端分布五臟又云舌為心之外應其本達於氣管有竅曰玄膺為腎之上津上通七竅乃真氣出入之關知之者生不知者死蠡海集云心之竅通於舌舌雖心竅而津液生之則由心腎交媾水火既濟陰陽升降之理也李時珍曰舌下有四竅兩竅通心氣兩竅通腎液心氣流於舌下為神水腎液流於舌下為靈液道家謂之金漿玉醴溢為醴泉聚為華池散為津液降為甘露所以灌溉臟腑潤澤肢體是以修養家咽津納氣謂之清水灌靈根人能終日不唾則精氣常留顏色不槁若久唾則損精氣易成肺癆皮膚枯涸故曰遠唾不如近唾近唾不如不唾人若有病則心腎不交腎水不上故津液干而真氣耗也大抵無論內傷外感無不顯現於舌因舌與內臟經脈均有聯繫故辨舌質可決五臟之虛實視舌苔可察六淫之淺深茲篇就其內臟氣化外應喉舌本旨詳辨於後第一節手少陰心經素問應象大論云心主言在竅為舌又云手少陰之別系舌本經筋篇云手少陰之筋支者系舌本素問經絡篇云心氣通於舌心和則能知五味矣心病則舌卷短顴赤故舌為心之主五閲五使篇云舌者心之官也注云心開竅於舌故舌為心之官脈要精微論云心脈搏堅而長當病舌卷不能言注云搏堅而長者搏擊應手有力而長此為太過之脈心火太過故當病舌卷心主言故不能言也喬嶽曰心絶則舌不收及不能語經脈篇云手少陰之別名曰通里去腕一寸半別而上行循經入於心中系舌本屬目系其實則支鬲虛則不能言注云手少陰之別絡與經相干名曰通里之間去腕一寸半別經而上行循經入於心中系舌本屬目系其氣實鬲間若有所支而不暢虛則不能言蓋心主言而經別絡舌本也第二節足少陰腎經經絡篇云足少陰循喉嚨挾舌本至任脈廉泉穴而終疾病篇云足少陰之脈貫腎系舌本憂恚無言篇云足之少陰上繫於舌絡於橫骨終於會厭衛氣篇云足少陰之標在背腧與舌下兩脈也經別篇云足少陰之正直者系舌本舌縱涎下煩悗取足少陰元珠曰舌之下竅腎之津液所潮也注云下竅廉泉穴也一名舌本在顏下結喉上靈樞又云廉泉玉英者津液之道也孫文垣曰廉泉穴腎之津液所關靈樞曰胃熱則廉泉開故涎下也靈樞經脈篇云腎足少陰之脈循喉嚨挾舌本是主腎所生病者口熱舌乾咽腫上氣嗌乾及痛煩心心痛注云夫腎主藏精如主腎所生之病則精液不能上滋而為口熱舌乾嗌痛煩心諸證蓋水不上濟則火盛於上矣素問云刺足少陰脈重虛出血為舌難以言景日珍曰有寒傷腎帝中腫者禁針帝中及喉花關於性命不可不知第三節足太陰脾經靈樞經別篇云足太陰之正貫舌中經水篇云足太陰之正上至髀合於陽明與別俱行上結於咽貫舌中衛氣篇云足太陰之標在背腧與舌本也脈度篇云脾氣通於口脾和則口能知五穀矣心氣通於舌心和則舌能知五味矣當曲頰入系舌本注云口能辨五穀舌能辨五味心脾和則口與舌俱和而五穀五味入口即辨矣素問云中央黃色入通於脾故病在舌本李東垣云舌者心也復能知味是舌中有脾也王肯堂云舌主嘗五味以榮養周身資生於脾以分布津液於五臟故心之本末繫於舌根脾之絡脈繫於舌旁靈樞經脈篇云脾足太陰之脈上鬲挾咽連舌本散舌下是動則病舌本強食則嘔胃脘痛腹脹善噫得後與氣則怏然如衰身體皆重注云舌本舌根也舌本強食則嘔等證皆脾經之所為病也善噫者脾氣上走心為噫也得後與氣則怏然如衰者厥逆從上下散也靈樞又曰足太陰是動則舌病本強所生病者舌本痛又云刺舌下中脈太過血出不止為喑注云舌下脈脾脈也喑不能言也孫景思云舌者心氣之所主脾之所通二臟不和風邪中之則舌強不能言壅熱攻之則舌腫不能轉更有重舌木舌舌腫出血等證皆由心脾二經鳳熱所乘而然也第四節足陽明胃經靈樞營衛生會篇云上焦出於胃上口並咽以上貫鬲而布胸中走腋循太陰之分而行還至陽明上至舌下足陽明注云上焦出於胃上口者上焦所歸之部署也並咽以上貫膈而布胸中出走腋下循太陰之雲門中府之分而行還至陽明之天鼎扶突而上至舌復下於足陽明之分也內經藏象篇云其濁氣出於胃走唇舌而為味張雞峰曰脾胃主四肢其脈連舌本而絡於唇口胃為水穀之海脾氣磨而消之由是水穀之精化為營衛以養四肢若起居失職飲食不時則致脾胃之氣不足而營衛之養不周風邪乘虛而干之則四肢與唇口俱痹語言蹇澀久久不治變為痿疾經云治痿獨取陽明謂足陽明也治法宜多用脾胃藥少服祛風藥則可安矣第五節足太陽膀胱經靈樞經筋篇云足太陽之筋其支者別人結於舌本第六節手少陽三焦經靈樞經筋篇云手少陽三焦之筋其支者當曲頰入系舌本其病舌卷第七節足厥陰肝經靈樞經脈篇云足厥陰氣絶則筋絶厥陰者肝脈也肝者筋之合也筋者聚於陰器而脈絡於舌本也故脈不榮則筋急筋急則引舌與卵故唇青舌卷卵縮則筋先死庚篤辛死金勝木也注云足厥陰之氣主筋故氣絶則筋絶矣厥陰者肝脈也肝者筋之合謂厥陰之氣合於肝脈肝臟之氣合於筋也聚於陰器者筋氣之會於宗筋也筋聚於陰器而絡於舌本故脈不榮於筋則筋急而舌卷囊縮矣厥陰氣絶則筋先死庚篤辛死金勝木而肝臟之木氣絶也素問診要經終論云厥陰終者中熱咽乾善溺心煩則舌卷而卵上縮而終矣注云肝合筋筋聚陰器絡舌本故舌卷卵縮而終也第四章辨舌察臟腑之病理蓋心者生之本形之君至虛至靈具衆理而應萬事者也其竅開於舌其經通於舌故舌者心之外候也是以望舌可測其臟腑經絡寒熱虛實也屠漸齊云辨舌欲知臟病當先觀其舌形如舌瘦而長者為肝病短而尖者為心病厚而大者為脾病圓而小者為肺病短闊而動如波起伏者為腎病此大要也而尤以察胃氣為至要有胃氣則舌柔和無胃氣則舌板硬如中風入臟則舌難言傷寒舌短即為死症皆板硬而無胃氣也不但病時之舌能辨內臟寒熱虛實且無病之舌亦能察人之性情假如長舌之人快活而具勇敢之氣長舌而闊雄辨之才長舌而細居心狹窄短舌之人憂鬱而有僞善之性廣舌之人多辨不堪勝任大事舌廣而厚氣度軒昂舌大且闊中心坦直狹長之舌臨事而泛誠意短廣之舌虛僞而放大言舌形短小中心多僞舌形短窄非侫即妄尖舌之人發言鋭利而聳人聽聞薄舌之人多言而利舌形尖細喜談鬼怪此無病之舌關於為人性情之鑑別也其他如過啖五味內傷臟氣則舌亦現特徵千金方云心欲苦多食苦則舌皮槁而外毛焦枯肺欲辛多食辛則舌筋急而爪乾枯肝欲酸多食酸則舌肉肥而唇揭脾欲甘多食甘則舌根痛而外發落腎欲咸多食鹹則舌脈短而變色此五味內合五臟本其所欲然太過於常皆能致病而舌也能發現各種特徵矣又如舌通各經內臟內臟有病無論屬寒屬熱與舌之味覺亦有特殊徵象可辨寒熱虛實亦宜知之如胃虛則舌淡膽熱則舌苦脾疸則舌甘宿食則舌酸寒勝則舌咸脾腎虛留濕亦咸風熱則舌澀鬱熱則口臭凝滯則生瘡心火鬱則舌出血上焦熱則舌尖裂風火兼痰則舌胖短風痰濕熱則舌本強臟熱則舌生瘡引唇揭赤腑寒則舌本縮口噤唇青肝壅則舌出血如湧脾閉則舌白如雪三經為四氣所中則舌卷不能言七情氣鬱則舌腫不能語舌下有小舌者心脾壅熱舌出數寸者因産後中毒及大驚舌腫者病在血舌痿者病在肉舌偏斜者病在經舌缺陷者病在臟舌顫動者病在脾舌縱舌縮者病在肝舌裂舌爛者病在脈舌捲舌短者心肝之證候舌強舌硬者心脾之病形弄舌者太陰之形證齧舌者少陰之氣逆此即病在內而顯現於舌之證據也薛己云舌雖為心苗以證言之五臟皆有所主如口舌腫痛或狀如無皮或作熱作渴為中氣虛熱若眼如煙觸體倦少食或午後益甚為陰血虛熱若咽痛舌瘡口乾足熱日晡益甚為腎經虛火若四肢逆冷惡寒不食或痰甚眼赤為命門火衰若發熱作渴飲冷便閉為脾胃實火若發熱惡寒口乾而渴食少倦怠為脾經虛熱若舌本作強囟頰腫痛為脾經濕熱若痰盛作渴口舌腫痛為上焦有熱若思慮過度口舌生瘡咽喉不利為脾經血傷火動若恚怒過度寒熱口苦而舌腫痛為肝經血傷火動病因多端當因時制宜耳第五章辨舌明體質稟賦之鑑別辨舌審病雖有確據然亦體格體質人有不同男女老少又有分別有平時有苔而病時反無苔者諸如此類尤不勝枚舉茲就體格體質稟賦臚列於下第一節體格蓋體格之良否雖關於健康然於疾病發生時以及日後可治與不可治亦多有研究之價值茲將體格在醫學上當分為三種列下甲強壯體平時舌質闊厚而坦舌色淡紅舌背常有滑苔或白或微黃有神采骨骼強大胸廓廣闊筋肉堅細而不粗松皮膚滑潤而有光澤乙薄弱體舌質尖薄邊尖多紅或紫或有瘰甚則沿邊屈曲如鋸齒形舌心苔少或無苔外證骨骼細弱胸廓狹小筋肉瘦軟皮膚寬浮丙中等體舌質狹長不厚色亦淡紅微有薄苔尖邊淡紅其外證骨骼筋肉皮膚亦介於兩體格之中間者也第二節體質人之有體格而後有體質故體質在醫學上也當別之為四茲就各質之形狀列下子肺癆質全身構造薄弱頭長如鶴皮色蒼白胸狹小或扁平顏細長顴骨稍赤眼球大而有一種光澤其外貌秀麗其舌質坦薄邊尖紅赤舌根有苔厚膩中尖無苔口中常有津病至二期則根苔灰白邊紫紅乾咳涎痰甚則痰中帶血絲血塊重至三期舌轉紅赤無垢苔咽痛咳嗽膿痰或仍為涎痰潮熱盜汗便溏胃鈍為終期也醜卒中質骨骼筋肉均肥大全身富於脂肪顏大而白或亦有兼蒼兼赤頸短而厚肩高而聳其外貌雖甚強健而身體略為運動則呼吸因之迫促其舌質闊厚而長尖端平圓色淡紅而白舌面常有白膩垢苔此質因常多脂肪少血平素肝胃多有痰濕貯藏故常有苔垢病則胃中聚痰更多舌質常呈胖短甚則強硬或脹大牙關亦緊口不能出聲肺氣管窒塞則不治矣寅神經質神經質之特性不在體格體質而在其舉動行為容貌伶俐視物敏極發潤而光言語爽快教以學問按藝則比常人易於領悟惟其意思無常時興奮時鬱悶凡作事性急其舌質薄小而端尖邊紅微紫雖有乳刺上無浮垢或有苔亦薄此質之人陰液虧肝火旺其有外邪之時其苔白而帶灰不厚膩若多服溫燥藥則易變光絳舌卯腺病質主在小兒期皮色蒼自筋肉瘦而不潤額面如浮腫顏面狹小身體細弱皮膚易變靜脈透於外面往往生皮疹其舌質薄短而尖色多紫紅苔色灰白而少前論體格體質之強弱不拘男女與壯少今論稟賦則男女又有別少壯亦有殊且孕婦與産後亦各有異諦不可不分別詳之爰再述於後甲男女男女氣血異體證治亦有大端不同者男子氣壯血不易瘀舌黑耳聾血絡痹也如熱入血室舌卷囊縮血痹之甚筋失養也亦有未及化熱兩脅血絡先痹者其證舌苔忽黃忽白必帶灰黑小便忽閉忽通煩躁不能安眠或有一邊不良於眠其脈忽長忽短忽洪忽緊全無定象必須攻血通瘀方可治之未有瘀不化黑不退而病能愈者也若婦人血盛經水適來適斷與病相觸肝胃之絡最易停瘀舌黑譫語事所常有但耳不聾乳不縮不為敗證即耳微聾而譫妄狂躁者亦邪正相搏之象惟聲息低微不能轉側乃為危象其舌或藍或灰或黑有僅在一偏有全舌皆透均不得據為凶候故治婦科傷寒溫病起手即宜兼和血以防之否則病愈而絡瘀不淨積為胃痛腰痛痼疾又世以黑而芒刺為熱濕潤為寒然瘀血舌黑雖熱而不生芒刺蓋男子之血必因寒而瘀因熱而瘀因溫病過服寒劑遏熱閉絡而瘀婦女不必因寒因熱邪在血不必相入而血能自瘀故病愈而黑不退者有之節録傷寒補例張石頑云夏月熱病邪火與時火內外燔灼苔黑易生猶可攻治冬月傷寒舌苔全黑決難救也周微之云此乃指黑而潤者是血因寒而瘀夏熱瘀易行冬寒瘀難行也若熱瘀則冬夏皆凶乙孕産凡妊娠溫暑傷寒必先固其胎胎安病易治既察其脈又審其色面以候母舌以候子色澤則安色敗則死脈理正義若面舌俱帶白者寒證也宜溫之若舌色絳赤熱入血分恐逼胎下墜也面舌俱紅者母子俱生也若面舌色赤口中吐沫者母死子活也唇舌俱青口中沫出者母子俱死也申氏曰産婦亦有面舌俱白色黯無神氣血俱虛亦死證也舌見灰黑而有青筋子已受傷急下其胎母尚可保若舌見青黑子已全死外症面如黃土色或乾白口出白沫胸悶臍腹痛冷胎停不動甚則胸塞口吐白沫而有臭穢氣或指甲亦黑則母子均不救矣其他産後辨舌亦有不同脈理正義云産後百脈皆虛以心主血也經云少陰氣絶則血不行舌紫黑者為血先死亦謂不治此皆余臨證目擊如此學者不可不知也丙老年老年氣血衰頽津液枯涸一經染病元氣不能抵抗邪氣內潰故舌與少壯異凡老年陰陽俱不足者苔雖白必浮中有裂紋者中陽虛者質胖無華者濁陰內聚雖潤而非液者兩畔厚自中有裂紋質絳為痰火質白為痰氣此苔易脫脫後色絳胃陰竭也脫後色白肺陰涸也均為不治上半有薄白苔下半如刀切齊者是生氣不至於胃上有而下竭待心肺胃三經津液盡而死矣上半無苔而光絳乃胃火旺陰將涸也宜急救其陰若下半有白厚濕苔用蒸動腎氣法十中可救一二亦有因前醫誤用溫燥之劑肝陰受灼其苔必於白無液或如豆瓣厚薄不勻不可再用劫陰之藥若初起厚白苔服藥後苔脫去苔根或起泡或顯紅刺為痰熱化解使一脫之後並無泡刺而苔質現干絳裂紋亦為傷液之徵宜滋其陰苔聚於中兩旁化露而老黃乾厚熱傷肺胃心營受灼也非紫雪至寶合玉女煎之類不可如干厚見黑色涕涎一條者結津也危在頃刻苔脫後舌上如塗墨者危須問曾否食過青果山楂石榴等酸味之物否則即屬腎氣上泛而欲氣促痰升之兆急用救逆回陽之法如頭汗面黑等象已顯是其機已發不可救藥矣此醫學抉微中語余屢試屢驗不失毫釐故轉録之余治驗一高年陰液大虧素有肝陽上亢之病一經溫暑之病醫者初誤用芳燥淡滲大便不下身熱增劇舌黑燥無津繼用甘寒陰柔熱退身涼脈沉弱無力舌仍乾燥硬如栗殼一層口燥不喜飲大便始終不下已十餘日小便清長人體不能動凡用涼瀉之品日見沉困後邀余治余謂此因初服芳燥重傷其津繼用涼潤陰柔而無助輸運之品故大便不下甚至命火亦被熄滅其腸中宿垢同藥汁冰伏下焦以致氣化失蒸騰之職故仍口燥舌仍乾黑而津液不能上升故也故如此余用熟地麥冬淡蓯蓉以益腎陰鹽炒黨參以立中氣炮薑肉桂以溫脾腎壯命火大黃元明粉以消潤導下服一劑大便即下盈斗下後舌苔仍不退惟口齒已潤後改用復脈湯加減五六劑乾薹脫去如殼一片舌質淡紅而光軟無津仍用復脈五六劑則苔漸生而胃納始動元氣漸復此亦為治老年水虧木旺熱病過涼立溫潤攻下之例也丁嬰孩凡小兒三四歲以下患溫熱雜病辨舌與常入略同惟産生至一二歲其舌有特種疾患不可不防之美醫嘉約翰云小兒之病舌上每有白衣若初生小兒舌上白膜裹住或如石榴子或遍舌根哭不出聲若不刮去其兒必啞或發驚先將舌上白膜用指甲刮破令出血煅白礬末二分緑豆粉一分和敷之若出血不止用發灰摻之即止若小兒舌根下忽有筋一條絆其舌尖不能吮乳或舌下總筋上生白膜連舌尖絆住用銀針磨尖輕輕挑斷之其法用簪橫刺膜中直勒至舌尖下斷其膜須仔細下簪匆穿在總筋之內及誤傷舌根及小舌為禍不小挑後拭去血涎用蒲黃海螵蛸研末摻之或陳墨亦可若初生兒舌上忽生黃疱出水此為心脾之火用大螺螄肉三枚焙為末加上腰黃末三分燈心灰五分共為末摻之愈若小兒初生舌上生白屑如米劇者口鼻亦有之此由胞胎中受穀氣盛所謂鵝口是也用冰片一分煅月石二分研和吹捺白粒上凡小兒舌大腫硬不能轉動此心火挾痰也用竹片輕刮拭淨不可用手按舌根乃損長成語言不正若舌腫滿口或脹出口外難納藥者用殭蠶牙皂等分為末少許吹鼻中口自開頑痰自出再用筋繞絲綿蘸甘草湯潤其舌然後用蒲黃末摻之此皆小兒所特有也第六章辨舌質生苔之原理章虛谷曰觀舌質可驗其證之陰陽虛實審苔垢即知其邪之寒熱淺深診家直訣云凡察舌須分舌苔舌質舌苔雖惡舌質如常胃氣濁穢而已形色簡摩云舌苔可刮而去者屬氣分主六腑若刮而不去即漸侵血分內連於臟全屬血分與五臟舌尖上紅粒細如粟者乃心氣挾命火真火而鼓起者也然此皆屬舌質也至於苔乃胃氣之所熏蒸五臟皆稟氣於胃故可藉以診五臟之寒熱虛實也章虛谷曰舌苔由胃中生氣所現而胃氣由心脾發生故無病之人常有薄苔是胃中之生氣如地上之微草也若不毛之地則土無生氣矣又云苔者如地上之草根從下生垢者如地上浮垢刷之即去無根者表分濁氣所聚其病淺有根者邪氣內結其病深有根之苔當分其厚薄松實厚者邪重薄者邪輕松者胃氣疏通實者胃氣閉結也吳坤安云舌之有苔猶地之有苔地之苔濕氣上泛而生舌之苔胃蒸脾濕上潮而生故曰苔平人舌中常有浮白苔一層或浮黃苔一層夏月濕土司令苔每較厚而微黃但不滿不板滯其脾胃濕熱素重者往往終年有白厚苔或舌中灰黃至有病時脾胃津液為邪所郁或因瀉痢脾胃氣陷舌反無苔或比平昔較薄其胃腎津液不足者舌多赤而無苔或舌尖邊多紅點若舌中有紅路一條俗稱雞心苔血液尤虛此平人之常苔也周澄之曰常見舌中心如錢大光滑無苔其色淡紫但苦常遺滑余無他病又見舌質通體隱隱藍色余無他苔但患胃氣痛者此皆痰血阻於胃與包絡之脈中使真氣不能上潮故光滑不起軟刺是血因寒而瘀也通體隱藍是濁血滿布於微絲血管也故舌苔無論何色皆屬易治舌質既變即當察其色之死活活者細察底裡隱隱猶見紅活此不過血氣之有阻滯非臟氣之敗壞也死者底裡全變干晦枯萎毫無生氣是臟氣不至矣所謂真臟之色也若血敗凝瘀於中而舌必強硬而死也故察舌之吉凶則關乎舌質也章虛谷曰凡舌光如鏡毫無苔垢或有浮垢刷之即光者其色紅活是胃中虛熱色赤者營中邪熱皆胃津乾涸必多煩渴當用涼血滋陰兼助胃氣其苔可以漸生若舌質紅紫雜現而色不勻營血瘀滯也苔垢雜色並現或中有邊無中無邊有胃氣不化也若舌絳而光亮或絳而不鮮甚至於晦枯萎或淡而無色如豬腰樣者此胃肝腎陰枯極而舌無神氣者也急宜加減炙甘草湯加沙參玉竹雞子黃生龜板等類濡潤以救之若舌本淡白或如煮熟豬肝者此元陽敗胃無生氣如不毛之地故光而無苔必不能進食也縱服大劑參附後不能生苔或如浮皮此殘燈余焰必死不治倘有薄苔漸生則漸思食方為生機然百中無一二者其有舌本全白如紙毫無紅色不論有苔無苔元陽已絶而死劉吉人云舌上無苔質光如鏡為胃陰胃陽兩傷胃腸中之茸毛貼壁完穀不化飢不受食之候完穀傷陰脈必細澀亦有頑痰膠滯胃中痰滯胃中脈必洪滑而大茸毛亦不起皆有此候又有前半光滑無苔後根上有肉瘤兩粒如舌肉色者陰虛癆病之象也如表面無苔而皮內有一塊如錢大或黃或白者正氣不足血液虧虛兼有痰凝之候第七章辨舌苔有根無根之鑑別周澄之云前人只論有地無地可以辨熱之浮沉虛實不知有根無根亦可察中氣之存亡也地者苔之裡一層也根者舌苔與舌質之交際也夫苔者胃氣濕熱之所熏蒸也濕熱者生氣也無苔者胃陽不能上蒸也腎陰不能上濡也前人言之晰矣至於苔之有根者其薄苔必均勻鋪開緊貼舌面之上其厚苔必四圍有薄苔鋪之亦緊貼舌上似從舌里生出方為有根若厚苔一片四圍淨潔如截頗似別以一物塗在舌上不是舌上所自生者是無根也此必久病先有胃氣而生苔繼乃胃氣告匱不能接生新苔而舊苔仍浮於舌面不能與舌中之氣相通即胃腎之氣不能上潮以通於舌也驟飲誤服涼藥傷陽熱藥傷陰乍見此象者急救之猶或可復若病勢纏綿日久漸見此象真氣已索無能為矣常見寒濕內盛之病舌根一塊白厚苔如久經水浸之形急用溫里此苔頓退復生新薄苔即為生機余亦見寒濕內盛之人初病舌不見苔及服溫化之藥乃漸生白苔而由白轉黃而病始愈又如寒濕在裡誤服涼藥厄逆不止身黃似疸而舌反無苔脈象沉細無力此脾胃氣陷之徵也水氣凌心胃陽下陷忽變無苔日久即變黯紫也郭元峰脈如苔亦有內熱閉滯致脾氣不行飲食津液停積於胃故舌生苔若脾氣不滯則飲食運化津液流通雖內熱未必有苔也周氏又云亦有常人胃中夙有冷痰凝血舌上常見一塊光平如鏡又凡有痞積及心胃氣痛者舌苔亦多怪異婦人尤甚又見病困將死之人舌心一塊厚苔灰黃滯黯四面無輔此陰陽兩竭舌質已枯本應無苔而猶有此者為病中胃強能食五臟先敗胃氣後竭也或多服人參無根虛陽結於胸中不得遲散其餘焰上蒸故生此惡苔甚或氣絶之後半月胸中猶熱氣口脈猶動也余又見一腎陰腎陽大虧之人舌質紫紅潤澤無垢近舌根生一塊黑潤厚苔其苔上生緊密黑毛長二三分百藥罔效余用大劑溫腎填陰服多劑黑毛始脫黑苔亦逐漸化盡而愈此腎命大虧濁陰上結而生苔毛腎得溫補命火蒸騰濁陰漸化也第八章辨舌苔察時溫與伏熱吳坤安云凡外邪之入先到衛分衛分不解而後入氣分而營分再不解則深入血分如風熱無濕者舌質自潤無苔或有苔亦薄熱兼濕者必有濁苔而多痰此邪在衛分可汗解之如麻杏薄荷之類如舌苔白厚而干邪在氣分宜解肌清熱如荊葛翹荷之類白內兼黃仍屬氣分之熱不可用營分藥白苔邊紅此溫邪入肺灼干肺津不可辛溫過表清輕涼散為當若氣分化熱不解則入營分此由衛而氣由氣而營由營而血逐層遞進順傳之徑也或溫邪由口鼻吸入上焦心肺先受而後竟入營分舌苔亦由白而絳為逆傳也邪熱入營舌質必絳而燥惟犀羚梔翹鮮大青為妙品以能透熱於營中也邪在營分不解漸入血分入血分則舌質深絳煩躁不寐時有譫語宜急清血分之熱如鮮生地丹皮金汁犀角之類若舌質紅苔白根帶黃此熱雖入營溫濕之邪尚在氣分流連可冀戰汗而解若舌紅絛中仍帶黃白等色是邪在營衛之間當用犀羚以透營分之熱荊薄以解衛分之邪兩解以和之此由外而內自上而下順逆傳經法也外感溫病風寒諸感無不皆然若伏氣溫病自里出表乃先從血分而後達於氣分故溫暑初起舌即絳者因內挾伏氣而邪不入氣分而直竄營分也宜先清營分之熱如鮮地大青丹皮山梔豆豉白薇之類大抵寒溫自表傳裡發病即現白苔而舌質之色如常無變溫暑之邪自里達表初起舌質光紅雖有浮垢反而無根馬良伯云凡風寒濕諸熱病始起則舌滑而薄溫熱暑風始起則舌即絳色蓋溫暑病里先有鬱熱故宜清泄甚或用涼切忌辛溫芳燥邵仙根云傷寒邪從肌表而入以舌之白黃分表裡而汗下之溫暑從口鼻吸入以舌之絳白分營衛而清解之更以舌質之燥潤辨津液之存亡炳章按凡伏氣溫暑起病之初往往舌紅潤而無苔垢診其脈軟或弦或數口未渴而心煩惡熱即宜投以清解營陰之藥逮邪自營從氣分出而化苔然後再清其氣分熱可也若伏邪重者初起即舌絳咽乾甚則有肢冷脈伏之假象亟宜大清營分伏邪而反現厚膩黃濁之苔此即內伏之邪外達也既達於氣分則從氣分治之更有邪伏於深沉不能一齊化達者如前化出之苔已退盡色亦淡紅惟口苦或甜黏其內伏未盡之邪仍留也逾一二日舌復干絳苔復黃燥當再清之化之正如抽蕉剝繭層出不窮秋月伏暑深沉者屢多此類之症余前治姚姓婦伏暑因初病時尚食肉品麥面兼服補品逮熱重胃閉始停而後身灼熱胸痞便閉小溲短澀因熱逼血室經水適來俄頃未淨即止以至熱入血室耳聾目閉神昏譫語手足瘛瘲便閉溲澀前醫皆遵熱入血室例治多罔效至病勢危殆始邀余診治余診其脈弦數搏指舌底苔灰黑黃焦浮鋪苔上且黏厚板實舌尖深絳邊紫兼青詢其前由閲其服方參考現證為其疏方遂重用蠶砂鼠糞化濁道而通胞門之淤塞硝黃牙皂以滌垢攻堅積地鱉桃仁逐瘀通血絡鮮生地大青葉羚羊鉤藤清血熱而息肝風鮮菖蒲天竺黃豁痰而開心竅服一劑而大便下黑垢瘀塊成團成粒者甚多瘛瘲即定神志略清次晨復診脈勢已平而舌苔松腐黑垢滿堆刮去瓢余未減其半且逾時又厚繼進桃仁承氣湯加減服至五劑舌垢始淨身涼胃動調理而痊按此證因先病伏暑挾濕繼則挾食再則阻經停瘀濕蒸熱灼便閉溲澀邪無去路又值經來邪熱竟入血室經水被熱煎熬以致凝瘀淤塞胞門前醫雖當熱入血室治然藥性不能直入淤塞之胞門故皆罔效證因挾濕挾食挾瘀挾痰堆積至重重疊疊余治以先通胞門淤塞其血室內之熱亦同時引導下出舌苔因化反厚者此因積藏過多如抽蕉剝繭層出不窮者是也又有濕遏熱伏之證亦同前狀初起脈沉濡而數舌尖絳邊絳略淡中根灰白或灰黃厚膩日晡熱甚便不暢溲短澀此為熱伏於內濕遏於外伏暑秋瘟秋燥均多此證治法以蠶沙滑石蔞皮鬱金化濁宣氣開鬱鮮生地豆豉青蒿白薇焦梔以清透營熱從外達濕化熱透大便自下小溲亦長若誤用荊防枳朴反增胸悶乾嘔若用硝黃妄下則下利稀水口舌化燥胸悶乾嘔熱亦反增脾胃濁垢反不下此余屢驗之矣
