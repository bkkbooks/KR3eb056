body:
  text: 卷三第三編辨舌證治第十六章仲景察舌辨證法白苔傷寒論曰陽明病脅下硬滿不大便而嘔舌上白苔者可與小承氣湯上焦得通津液得下胃氣因和身濈然而汗出解也病如結胸狀而飲食如故時時下利寸脈浮關脈小細沉緊名曰臟結舌上白苔滑者難治臟結無陽證不往來寒熱其人反靜舌上苔滑者不可攻也成無己曰邪氣在表者舌上則無苔及邪氣傳裡津液結搏則舌上生苔也寒邪初傳未全成熱或在半表半裡或邪氣客於胸中者皆舌苔白而滑也經云舌上如苔者以丹田有熱胸中有寒邪初傳入里者也陽明病脅下鞕滿不大便而嘔舌上白苔者可與小柴胡湯是邪氣在半表半裡者也陽明病若下之則胃中空虛客氣動膈心中懊憹舌上苔梔子豉湯主之是邪客於胸中者也臟結宜若可下舌上苔滑者則云不可攻也是邪未全成熱猶帶表寒故也及其邪傳為熱則舌之苔不滑而澀也乾燥太陽病重發汗而復下之不大便五六日舌上燥而渴日晡時小有潮熱從心上至少腹鞕滿而痛不可近者大陷胸湯主之傷寒病若下後七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之金匱要略云肺中寒者兩臂不舉舌本燥喜太息胃中痛不得轉側食則吐而汗出也腹滿口舌乾燥此腸間有水氣己椒藶黃丸主之消渴病渴欲飲水口乾舌燥者白虎加人參湯主之病人胸滿唇痿舌青口渴但欲漱水不欲咽無寒熱脈微大來遲腹不滿其人言我滿為有瘀血成無己曰經云傷寒七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之是熱耗津液而滑者已干也若熱聚於胃則舌為之黃是熱已深也黃苔金匱要略云病者腹滿按之不痛為虛痛者為實可下之舌黃未下者下之黃自去成無己曰舌黃未下者下之黃自去若舌上色黑者又為熱之極也黃帝針經云熱病口乾舌黑者死以心為君主之官開竅於舌黑為腎色見於心部心者火腎者水邪熱己極鬼賊相刑故知必死觀其口舌亦可知其順逆矣第十七章胡玉海察舌辨證法頭痛身熱惡寒脈浮滑陽明太陽身熱口燥脈弦滑陽明少陽身熱舌苔白脈洪滑正陽陽明舌苔微黃正陽陽明舌苔前白後黃正陽陽明按是上寒下熱外寒內熱前黃後白正陽陽明按是上脘化熱而中焦有水飲四圍白中間黃正陽陽明白帶灰色陽明將入太陰白帶有路陽明太陰微白燥黃色陽明太陰粉白微紅陽明少陽無白微桃紅陽明少陰前半紅後半白少陽太陰前半紅後半黃少陰太陰前半黃後半黑陽明太陰前半黃後半赤太陰少陰前半黃後半紫太陰厥陰純黑色太陰純黃色太陰黃分八字陽明太陰一邊黃一邊白陽明太陰一邊黑一邊黃陽明太陰焦黑太陰潤黑大陰花黃灰黑陽明太陰純紅鏡面太陰其形色光如漆桌如光而不濕舌下華池皆千者重宜細審之舌厚如三個厚少陰舌闊如三個闊少陰舌園少陰舌平無尖少陰按舊謂舌邊缺如鋸齒者死白苔有一點點紅陽明少陽白苔有一點點黑陽明少陰白苔有一點點黃正陽陽明尖紅後赤少陰少陽尖赤後紫少陰少陽以上三十五法乃辨證之大略余照此類推之可也廣東福建浙江江蘇揚州分野魚鹽海濱之地腸胃脆薄氣盛血熱所以風邪一客即病頭雖痛不如斧劈項雖強尚可轉側背雖牽制尚可動搖風邪入胃肺則凝塞所以一日為風二日為熱三日為火熱甚之故熱與風火相搏凝寒成毒此毒胃主肌脾主肉不在肉而在肌肌毛竅之內也故點點然如斑之狀如疹之形紅色鮮明一日三潮三日九潮故毒必三日雖不治亦疏散也脈左寸浮右關滑氣口大無有正傷寒也故太陽經雖病不病此陽明之正病也謂之陽明太陽舌苔自一日不口渴二日不大便至三四五六日大便解則腠理開汗出而解如陽明第四日血熱成毒不能發越毒郁在中腠理不開郁遏邪熱則傳入少陽一日口渴左關洪大右關洪滑右寸氣口閉遏此肺經熱邪沖遏氣道不舒斑在肌腠血凝在皮少陰雖然受熱而未嘗著病二日目赤舌苔紅耳鳴左關脈洪大而數此熱甚邪勝也第三日譫語不能眠右關洪滑而實四日斑出則少解斑不出狂叫不安右關滑實有力左關脈洪數微弦左尺脈虛大此邪氣將入於裡第五日耳聾不欲眠起坐不休譫語欲狂此斑毒不得發越口乾消水舌苔紅黃色邪尚未曾傳裡也舌苔紅紫色將入於脾右關弦右關實乙木怒極熱鬱之甚耳聾腎之火閉也斑毒出於胸項脊背此陽邪有餘隱於項脊背此陽毒將陷於陰分六日大便解邪氣得下斑必發出六日不解火氣閉於幽門小便短澀毒反熏胃肺閉大腸熱目直視不欲見入脈數舌焦邪傳太陰目黃面黃此風勝濕鬱第七日耳聾口渴目黃兩顴黃赤舌苔焦脈與六日同此病尚在陽分未除邪雖入里猶可挽回少陽不得解邪傳入里流入太陰脾經一日右關洪大而軟左關弦徑左寸閉此熱邪客於包絡神昏氣短白珠紅肺經鬱抑斑毒則頸項上見者紅色兩頰無有心胸不見季肋有微點腹上點點紅色手臂前俱有紅色舌苔黃黑雖然傳裡陽證未除二日右寸見弦脈風邪客於肺將發白斑氣促者死鼻煽者死耳聾者生面頰紅者生閉目不欲見者生魚口鴉聲者死第三日右關數左寸不見右尺洪大此邪熱客於腎唇紫舌焦黑目直視不欲見人此毒鬱於小腸燥糞不得下斑隱於肉內怒狂叫罵者生口渴消水者生小便不滋潤者死第四日左寸閉左關弦左尺洪大右關虛軟右寸見芤脈右尺不見血熱在中焦斑見藍色第五日左右手關脈不見兩尺洪大聲嘶欲哭斑郁不得發越目黃身黃者死第六日尺寸俱無兩關弦緊舌苔濕滑此火盛感寒頭涼舌苔燥裂仍以火論或陽明第五日斑發不透邪毒不入少陽竟人太陰此非越經傳也或飲食所傷或藥餌所誤太陰一二日季脅痛下痢左關弦軟右關弦長氣口脈洪尺脈大口渴甚嘴唇乾舌燥神氣清舌苔黃厚黑灰色第三日舌根黑中黃尖白目赤面青左關脈數右關滑大有力肺脈大兩尺脈閉頭面有斑頸項無斑胸背有斑肚腹無斑此陽氣不得發越陰氣凝塞太陰四日左三部閉右關軟肺脈大尺脈洪口渴甚目紅面赤鼻青唇黑者死伏斑下陷太陰五日尺寸俱浮右關芤左關緊時作寒戰頭痛目赤鼻黑舌青唇紫者也斑毒乘於肝非傳厥陰邪中厥陰也太陰之脈利於無力邪入於脾氣盛血熱流於四肢分布百體貫注於心心神失司其權是以相火之邪甚熾心神與相火失位則一身無所主矣故四肢百骸俱痛腹滿口乾舌黃舌黑唇燥五臟與大小腸膀胱三焦皆受其制脈之細小者胃氣不傷脈之滑大者胃氣已壞胃主納穀脾主消穀胃主受納脾主轉輸胃之受納在於肺脾之轉輸在乎肝在上者為痰在下者為糟粕膈氣實則痰滯於膻中心氣熱則糟粕滯於小腸渴欲飲冷者膈氣熱也飲水不小便者肺葉焦也肺氣盛者則大腸之道不行夫邪在陰分不利見陽脈病在陽分不利見陰脈太陰之病利於細小虛軟不利於洪大滑實通其經絡導其閉塞毋使風木成邪致人九竅不通而死太陰之脈非獨取右關左寸左關右尺皆可概見也獨肺居華蓋肺氣凝澀更利於細小不利於實大與正傷寒之病傳入太陰皆脈大者病進脈小者病退有力者病進無力者病退滑實者病進虛軟者病退緊實者病進芤軟者病退洪數者病進細軟者病退如病之外現目紅面紅舌紅唇紅手足搖動坐立不寧舌苔焦黑此毒邪熾盛脈見細小此皆有胃氣不可謂不治也如目青面青唇青舌白脈見微細者毒氣下陷將出汗而死矣太陰病面赤目赤唇紫舌黑兩關見數脈者危見促脈者死面白目赤鼻青唇青舌苔灰色左尺右關見緊脈者死目赤面黃鼻煽唇青右寸見數脈關部見弦脈兩尺不應者死神氣如常舌苔微黑兩關見革脈者死舌黃目青面白唇白脈見微弱手足厥冷身發白斑者死舌光如鏡目紅面青兩關洪大兩尺洪數兩寸不應毒陷下焦頸項斑不出者死舌上芒刺苔色灰黑胸腹脹滿渴甚不欲飲水右寸見弦右關見軟左關見澀結胸者死舌尖平季脅痛舌苔焦黑時下清水口渴不欲飲湯水左尺見結右寸見代右關見牢熱結小腸死舌苔黃白點點紅紫唇青面白目赤左關見軟右關見牢肺脈不應者死舌苔厚白上灰黑色脾部乾燥唇紅目赤左關見軟右關沉實兩寸不應頸項發白斑者死舌苔紅紫目赤面黃唇乾胸滿神氣昏沉手足厥冷右關不應左關弦緊左尺空大斑毒陷下者死舌焦圓厚華池乾燥唇焦齒黑目紅面赤神氣昏憒脈見細小頻叫不知人者死知人者可生大便頻解不知人者死大便頻解漸知人者可生舌不出口發戰者死大便解後舌不潤轉者死不治大便解後神氣條清舌雖潤即出汗者死大便解後脈見獨大必定血從口鼻出急服更衣散一服使肝分得涼臟血可生如遲吐血必死夫病至太陰死證已多若傳入少陰則邪甚正衰危者十九死者亦多傳入厥陰則風木成邪九竅將閉不必細論矣凡舌紅面赤而兩手見陰脈或脈來搖擺無根恍惚難憑舌邊肝膽部位有一點點紅疱或紫疱如黃豆大者此熱毒歸臟或舌邊缺如鋸齒者皆不治之證在左肝膽位者重在右者輕在中間者更輕察其脈可救者須救之第十八章吳坤安察舌辨證歌六淫感證有真傳臨證先將舌苔看察色分經兼手足營衛表裡辨何難白苔主表黃苔主裡足經之邪分表裡治之白苔主衛絳苔主營手經之邪分心營肺衛治之邵仙根評凡診傷寒當先察舌之形色分別足經手經衛分營分在表在裡再參脈證施治無不獲效若拘定足六經治病非但無效且病亦鮮有合乎六經者白肺絳心黃屬胃紅為膽火黑脾經少陰紫色兼圓厚焦紫肝陽陰又青此條統論手經足經以舌之形色辨之邵仙根評此以形色分六經兼心肺兩手經足六經不言太陽者以太陽初感舌未生苔也故凡臨證見舌無苔而潤或微白而薄即是太陽若黃苔陽明紅色少陽黑苔太陰紫色少陰焦紫厥陰陽邪青滑厥陰陰邪太陽與肺同主表邪尚在表故舌無苔而或薄白邵仙根評表白里黃分汗下絳營白衛治分岐次將津液探消息澤潤無傷澀已虧白苔屬表當汗黃苔屬裡當下絳苔營分之熱宜清忌表白苔衛分之邪宜汗忌清治法天淵再以舌之燥潤驗其津液之存亡不拘何色但以潤澤為津液未傷燥澀為津液已耗熱病以存津液為主故宜深察白為肺衛仍兼氣絳主心營血後看白內兼黃仍氣熱邊紅中白肺津干凡外邪之入先到衛分不解然後入氣分而營分不解然後入血分白內兼黃仍屬氣分之熱不可用營分藥白苔邊紅此溫邪入肺灼於肺津不可辛溫過表清輕涼散為當衛邪可汗宜開肺氣分宜清猛汗難入營透熱羚犀妙到血未清地與丹凡舌苔白潤而薄邪在衛分可汗開肺即是開太陽如麻黃羌活之類如苔白而厚或兼干是邪已到氣分只宜解肌清熱如葛根防風連翹蟬蛻薄荷之類不可用辛溫猛汗也若寒邪化熱過衛入營或溫邪吸入竟入營分則舌苔紅絳而燥惟羚犀為妙品以能透熱於營中也邪在營分不解漸入血分則發熱不已宜清血分之熱鮮生地丹皮之類白黃氣分流連久尚冀戰汗透重關舌絳仍兼黃白色透營泄衛兩和間凡舌苔白中帶黃日數雖多其邪尚在氣分流連可冀戰汗而解若舌紅絳中仍帶黃白等色是邪在營衛之間當用犀羚以透營分之熱荊防以泄衛分之邪兩解以和之可也此條是泄衛透營之要法惟荊防不如薄荷連翹之穩邵仙根評白而薄潤風寒重溫散何防液不幹燥薄白苔津已少只宜涼解肺家寒此辨風寒與風熱治法不同凡風寒初入太陽則舌無苔或生苔白潤而薄此寒邪重津液不虧辛溫汗之可也如白苔雖薄而燥或舌邊舌尖帶紅此風熱之邪傷於氣分病在手太陰肺經津液已少不可過汗只宜輕清涼解氣分如前胡蘇子杏仁連翹黃芩薄荷桔梗淡竹葉之類苔若純黃無白色表邪入里胃家干更驗老黃中斷裂腹中滿痛下之安舌苔純黃無白邪入胃經熱而未實宜白虎等湯清熱涼潤若焦黃斷裂熱入胃腑而燥實症必腹滿堅痛故可下之邵仙根評凡治病先要辨清營衛表裡上文辨營衛此論辨表裡然表證即屬衛分故此專論里證傷寒由表入里故舌苔先白後黃至純黃無白邪已離表入里即仲景所云胃家實也然舌苔雖黃而未至焦老裂紋起刺大便雖閉而未至痞滿鞕痛尚屬胃家熱而未實宜清不宜攻必再驗其舌形黃厚焦老中心裂紋或起刺腹中鞕滿脹痛方用承氣下之則安舌中心屬胃幾腸中有燥矢舌中心必有黃燥黑燥等苔若腹元鞕滿耕痛之狀亦只須養陰潤燥不可妄用承氣攻之二條論外邪以舌之黃白分表裡惟舌燥有津虧邪實之不同須分別施治邵仙根評太陰腹滿苔黏膩蒼朴陳苓濕結開黃燥還兼胸痞滿瀉心陷胸二方裁濕邪結於太陰症必胸腹滿悶濕阻氣機宜以苦溫開之若痰熱濕邪結於心下而痞痛者邪滯中宮宜瀉心陷胸以開痞滌痰部仙根評陽明實滿舌苔老黃燥裂太陰濕滿舌苔白而黏膩陽明實滿滿及臍下少腹太陰濕滿滿在心下胃口此數句辨證確切當熟記之邵仙根評濕邪結於太陰則胸腹滿悶宜苦溫以開之蒼朴二陳二苓之類若黃苔而燥胸中痞滿此陽邪結於心下按之痛者熱痰固結也小陷胸法嘔惡溺澀者濕熱內結也瀉心法微黃黏膩兼無渴苦泄休投開泄安熱未傷津黃薄滑猶堪清熱透肌端病有外邪未解而里先結者如舌苔黏膩微黃口不渴飲而胸中滿悶是也此濕邪結於氣分宜白蔻橘紅杏仁鬱金枳殼桔梗之類開泄氣分使邪仍從肺衛而出則解矣不可用瀉心苦泄之法逼邪入里黃苔雖主裡如苔薄而滑者是熱邪尚在氣分津液未亡不妨用柴葛芩翹或梔豉翹荷之類輕清泄熱以透表邪亦可外達肌分而解也濕留氣分苔黏膩小溲如淋更快聯濕結中焦因痞滿朴陳苦溫泄之安此以黏膩舌苔為濕邪之驗白而黏膩者寒濕黃而黏膩者濕熱更驗其小便不利大便反快為濕邪痞滿乃濕邪結於中焦宜厚僕蒼朮二苓二陳之類苦溫以開泄之若舌黃黏膩痞滿嘔惡大小便俱不利此濕熱結於中焦宜瀉心法之類苦辛寒以開泄之上焦濕滯身潮熱氣分宣通病自痊濕自外來肌表著秦艽蘇桂解肌先凡看舌苔或白或微黃而黏膩不渴者總屬濕邪但濕自內出恆結於中焦而成痞滿若濕自外來上焦氣分受之每見潮熱自汗醫者表之不解清之不應不知熱從濕中來只要宣通氣分如淡豆豉茯苓皮滑石半夏豬苓米仁廣皮白蔻黃芩之類氣分濕走熱自止矣若冒雨霧濕邪留於太陰衛分之表發熱自汗不解口不渴飲身雖熱不欲去衣被舌苔灰白黏膩宜桂枝秦艽紫蘇茯苓皮二陳姜皮之類解肌和表濕邪自去濕熱久蒸成內著厚黃嘔吐瀉心權若兼身目金黃色五苓梔柏共茵煎濕熱內著從飲食中得之嗜酒人多此苔必厚黃黏膩痞滿不飢嘔吐不納惟瀉心最效川連乾薑赤苓半夏枳實茵陳通草之類濕熱內結若誤治必致成疸宜五苓加茵陳梔柏之類舌絳須知營分熱犀翹丹地解之安若兼鮮澤純紅色包絡邪干菖郁攢素有火痰成內閉西黃竺貝可加餐舌絳為邪入營中宜泄營透熱故用犀角以透營分之熱邪翹丹鮮地以清營分之熱邪邪入心包絡則神昏內閉須加廣鬱金石菖蒲以開之若兼有火痰必致痰潮內閉更當加西黃川貝竺黃竹瀝之類清火豁痰心承胃灼中心絳清胃清心勢必殘君火上炎尖獨赤犀兼導赤瀉之安如黃苔中心絳者心受胃火蒸灼也於清胃藥中加清心藥如石膏川連之類是也其勢必孤矣如舌刺獨赤起刺心火上炎之故犀角合導赤散以瀉之若見邊紅中燥白上焦氣熱血無干但清膈上無形熱滋膩如投卻疾難涼膈散去芒硝大黃加石膏能清膈上無形客熱其邪不在血分妄投滋膩必增病矣舌苔邊紅中心燥白乃上焦氣分無形之熱其邪不在血分切勿妄投滋膩血分之藥宜輕清涼解為治邵仙根評絳舌上浮黏膩質暑兼濕穢欲蒸痰恐旁內閉芳香逐犀珀蒼蒲滑郁含暑蒸濕濁則成痰暑濕兼穢恐蒙閉心包故用菖蒲鬱金藉其芳香逐穢犀角以透營分暑邪琥珀滑石清暑利濕舌絳黏膩上浮暑濕釀蒸痰濁矇蔽心包也急用芳香逐穢宣竅滌痰之法痰多可用西黃天竺黃之屬邵仙根評白苔絳底因何故熱因濕伏透之難熱毒乘心紅點重黃連金汁亂狂安舌苔白底絳者熱因濕邪遏伏宜泄濕以透熱如犀角滑石茯苓皮豬苓米仁茵陳黃柏之類若濕溫症舌現紅星點點此熱毒乘心神昏譫語宜苦寒之品治之狂亂者非黃連金汁不解如無金汁以人中黃代之黃連清心火金汁解熱毒舌絳碎生黃白點熱淫濕䘌欲生疳古名狐惑皆同此雜證傷寒仔細探舌碎絳而有黃白腐點者此濕熱邪毒蘊久不宣蒸腐氣血化為瘀濁得風木之氣化而成蟲也上邵仙根評狐惑即牙疳下疳之古名也近時惟以疳名之牙疳即惑也蝕咽腐齦脫牙穿腮破唇下疳即狐也蝕爛肛陰由傷餘毒與濕䘌為害若胃強能食能任苦寒重藥者可治按狐惑蟲症也上唇有瘡蟲食其臟兼咽爛名惑下唇有瘡蟲食其肛兼聲啞名狐面色乍白乍黑乍赤惡聞食氣情志默默此其候也此參準繩與金匱之言相同又云狐惑蟲病也惑當作𧌒看其上唇內生瘡如粟唾血心內懊憹而痛此蟲在上食其五臟下唇內生瘡者其人不寤此蟲食下部是也金匱云食於上部則聲啞甘草瀉心湯食於下部則咽乾苦參湯洗之蝕於肛者雄黃熏之邵仙根評舌絳不鮮枯更萎腎陰已涸救之難紫而枯晦凋肝腎紅澤而光胃液干舌形紫晦如紫肝色絶無津液者為枯舌形斂縮伸不過齒為萎此肝腎已敗不治若舌色紅澤而光其色鮮明者屬胃陰乾涸猶可滋養胃陰甘涼純靜之品主之如鮮生地鮮石斛蔗漿梨汁之類黃厚方知邪入里黑兼燥刺熱彌深屢清不解知何故火燥津亡急救陰舌苔黑燥為陽明之熱腹無痞滿硬痛非承氣證只宜清解若清之不應是腸中燥火與熱邪固結胃土過燥腎水不支胃中陰液已於宜大小甘露飲以救胃汁陰液充溢陽邪自解二便自通黑滑太陰寒水侮腹痛吐利理中宜更兼黏膩形浮胖伏飲凝痰開逐之舌苔黑滑為太陰之寒所謂寒水侮土理中證也若兼黏膩浮胖是濕痰寒飲伏於太陰當用溫藥和脾如二陳厚朴薑汁合五苓之類開之逐之痰飲自去舌見邊黃中黑膩熱蒸脾濕痞難禁吐嘔便閉因傷酒開泄中焦有瀉心胃熱蒸脾濕則舌黃中帶黑膩中焦痞滿嘔吐小便不利嗜酒人多此證舌苔邊黃中心黑膩是胃熱蒸動脾濕蘊結中宮以致痞滿嘔吐便閉用瀉心湯開泄中焦邵仙根評寒濕常乘氣分中風兼二氣自從同重將黃白形中取得訣才將脈證通寒濕二氣都入氣分鳳兼寒濕亦入氣分風兼溫熱或人氣分或入營分矣氣分之邪於舌苔之黃白取之營分之邪於舌苔之紅絳取之得此要訣再將脈症兼參病無遁形溫邪暑熱走營中兼入太陰氣分同吸受心營並肺衛暑溫挾濕衛營通溫暑二氣常入營分兼入氣分蓋溫暑都從口鼻吸入則上焦先受故或入心營或入肺衛或先衛後營惟濕邪常走氣分必暑挾濕濕挾暑則三焦營衛通入矣傷寒入里陽明主熱病陽明初便纏先白後黃寒化熱純黃少白熱蒸然太陽主表陽明主裡傷寒由表達里故在表屬太陽入里即入陽明腑病熱病自內發外借陽明為出路故初起即在陽明但看舌苔先白後黃者傷寒由表達里寒化為熱也若初起純黃少白或黃色燥刺是病發於陽明由里出表熱勢蒸然內盛也更參外症初起惡寒發熱為傷寒壯熱無寒為熱病熱病無寒惟壯熱黃芩梔豉古今傳惡寒發熱傷寒證發汗散寒表劑先凡溫熱之證不可發汗如仲景陽明病之梔豉湯少陽病之黃芩湯皆可通治此條亦伏氣所發之熱病切不可辛溫發汗宜用梔豉黃芩等方清解少陽陽明若是傷寒可用表劑發汗矣邵仙根評少陽溫病從何斷舌絳須知木火然目赤耳聾身熱甚梔翹犀角牡丹先凡溫病熱病皆純熱無寒熱病發於陽明溫病發於少陽當從何法斷之但看舌苔黃燥為陽明熱病絳赤為少陽溫病溫病宜用犀角梔翹鮮地丹皮之類以解木火之郁大忌汗散舌絳赤外證耳聾目赤者是溫病從少陽而發出也當清解木火之郁與傷寒少陽證之可用表散不同故忌汗散邵仙根評若是溫邪從上受竅中吸入肺先傳芩翹梔豉桑蔞杏氣燥加膏肺分先邪入心營同膽治再加元參郁蒼鮮溫邪從內發者以少陽膽經治之若因天時晴燥太過其氣從口鼻吸入則上焦心肺受邪舌苔白燥邊紅治在氣分舌色鮮紅治在營分營分與少陽膽經同法亦用犀角丹皮鮮生地之類再加元參麥冬廣鬱金鮮菖蒲以清心開竅也春時溫邪從口鼻吸入受而即發舌苔不燥者邪先入肺也從肺衛氣分治之若舌鮮紅而絳邪入心營也治與少陽膽經同法加入清心開竅之品邵仙根評寒溫二氣前粗辨暑濕相循病必纏溫病已陳黏膩舌只將暑證再提傳上文論傷寒溫病以下言暑邪濕溫邵評暑傷氣分苔因白渴飲煩嘔咳喘連身熱脈虛胸又滿無形氣分熱宜宣蔞皮貝杏通芩滑梔豉翹心竹葉煎或見咳紅荷葉汁痞加朴蔻鬱金川邵仙根云此條暑傷氣分治從肺衛如肺氣鬱則暑邪逆入營中故咳紅暑入心營舌絳紅神呆似寐耳如聾溺淋汗出原非鮮失治邪干心主宮犀滑翹丹元地覓銀花竹葉石菖同欲成內閉多昏昧再入牛黃即奏功暑熱之邪上蒙清竅則耳聾不與少陽同例忌用柴胡乘於胞絡則神昏宜清心開閉凡邪在手經忌足經藥凡溫熱暑邪由口鼻吸入邪在手經從三焦立法忌用足經藥此與治傷寒分別處也邵仙根評暑濕合邪空竅觸三焦受病勢瀰漫脘悶頭脹多嘔惡腹痛還防瘧痢干梔豉杏仁芩半朴銀花滑石郁紅安暑邪挾濕從口鼻空竅觸入則三焦氣分受病頭脹脘悶嘔惡此邪初入見症其勢尚輕故只用梔豉等以清宣氣分余如鮮枇杷葉通草淡竹葉之類亦可加入暑熱之邪留於膜原則變瘧入於腸胃則成痢治宜隨症加減濕溫氣分流連久舌赤中黃燥刺干咯血毋庸滋膩入耳聾莫作三陽看三焦並治通茹杏金汁銀花膏滑寒若得疹痧肌肉透再清痰火養陰安凡暑濕合邪輕者氣分微結重者三焦俱病清解不應即屬濕溫重症肺氣不得宣暢則釀成膿血濕熱上蒙清竅則耳聾無聞治當急清三焦氣分一鬆則疹痧得以外達再議清火清痰漸入養陰之品苔形粉白四邊紅疫入膜原勢最雄急用達原加引藥一兼黃黑下忽忽凡時症初起苔形粉白而厚四邊紅絳者此疫症也邪在膜原其勢最雄頃刻傳變診家不可輕視吳又可用達原飲加引經表藥透之達之如兼太陽加羌活陽明加葛根少陽加柴胡如舌變黃燥色乃疫邪入胃加大黃下之如變黑色入里尤深用承氣下之疫勢甚者其舌一日三變由白變黃由黃變黑當速下之若見鮮紅純絳色疫傳包絡及營中清邪解毒銀犀妙菖鬱金黃溫暑通濕疫一症治分兩途但看舌苔白而黃黃而黑者疫邪自表達里汗之下之可也如見舌苔鮮紅絳色此疫邪入於營分及包絡之間汗下兩禁惟宜清營解毒逐穢開閉如犀角銀花菖蒲鬱金西黃金汁人中黃之類與溫熱暑證治法相通溫邪時疫多斑疹臨證須知提透宜疹屬肺家風與熱斑因胃熱發於茲邵仙根云此條溫暑斑疹與傷寒發斑不同疹屬肺經風熱斑是胃家伏熱時疫斑疹兼有毒氣均宜提透清解熱毒疹斑色白松肌表血熱知丹犀莫遲舌白荊防翹薄力舌紅切忌葛升醫疹斑發於氣分其色淡紅而白者舌苔亦白宜葛根防風蟬衣荊芥連翹薄荷牛蒡等松肌達表若見赤斑丹疹邪在營分血分舌必絳赤宜犀角連翹鮮生地人中黃金銀花等透營解毒大忌升葛足經之藥邵仙根云白疹邪在氣分舌白淡紅宜松肌達表從肺清透紅疹邪在營分舌苔絳赤宜清營宣透凡屬正虛苔嫩薄淡紅微白補休遲厚黃膩白邪中蘊診者須知清解宜不拘虛寒雜證正氣虛者其舌苔必嬌嫩而薄或淡紅或微白皆可投補若見黃而白厚而膩總屬內邪未清不可遽進補藥邵仙根云此條憑舌以驗其虛實分別宜清宜補之總訣又云以上三十九歌皆察舌辨證之要法語語的傳可謂時病金針矣後學當熟讀之第十九章察舌辨證之鑑別蓋心之本脈繫於舌根脾之絡脈繫於舌旁肝脈循陰器絡於舌本腎之津液出於舌端分布五臟心實主之故舌者內通五臟外系經絡上達腦府神經下應外腎二便有病與否皆可於此決之如虛實寒熱真假陰陽順逆生死等項由斯辨之亦能審其病之宜補宜瀉因溫因涼是真是假屬陰屬陽察其順逆以定生死因內臟之病無不顯現於舌也茲就上述各舉於後第一節虛實邪氣盛則實正氣奪則虛舌色深赤邪氣實舌色淡紅正氣虛舌深赤苔薄而滑者正勝邪舌淡紅苔厚而澀者邪勝正不知病之屬實者其舌必堅斂而蒼老病屬虛者其舌必浮胖而嬌嫩正氣虛者其舌苔必嬌嫩而薄或淡紅或微白皆可輕補若見苔黃而白厚而膩總屬內邪未清不可投補又實熱之證全舌必有黃黑苔積滯乾焦罅裂芒刺等苔陰虛之證全舌必絳色無苔雖有橫直罅紋而舌則短小不等若全舌無苔有津濕而光滑或其苔白色與舌為一刮之不起垢膩口唇必潤澤無縫淡白透明是虛寒也如純屬白舌光滑無苔乃臟腑氣血皆虛寒也故白薄而淡及白而嫩滑者為虛舌無苔垢而色變者虛也舌白無苔而明淡外症熱者胃虛也舌白唇白或流血過多或脾有虛病也舌苔黃濁者為實若黃白相兼間有淡灰者為虛黃厚糙刺者為實黃薄光滑者為虛章虛谷云凡苔薄舌本赤者為營熱若淡而不紅者為心脾氣血素虛雖有黃苔亦必不甚厚此辨本元之虛實邪氣之輕重也又如黑苔有芒刺者為實黑如煙煤隱隱而光滑者為虛吳貞曰舌黑而潤滑者屬腎虛也若舌淡黑如淡墨一般乃腎虛火炎為無根之火若滿舌紅紫無苔亦屬腎虛王士雄云凡黑苔虛寒證其舌色必潤而不紫赤更有陰虛而黑者苔不甚燥口不甚渴其舌本甚赤或舌心雖黑無甚苔垢舌本枯而不甚赤證雖煩渴便閉腹無滿痛神不甚昏俱宜壯水滋腎不可以為陽虛也更有病後絳舌如鏡發亮而光或舌底嗌乾而不飲冷此亦腎水虧極也周澄之曰若舌中忽一塊如鏡無苔而深紅者此脾胃包絡津液大虧潤溉不用也亦有瘀血在於胃中無病或病愈而見此苔者宜疏消瘀積不得徒滋津液按舌細如魚子者心與命門真火所鼓若包絡有凝痰命門有伏冷則舌面時忽生一塊光平如鏡若舌如泥色者為脾腎虛極也第二節寒熱舌上無刺而津潤者中寒也舌上青黑無刺而津潤者中寒也舌無苔而冷滑者少陰之寒證也舌黑少神而潤滑者虛寒也舌灰黑無苔脈沉者寒中三陰也舌黑無苔而燥者津液受傷虛陽上越也若脾胃虛寒則舌白無苔而潤甚則連口唇面色俱痿白者此因泄瀉或受濕脾無火也若苔黃厚而舌中青紫甚則碎裂口燥而舌不幹者此夾陰寒證也宜溫下之張三錫云白苔屬寒外證煩躁欲坐臥於泥水中者乃陰火逼其無根失守之火而然脈大不鼓皆從陰證治若不大燥嘔吐從陰證夾食治之脾熱者舌中苔黃而薄心熱者舌尖必赤甚或起芒刺肝熱者邊赤或赤有芒刺其舌苔厚而黃者胃微熱也舌中苔厚而黑燥者胃大熱也黑燥如中心厚者胃濁邪熱乾結也章虛谷云凡現黃苔浮薄色淡者其熱在肺尚未入胃胃熱則苔厚而色深或苔薄而舌本赤者營熱也極紅紫如豬肝色者為火灼胃爛死證也醫鏡云赤為熱深黃為濕熱食滯黃薄為濕寒水飲灰白為脾陰虛寒紫黑為熱極或脾胃有瘀血伏痰滿舌黑苔而生大刺乾燥底紅者實熱也舌生芒刺者結熱甚也舌變棕黑色者亦熱甚也又有舌色干黃刮之不淨為熱甚也淺黃膩白者微熱也乾澀深黃厚膩者大熱也芒刺老黃析裂者熱極也潤白為寒若白色如鹼或白如膩粉為實熱也粉白乾燥為實熱更甚也如舌由黃而黑或腫或起焦刺或卷短堅硬黑而芒刺皆實熱也如黑而兼青黑而濡滑黑而柔軟皆寒證也又如陰寒舌黑苔必濕冷而滑不燥不渴脈必沉細證必足冷當以四逆湯溫之第三節真假真者有跡刮之底色不去假者無形一刮底色全無如白苔黃邊舌刮之見淡紅潤澤之底為微邪也若底留粗澀垢膩如薄漿腐一層者是內熱也再刮之仍不淨是脾胃真熱假寒也黃色真熱白色假寒如白苔上起黑刺刮之黑刺即淨光潤不幹亦為真寒假熱之證若白苔黑根而且乾厚刮之黑刺即淨光潤不幹亦為真寒假熱之證若白苔黑根而且乾厚刮之不厚無津燥苔口渴消水者真熱假寒也亦有食枇杷則苔黃食橄欖則舌黑然染成黑苔則刮之即見本色凡見黑苔先以指甲刮之真者刮之不去假者一刮即去凡舌須有地質堅斂蒼老不拘苔色黃白灰黑由舌中延及舌邊揩之不去刮之不淨底仍粗澀黏膩是為有根之真苔中必多滯舌無地質浮胖嬌嫩不論苔白黃灰黑滿布舌中不及舌邊揩之即去刮之即淨底亦淡紅潤澤不見垢膩是為無根之假苔里必大虛若清晨苔色滿布飲食後苔即脫去舌質圓浮胖嫩者亦為假苔活人心法云凡以手捫舌滑而軟者病屬陰粗而燥者病屬陽尚是然虛寒者舌固滑而軟而邪初傳裡及真熱假寒者亦間有滑軟之舌其鑑別臚舉於下虛寒證必全舌淡白滑嫩無餘苔無點無罅縫邪初傳裡證全舌白滑而有浮膩苔真熱假寒證全舌色白而有點花罅裂積沙各實苔不等而舌面之苔刮亦不淨底色且隱紅多刮欲嘔若重刮之沙點旁或出血少許此真熱證也宜慎辨之以上為滑軟之別實熱證及邪熱入陰經證實熱證全舌必有或黃或黑積滯乾焦罅裂芒刺等厚苔若鬆浮而不及邊沿一輕擦即脫淨舌底必淡白而不紅或淡紅而舌圓大胖嫩為邪熱入陰經真寒假熱證全舌亦或黑苔乾焦裂紋芒刺厚苔惟用生薑切平輕擦即脫淨舌底必淡白而不紅或口呼渴而不喜飲水者為真寒也若用生薑擦之而苔堅不退或口極渴而飲水多者是實熱甚也陰虛水涸症全舌必絳色無苔或有橫直罅紋而舌短小不等第四節陰陽凡察舌以手拭舌滑而軟者病屬陰粗而燥者病屬陽陰虛陽盛者其舌必乾陽虛陰盛者其舌必滑陰虛陽盛而大旺者其舌必乾而燥陽虛陰盛而大衰者其舌必滑而濕舌苔有剝落不生者為心陰不足心陽有餘或胃陰將涸舌無苔結成干赤光皮似煨熟豬腎乃陽中伏陰也凡舌無苔有因誤下濕陷於裡阻遏氣機使命門之真陽不得上達蒸騰腐化而反無苔也第五節順逆舌苔有由白而黃由黃而黑者順證也有由白而灰由灰而黑不由黃轉黑者此謂之黑陷苔逆證也此因誤用溫燥之藥過多之故難得挽救其由黃而黑者乃陽明熱結之故潤下得法胃腑炭氣得以外出也故曰順證也若黃轉黑枯者真陰將絶也遵經云舌上有苔者必自潤而燥自滑而澀由白而黃由黃而黑甚至焦枯或生芒刺此用藥不當邪氣傳裡由淺入深之逆證也劉吉人云苔黃為正白次之無論何證若用藥當皆由白而黃由黃而退由退而復生新薄白苔此為全愈順象也若用藥不當則由黃而白由白而灰由灰而黑由活變死苔此逆象也若驟退驟無不由漸而退此陷象也如夏月人病黑苔是時氣與邪火內外炎爍尚有可生如冬月黑苔厚刺正不勝邪必難治也若傷寒初起二三日即見黑苔心腎之氣敗絶內臟真色外現又如舌全黑而不見赤色者是水來滅火皆必死之證若白苔中心漸漸黑者乃邪熱傳裡紅色上漸漸有黑心者乃濕熱溫疫傳變壞病將至也大抵尖黑猶輕根黑最重也第六節生死生死之決於脈者前賢垂訓明且備矣然驗之於舌則尤顯而易見也茲將舌所經驗之危症匯録於下唇青舌黑如去膜豬腰者為亡津液不治之症也舌如鏡面者舌鑑云舌色紅光滑柔嫩無津者是也良由汗下太過元津耗傷宜大劑生脈散救之尚可復生也舌如硃紅柿者舌糙刺如砂皮而乾枯燥裂者舌斂束如荔子殼而絶無津液者舌如烘糕者舌本強直轉動不活而語言蹇澀者以上危候也然危候雖見而執診者胸有灼見虛實寒熱之綱領猶可生也如舌見白苔如雪花片者脾冷而閉也若全舌竟無苔久病胃氣絶也如舌因誤服芩連而現人字紋者如舌卷而囊縮者以上各證見一必死然敗象雖見凡吾輩亦宜百不一治之證當作萬有一生之望竭力挽救修短雖有定數然返之吾心可告無罪也其他如舌忽變棕黑色者熱病將死也舌焦乾黑而脈代者死證也疳病耳邊有青脈舌上有焦點者不治也疳病口渴飲水不止舌黑者死證也舌見藍色者肺氣傷也微可治深必死舌短卷痿軟枯小者危舌淡灰轉黑淡紫轉藍邪毒攻心已甚而傷腐脾胃者危不治舌黑爛而頻欲齧必爛至根而死舌底乾燥不拘苔色黃白如豆腐渣者或如齧碎飯子者皆死此俗名飯花苔舌與滿口生白衣如黴苔或生糜點胃體腐敗也多死舌乾晦枯痿而無神者必死舌絳無苔乾枯細長而有直紋透舌尖者心氣內絶也舌燥苔黃中黑通尖利下臭水者胃腸腐敗也十不救一舌㿠白兼青此中焦生氣已絶也多死若孕婦面舌俱青母子俱死舌黃全舌見薑黃色苔及淡松花舌苔皆津枯液涸而冷陽衰胃敗之徵亦多不治舌邊缺陷如鋸齒者內臟已虛憊亦不治也第二十章舌病證治之鑑別千金方云舌重十兩長七寸廣兩寸半善用機衡能調五味遵經云手少陰通舌本足少陰挾舌本足厥陰絡舌本足太陰連舌本散舌下舌本在下舌尖在上舌中為內舌邊為外左病應左右病應右舌膜由三焦腠理直達胃腸舌本由經絡直通心脾腎故凡舌之偶生疾患如腫瘡疔癰重木疔菌黃衄及二強暗瘲痹麻齧短等病皆由臟腑鳳毒邪熱搏於血氣隨其虛實發現於舌著而生病猶當分其舌之體質病與舌之功用病為二種如心脾熱壅為腫舌舌根粗大木悶而硬為木舌舌根腫脹為重舌風濕相搏則舌生瘡或為癰脾熱則生黃心火上炎則生疔或生菌肝壅則出血為舌衄惟舌斷由於外傷非發自內也此皆舌之體質病也余如心之本脈繫於舌根脾之絡脈繫於舌旁故主舌強舌縱肝脈循陰器絡舌本故為舌痹舌麻舌短七情氣鬱則舌不能言為舌喑少陰厥氣逆上為齧舌此皆舌之功用病也茲條舉兩類於後甲舌之體質病第一節腫舌舌腫一症皆由心火旺盛逼血挾痰上壅所致內必煩躁悶亂甚則不能出聲有舌卒腫如豬胞者有腫硬如木石者有脹寒滿口不能通聲者有舌下形如螻蛄形或如臥蠶形者皆宜急將腫突處砭去其血仍用釜底煤以鹽醋調厚傅之得效方云舌卒腫如豬胞者以針刺舌下兩旁大脈血出即消切勿刺中央總脈誤刺則血不止而死若誤刺以銅筋火燒烙之或醋調百草霜塗之須臾自消或用冰片一分火硝硼砂各三分青黛膽礬各三分殭蠶五分共為末吹之即愈三因方云凡舌腫舌下如有噤蟲狀形如螻蛄臥蠶有頭尾其頭小白可燒鐵烙烙頭上即消不急治能殺人張戴人云一老人身熱數月舌根腫起和舌尖亦腫腫至滿口比原舌大三倍用䤵針磨令鋒極尖輕輕砭之日砭八九次出血約一二盞痛減腫消此亦心火旺極之候如舌腫滿口不能出聲由心脾之火併結於舌宜蒲黃散蒲黃海硝等分為末摻之蒲黃性寒能清瘀涼血即愈如暴腫如豬肝狀滿口不能出聲者亦宜醋調釜底墨塗舌下脫即更傅如舌腫咽生瘜肉而痛者宜稱錘燒紅淬醋一盞飲之如舌下忽然高腫起核名舌墊者宜荊荷湯荊芥防風薄荷白芍殭蠶蟬衣黃連鮮生地香附煎湯服之如口唇腫痛狀若無皮或發熱作渴此屬脾胃虛熱宜清熱補氣湯太子參生居朮浙茯苓生甘草生白芍全當歸鮮金叉烏元參破麥冬五味子竹葉煎服如不應加炮姜三四分如眼如煙觸體倦少食午後益甚此屬陰血虛寒宜清熱補血湯四物湯加元參知母黃柏丹皮五味子麥冬柴胡懷牛膝如舌腫由於酒客膏粱積熱內盛上焦痰實者宜涼膈散清瀉之如七情所郁舌脹滿不得息宜舒郁清上焦外用生川烏生南星乾薑等分為末醋調手足心又有痰包赤如腫舌乃痰飲乘火流行凝注舌下結而皰腫綿軟不硬有妨言語甚則塞令滿口疼痛不安用䤵針對包上捻之如鑽破出稀痰如雞子清稠黏不斷拭淨用冰硼散梅冰片一分煅硼砂五錢辰砂一錢淡牙硝一錢末搽之內服二陳湯加芩連薄荷牙皂若痰包破後復發者宜清金如呈散方見萬病回春若舌上痰核乃痰氣結於舌上作痛強硬者用細針點破出血水亦用冰硼散吹之若飛絲入口間亦生泡腫用嫩蘇葉細嚼白湯送下第二節木舌凡舌不能轉掉腫而不柔和者名曰木舌先有風寒傷於心脾熱壅生痰以致舌腫粗大漸漸硬塞滿口氣不得吐如木之不和軟者然其外證憎寒壯熱齒浮腫痛不急治即脹塞殺人內服宜黃連湯川連鮮生地歸尾焦梔赤芍麥冬犀角薄荷生甘草水煎食後服外以針日砭八九次令出血二三盞自然腫消痛減再用龍腦破毒散淡牙硝二錢上青黛殭蠶生甘草各八分蒲黃五錢馬勃三分片腦麝香各一分共研極細末指蘸擦患處即瘥或用硼砂末以生薑片蘸指少時即消又有一症舌腫生舌根下狀如白棗有紫筋不能速愈初起不疼不發寒熱漸漸腫大速治可愈皆由憂鬱所發竇漢卿曰木舌證硬如穿山甲見人舌做一拳外證憎寒壯熱語言蹇澀此心經受熱治法以小刀點紫黑處出紫黑血盞許內服外搽治法同前又有舌上有白苔結硬必作木舌藥味不得入者揩拭潔淨用竹刀刮舌然後用藥凡肝經熱甚舌亦木硬張百憲云舌忽脹大腫硬脹塞滿口即時氣絶名曰霎舌用膽礬不拘多少新瓦上焙紅放地上俟冷研細擦舌立愈竇漢卿雲此證因心經熱毒或因酒後溫床厚被以致熱氣攻心故令舌脹而紫急吹導痰開關散吐去風痰急用三稜針刺舌下金津玉液二穴及刺乳蛾破出血痰接用龍腦破毒散方見前井水調成膏細咽即吐惡血自愈第三節重舌附蓮花舌重齶重齦重舌乃舌下生一小舌其色鮮紅外證頦下浮腫有硬核此因心經熱毒或由心經遏郁憂思過度心脾鬱而生熱其狀附舌下而近舌根形如舌而微短小當以針刺點患處上出惡血內服黃連瀉心湯或一味黃連湯外吹用冰硼散方見腫舌搽之或用紫雪丹青硯煅硼砂元明粉各三錢梅冰一錢麝香五分研極末摻舌下流出毒涎或用牙皂炒一錢元明粉三分研細摻之涎出自消蓮花舌是舌下生三小舌其狀如蓮花之形皆由思慮太過心火上炎或酒後當風取涼以致風痰相搏而成此候急用清涼解毒湯加減服之外以針刺出惡血以竹瀝調黃柏末塗之顧練江云蓮花舌男婦多因思慮過度每生此舌若因循日久以致潰爛腐穢舌頭一爛外殼雖存其中如爛魚腐腸相似切不可用升降藥吹搽偶一誤用即血出如泉至穿腮腐根百不一生重齶其有著頰裡及上齶生一瘡形如楊梅謂之重齶外證無寒熱但作事煩心先以甘桔湯重加焦梔後服黃連解毒湯外用冰硼散吹之不宜用刀或常以紫雪丹方見前噙化重齦其著於齒齦上下者名曰重齦宜砭刺出血用烏犀膏牙皂二條研末焰硝百草霜各一錢人參二錢白梅少許好酒一合全前藥攪勻令稠以鵝翎點入喉中蘸點喉中以出盡頑痰為度外以天南星散生南星去皮臍研極細末用醋調塗男左女右腳心厚皮紙貼如干再用醋潤凡治重舌用陳醋一碗五靈脂一兩入銅杓內煎三沸為度離火用箸攪之沫平再煎俟冷將醋少許頻含待涎末滿口即吐勿咽下外用牙皂四五支去皮弦炙焦荊芥二錢共為末以米醋調塗腫處即消又以蛇蛻燒灰研極細少許傅之第四節舌菌心法名舌疳由心脾毒火所致其證最惡初起如豆次則如菌頭大蒂小其色紅紫疼痛異常甚則紅爛無皮朝輕暮重輕則用溏雞屎和冰片塗上蓋用蒲黃末或蜘蛛絲纏緊忍痛自落若落後出血用蒲黃末或百草霜烏梅末銅緑摻上皆止重而急者用北庭丹番硇人中白煅各五分瓦上青苔瓦松溏雞屎各一錢用銀管子二個將藥裝在罐內將口封固用鹽泥固濟以炭火煅紅俟三炷香為度候冷開罐將藥取出再加冰片麝香各一分共研極細末以磁針刺破舌菌用丹少許點再以蒲黃末蓋之自然消縮而愈若失治則焮腫突如泛蓮或如大木耳或如雞冠舌本短縮將妨害言語飲食時流臭涎再因怒氣上衝忽然崩裂血出不止久久延及項頷腫如結核堅硬骨痛皮色如常頂軟色黯破後時流臭水腐如爛綿其證雖破堅硬腫痛仍前不退此為綿潰甚至透舌穿腮湯水漏出是以名瘰癧風也內服湯藥宜用異赤湯加川連焦梔重則解毒湯加焦梔犀角鮮地外治或用錦地羅蘸醋磨敷自古治法雖多然此證治愈者十不得一第五節舌黃奎光曰舌黃乃舌生黃腫疼痛亦屬心脾之火先用冰片散摻之內服涼心清熱如元參升麻湯治之又如舌生黃腫至滿口以蛇蛻一張含舌下即消第六節舌疔心法云舌疔者乃心脾火毒舌生紫疱其形似豆堅硬寒熱疼痛應心而起宜用蟾酥丸含放舌下隨化隨咽或再服三丸以解內毒甚者以銀針刺之內服黃連解毒湯甚則犀角地黃湯兼擦紫雪丹余師愚云若舌上發疔或紅或紫大如馬乳小如櫻桃三五不等流膿出血宜甘露飲方見溫熱經緯增石膏犀角連翹加銀花金汁水重清心火舌上成坑愈後自平舌上宜搽錫類散第七節舌癰奎元曰舌癰初起舌紅而腫大心經火盛地角亦紅初起用金丹碧丹方見瘍醫大全煎藥用黃連焦山梔犀角連翹木通生地丹皮生甘草麥冬赤芍水煎服第八節舌瘡舌瘡有心熱火毒上炎而生者有下虛陰火上浮而生者若口中生瘡於舌上吐出在外寸余上結成黃靨難以食物此熱毒在心也用冰片一分入蚌口內立化為水乃以鵝翎敷掃其上立刻收入外服清火涼心之藥亦有舌上病瘡久蝕成穴屢服涼劑不效後服黑錫丹漸愈此因下虛上實之證即遠公所云下焦元虛不降投養正丹遂愈是也竇夢麟云舌上生瘡如黃粟外證口張憎寒亦宜先用蚌水或田螺水漱淨然後吹藥如冰硼散紫雪散皆可用之第九節舌衄凡舌上出血名曰舌衄多由心脾熱甚逼血妄行若舌上無故出血如線不止乃血熱上溢心苗宜用犀角地黃黃連瀉心湯選用外以槐花炒研細末乾摻之或出血竅如簪孔者以杜赤豆一升煎取汁一杯不拘時服外亦用槐花末摻之或用露蜂房頂上實處一兩川貝母四錢蘆薈三錢為細末蜜為丸雷丸大每含一丸若舌上出血如泉者乃心火旺極血不藏經也宜用六味地黃湯加炒懷牛膝槐花外摻用文蛤散五倍子炒白膠香牡蠣粉等分為末不令潮每用少許摻患處或燒熱烙鐵烙孔上亦止有因肝熱血上壅而衄者先用木賊草四錢煎濃汁漱口外摻炒蒲黃末即止沈金鰲云如舌忽然腫硬如石血出如湧泉者宜蒲黃散方見舌腫摻舌上亦有不硬腫痛流血者宜涼血清脾飲犀角地黃湯凡紅尖舌出血乃心經熱毒壅盛心血不藏妄行而濺用三黃瀉心湯加犀角翹柏正義云舌紅而出血如衄為熱傷心胞犀角地黃湯主之慎庵將前方加蒲黃川連更妙大抵病心經熱極者多舌出血有病愈而血仍不止者用煅人中白一錢冰片五釐研細末摻之即止第十節舌斷祕録云偶含刀在口割斷舌頭已垂落而未斷者用雞子白外軟皮袋住舌頭以破棺丹花粉三錢赤芍二錢薑黃粉白芷各一兩為末以蜜調塗舌根斷血卻以蜜調黃蠟稀稠得所敷在雞子皮上常勤添敷三日舌接住方去雞子皮只用蜜蠟勤敷七日全安愈後舌硬以白雞冠血點之即軟醫林若舌斷重生用活蟹一隻炙乾為末每用二錢同乳香沒藥各二錢五分敷之即生肉若穿斷舌心血出不止以鵝翎蘸米醋頻刷斷處其血即止仍用蒲黃杏仁硼砂少許為末蜜調成膏含化而安入門若舌頭被人咬去即用黑鉛水銀炒成沙子寒水石輕粉硼砂為細末先以乳香沒藥煎水噙口中止痛抹上藥即長全有效回春乙舌之功用病第一節舌強舌強者舌質堅硬不能運動語言不清之謂也則第九對腦筋功用有缺缺之因當察其所因之故方有治法內經謂舌強不能言者足少陰之病也如卒中風則舌強不能言神不清大概用小續命湯寒用理中湯熱用甘桔湯加防風枳殼黃芩如風寒濕痰舌強不能語者用礬石散枯硯桂心等分為末每一錢按舌下或正舌藥痰熱舌強臃腫或短外治亦用礬石散或牙皂末按舌下內服甘露飲加化痰藥或牛黃散方見醫書匯參或用蛇蛻燒全蠍焙等分為末敷之風懿舌強不能言奄忽不知人喉中噫噫然有聲發其汗身轉軟者生汗不出身直者七日死若咽嗌不能言邪結於舌根者死不治舌卷不能言者亦死小兒撮口臍鳳舌亦強直者死證也若舌硬外生膜衣用犀黃硃砂各一分元精石二錢共為末將舌尖刺出紫血用此藥摻之第二節舌喑舌喑者中風而舌不轉運舌強不能言者是也馮楚瞻曰足四經之脈皆止於舌邪中其經則痰涎閉其脈道舌不能轉運而為之喑矣有喉喑者勞嗽失音即喉嚨聲啞是也故喉喑者喉中之聲嘶而舌本能言舌喑者舌本不能言而喉中之聲音如故中風而舌喑者舌與喉俱病而音不能發於會厭也有因外感實火上炎則暴喑有因內傷心肺腎以致壅塞上竅而為喑有因氣血兩虛不能上榮則舌機不動亦為喑有因腎虛而氣不歸原不能上接清陽之氣而為喑然中風不語之症有六有失音不語者有神昏不語者有口禁不語者有舌強不語者有舌縱語塞不語者有舌麻語蹇不語者可不詳辨歟第三節舌痹舌痹者強而麻也乃心緒煩擾優思暴怒氣凝痰火而成用荊芥雄黃各等分木通煎湯調下有痰壅舌麻痹者宜生礬研末摻之或牙皂末摻之若舌蹇語聲遲重者脾竅在舌濕邪阻竅也亦有舌無故常自痹者由心血不足不可作風熱治宜理中湯加附子當歸或歸脾湯加炮姜服之第四節舌麻舌麻者血虛也麻木而伸不出者內風挾痰也若舌麻木連口延及嘴角頭面證見嘔吐痰涎者痰多氣滯也有因風依於木木鬱則化風肝風震動而舌麻也也有因五志過極陽亢陰衰風從火出而舌麻也皆宜柔潤養血熄風挾痰者兼豁痰宣痰第五節舌縱涎下者多唾也經云飲食者皆入於胃胃中有熱則蟲動蟲動則胃緩胃緩則廉泉開廉泉開故涎下補足少陰若口角流涎不止口眼歪斜手足痿軟宜神龜滋陰丸龜板四兩川柏炒知母炒枸杞子各二兩五味子鎖陽各一兩乾薑五錢共為末豬脊髓為丸每服三錢服至中病則止有風痰者宜清心導痰丸白附子天花粉各一兩制南星製半夏各二兩炒川連黃鬱金各七錢五分殭蠶羌活天麻各五錢制川烏二錢共為末薑汁糊為丸若舌縱語塞不語者用薄荷油一滴和白蜜薑汁搽之若流涎不止喜笑舌暗脈洪大用芩連柏梔蒼朮半夏竹瀝薑汁服五日涎止笑息凡流涎者息然流出也氣虛則舌縱而麻第六節舌齧經云此厥氣逆上脈氣皆至也少陰氣至則齧舌少陽氣至則齧頰陽明氣至則齧唇視主病者則補之宜東垣復氣湯柴胡歸身各六分羌活藁本甘草各八分半夏升麻各七分白葵花五朵去心人參防風陳皮李仁桃仁各五分蔓荊子三分後下黃耆草蔻各一錢再下川柏川連枳殼生地川芎北細辛各三分主之此方專治咬頰咬唇咬舌及舌根強硬如神若舌黑而頻齧者心燜至根而死也舌色灰黑時時自欲齧舌者少陰氣逆之死證也第七節舌吐舌吐長不能收者名曰陽強舌短縮不能言者名曰陰強陽強之證如仲景言傷寒熱病後犯房事得病為陰陽易舌出數寸而死如醫說言傷寒熱病愈後不能調攝舌出寸余纍日不收必以梅冰為末摻舌上應手而縮須用多方效吳昆云舌出者熱實於內而欲吐舌泄氣也不能入者邪氣久居舌強而不柔和也以冰片辛熱而氣清香可以利竅可以柔筋可以泄氣故得之而舌即入矣若熱病舌腫舒出口外以萆麻子油蘸紙作燃燒煙燻之吳昆云此心脾熱勝則腫也本草云萆麻主浮腫惡氣取油熏之塗之葉主風腫不仁搗蒸敷之則其能解風腫內熱也明矣然用煙亦有妙義煙乃輕清之物一入於口呼吸傳變可使徑達心脾非惟治標亦可治本醫通云舌暴腫出口用巴豆霜一分以紙捻卷之納入鼻中舌亦即收此亦取其辛烈開竅散火引毒流散之意與小兒口疳貼囟同法李梴云一婦因産子受驚舌出不收醫以硃砂敷其舌今仍作産子狀以兩女扶掖之乃於壁外擲瓦盆於地作聲聲聞而舌即收矣經云舌者心之苗國産心驚夢溪醫案云吐舌不收仍驚之則自收矣一人中蜈蚣毒亦舌出口外寸余他醫以前各法治皆不效李梴命取雞冠血塗之使人持銅鏡立其後擲鏡於地聲大出騰病者愕顧而舌收矣張杲醫說云人有中仙茅毒舌脹出口外漸大與唇齊因以小刀之隨破隨合至百數始有血一滴出曰可救矣隨煮大黃朴硝各五錢與服外以藥摻之應時消縮此火盛性淫之人過服仙茅之害也第八節舌短舌短者有生就與因病之別種類甚多已詳辨於第十章第五節舒縮條下此不重辨特列之以備一格耳第二十一章辨舌病之治療法舌病治法內服外塗皆已詳於前茲摘録經驗單方及針灸療法導引法條列於後以俾參考合用第一節舌病簡效方舌上生芒刺燥澀或如楊梅刺者皆熱結甚也宜用生薑切厚片蘸蜜於舌上揩之陶華云傷寒舌上生苔不拘滑白黃黑用井華水浸青布片洗淨後用生薑切作片時時浸水刮之輕者其苔自退重者難退必須大下之後津液還而苔自退矣舌生瘡或白苔乾澀如雪語言不清薄荷自然汁和白蜜等分調勻傅之良又方如生薑蜜水揩洗後用硃砂雄黃硼砂腦麝各少許為末傅亦良三因方得效方內有結熱而舌生紅粟點宜竹瀝調寒水石末摻之尊生舌生芒刺結熱甚也若舌生紅粟以紫雪和竹瀝塗之入門若勞心人舌生瘡菌宜琥珀犀角塗之入門脾熱則舌苔乾澀如雪宜冰梅丸口舌生瘡如粟宜冰柏丸黃柏薄荷硼砂等分冰片減半為末蜜丸如彈子大含化心熱則舌裂而瘡無論重木舌宜三黃丸末水調貼腳心又用白礬大黃朴硝擦漱又醋調五靈脂末烏賊骨蒲黃塗之服清肝經實熱之藥舌瘡由虛陽上浮者吳萸醋炒乾薑炮各五錢木鱉五枚去殼研末每用五分水調納臍中外紙貼蓋醫彀舌腫塞滿口不能飲食用真蒲黃一味頻刷舌上甚則加乾薑末從治之若能服藥即以一味川連煎濃汁呷之以瀉心火醫通方舌腫滿不得息因七情所郁宜烏梅薑末貼兩足心舌腫脹出口硼砂為末生薑片蘸藥揩腫處即退綱目重舌腫脹因怒氣而得者取鐵鏽鎖燒紅打下鏽研末水調一錢噙咽木舌腫脹因痰氣壅閉者用生川烏尖巴豆研細醋塗調刷涎出即愈木舌腫滿不治殺人蚯蚓一條以鹽化水塗之良久漸消聖惠方懸雍舌腫咽生息肉羊蹄草煮汁熱含冷吐之同上小兒重舌用三稜針於舌下紫筋刺出血即愈又用竹瀝調蒲黃末敷舌立效幼幼新編舌上生瘡用羊脛骨中髓和胡粉塗之妙聖惠方口舌生瘡爛久不瘥用薔薇根濃煎汁稍稍含漱溫含冷吐即效冬聚夏取莖葉用本草重腫出血如泉海螵蛸蒲黃各等分研末井華水調敷舌硬出血不止取刺薊汁和酒服乾者為末冷水服普濟舌硬出血取木賊草煎湯漱之愈聖惠方舌縮口噤以生艾搗敷之干艾浸濕亦可聖濟總録飛絲入口至舌間生疱取蘇葉嚼白湯送下立效丹溪第二節舌病針灸法東垣云廉泉一穴一名舌本在頷下結喉上治舌下腫難言舌縱涎出口噤舌根急縮下食難刺瘧論云舌下兩脈者廉泉也刺禁論云刺舌下脈太過血不止為喑刺節真邪論云取廉泉穴血變而止已明宜出血禁用針或問取廉泉二說不同一說取頷下結喉上一說舌下兩脈何者為當答曰舌本者乃舌根蒂也若取舌下兩脈是舌梢也舌標也此法誤也當取頷下者為當此舌根也況足陽明之脈根於厲兌結於廉泉頷下乃足陽明之所行也若取舌下兩脈非足陽明經也戊與癸合廉泉足少陰也治涎下解云胃中熱上溢廉泉開故涎下當出血瀉胃中熱又知非舌下兩脈也頷下結喉上者為準矣脹論云廉泉玉英者津液之道路也按針經云少陽結於廉泉今曰陽明者誤也景嶽云廉泉治舌下腫口瘡舌縱舌根急縮金津玉液兩穴刺出血舌下腫難言舌縱喎戾不端通谷主之甲乙經千金主廉泉然谷舌下腫難言舌縱涎出主陰谷舌下腫難言口瘡舌縱涎出及舌根急縮廉泉針三分得氣即瀉灸三壯舌腫脹甚先刺舌尖或舌上或舌旁出血惟舌下廉泉穴禁針萬病回春舌卒腫滿口溢出如吹豬肚胞氣息不得通須臾不治殺人急以指刮破舌兩邊去汁即愈或以鉸刀決兩邊破之再以瘡膏敷之又方刺舌下兩邊大脈出血勿使刺著舌下中央脈血出不止如上治不愈或血出數升則燒鐵篦令赤尉瘡數過以絶血也得效方云舌腫如豬胞以針刺舌下兩旁大脈血出即消切勿刺中央脈血出不止則死急以銅箸火燒烙之或醋調百草霜塗之須臾自消凡舌腫舌下必有禁蟲狀如螻蛄臥蠶有頭有尾少白可燒鐵烙烙頭上即消厥口僻失缺下牙痛頰腫惡寒口不收舌不能言不得嚼大迎主之舌急則啞門舌緩則風府舌緩涎下頰悶取足少陰舌緩喑不能言舌急語難主風府舌上黃身熱主魚際舌本痛主中衝挾舌縫脈青主天突舌乾脅痛主尺澤重舌刺舌柱以䤵針舌本出血取扶突大鐘竅陰舌卷口乾心煩悶主關衝舌卷不能言主復溜舌卷獨取手少陽絡經筋云邪客手少陰之絡令人喉痹舌卷口乾心煩臂外廉痛手不及頭刺手中指次指爪甲上去端如韭葉各一痏又云手陽明之筋其病支痛轉筋舌卷治在燔針劫刺以知為度以痛為輸是也凡治重舌木舌紫舌舌脹等疾腫脹疼痛硬強不語又兼舌根並兩齒合徑盡處作腫瘀肉塗塞口噤難開俱用此法刺之用粗綿針扎在箸頭上在患處點刺出血紅紫毒輕紫黑毒重患甚者數十點皆可血盡溫湯漱之甚者金鎖匙輕者冰硼散搽患處流去熱涎內服涼膈散醫學綱目第三節舌病導引法重舌擦法重舌急證用指去爪先於舌下筋上擦至根漸深深探入如此三次又用指蘸水取項後燕窠上小坑中筋自上赴下至小屈深深擦入亦三次小兒若飲乳騰前則病去矣得效方舌下重舌先用患處推散腎水升至舌下洗之推開肺經呵而吸之保生祕要
