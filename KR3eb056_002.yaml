body:
  text: 卷二第二編觀舌總綱第九章觀舌之心法臨證觀舌最為可憑然亦未可執一正義云凡見黑舌問其曾否食酸甜咸物因是物能染成黑色非因病而生也然染成之黑必潤而不燥刮之即退虛寒舌潤能染若實熱舌苔乾燥何能染及耶凡臨證欲視病人舌苔燥潤禁飲湯水飲後則難辨矣王秉衡曰淡白舌苔亦有熱病黃厚滿舌亦有寒證舌絳無津亦有痰證當以脈證便溺參勘又白苔食橄欖即黑酸物亦然食枇杷即黃又如燈下看黃苔每成白色然則舌雖可憑而亦未盡可憑非細心審察亦難免於誤治矣其他觀法再舉於後一舌色凡病人欲察舌之時宜先診而後食則苔之厚薄易分診而後飲則苔之滑澀易辨至於乾黑之舌又當以蜜拭其苔垢然後視其形色紅赤者可治青黑者不可治亦望舌之所宜知也二舌質凡舌質亦有色如絳紅紫青藍即其色也血熱之證舌質底色紫又有大小如濕熱有痰之證舌質脹大滿口邊有齒印三舌尖凡舌尖屬心如滿舌白苔舌尖有紅刺此心火旺盛勿用溫燥之藥四舌心凡舌四邊有苔中心則無或中有直裂或有直槽或有橫裂皆心胃陰液不足亦忌溫燥五舌邊苔色與邊齊否舌邊缺曲如鋸齒者不治也舌邊紅者脾熱也舌邊青色一條者木剋土也胡玉海云舌邊肝膽部位有一點紫疱如黃豆大此熱毒歸臟在左者重在右者輕在中間更輕其症舌紅面赤而兩手見陰脈或脈來擺搖無根恍惚難憑者為不治也六舌根凡根後有無苔色接續有無大肉瘤亦須注意七燥潤若以手摸之或滑潤或燥刺棘手有看之似潤而摸之燥者有看之似燥而摸之滑者八變換劉吉人云觀其變換與不變換總之苔黃為正白次之無論何證若用藥當皆由白而黃由黃而退由退復生新薄白苔此為順象若用藥不當則由黃而白由白而灰由灰而黑由活苔變為死苔此逆象也驟退驟無不由漸退此陷象也更有氣聚苔聚氣斂苔斂氣化苔化氣散苔散氣散布苔亦散布氣凝聚而結苔亦凝聚而結氣結於一邊苔亦結於一邊故氣鬱之證苔邊整齊如石階之起邊線線內有苔線外無苔但紅邊而已若氣化則布散由密而疏散則不似斬然齊一之邊矣故苔有邊齊如斬者皆氣聚也有積滯抑鬱者也第十章辨舌之形容心者生之本其經通於舌其竅開於舌故舌為心之外候也察舌質形容可定內臟之虛實觀舌苔垢色可以辨外邪之寒熱所謂形容者如舌之軟硬舌之脹癟舌之戰痿舌之歪邪舌之伸縮舌之吐弄是也皆能辨臟腑經絡之寒熱虛實病之可治與不可治於此已可判矣故先録此例如下第一節軟硬軟者痿柔也氣液自滋硬者強硬也脈絡失養有胃氣則舌柔和無胃氣則舌板硬舌軟者軟而不能動也舌紅痿軟難言者心脾虛也心清語塞舌軟無力難言者營衛不足也軟而淡紅者宜補氣血深紅者宜涼氣血赤紅者宜清涼臟腑紫紅者宜寒涼攻瀉鮮紅的紅者宜滋陰降火絳紅而光痿軟者陰虧已極不治之證也舌痿軟黃燥腹滿不得睡將發黃也聲亂音嘶舌痿聲不得前者因誤發其汗也舌痿人中滿唇反者脾經氣絶也在病後乏力之時舌亦痿軟不能言養胃益陰則自復也舌強硬者如木舌重舌腫舌大舌之類皆臟腑俱熱而心經尤為熱極也舌忽腫而不硬者木舌也舌腫滿口溢出如豬胞氣息不得通硬如木石者血壅氣滯也舌木硬者厥陰病也舌紅而強硬失音者死候也凡紅舌強硬為臟腑實熱已極不如燥火內伏誤服溫藥則舌根亦強硬不能言語或時疫直入三陰皆里證實熱宜苦寒救補湯即服舌邊四圍紅色中間至根有乾硬黑色如有長小舌其上有刺者熱毒堅結大腸也宜白虎合承氣湯下之有痰者舌灰胖而硬宜豁痰亦有白苔乾硬如砂皮者俗名水晶苔此邪熱在表時津液已乾燥後雖入胃不能變黃宜增液承氣下之下後白苔潤澤者生凡疫證苔如積粉此火極水化若誤認為寒妄投溫燥其苔愈厚津液愈耗水不上升二火煎熬變白為黑其堅硬似針其厚似甲敲之戛戛有聲言語不清非舌卷也專用甘寒以充津如五汁飲增液湯之類大抵溫暑熱證舌硬不語下證為多雜證舌強硬胃氣將絶也如中風入臟則舌難言傷寒舌短亦為死證皆板硬無胃氣也凡板硬之舌不論何色不治者多有苔硬如石如繭裂為龜紋刮之不去在舌心者可治滿舌如是者不治第二節脹癟脹者浮而腫大也或水浸或痰溢或濕熱上蘊癟者薄而瘦小也或心虛或血微或內熱消肉舌腫脹者病在血舌赤脹大滿口者心胃之熱也舌赤腫滿不得息者心經熱甚而血壅也舌腫大者或因熱毒或因藥毒也唇舌紫黯青腫者中毒也舌紫腫厚者酒毒上壅心火炎上也或飲冷酒壅遏其熱也舌紫短團圞者食滯中宮而又熱傳厥陰也宜即下之如神志清爽舌脹大不能出口者此屬脾濕胃熱鬱極化風化痰毒延口也邪在脾胃唇口亦腫也如脹大不能出口神不清者病在心脾兩臟也用大黃磨汁和入煎劑內更須添辨苔色如舌色白滑黑滑者多由水氣浸淫者宜通陽利水黃膩滿布者由濕熱鬱而化毒宜清濕火化毒白膩黃膩者痰濁相搏上溢為脹也宜蠲痰化濁舌黃脹大滿口者乃胃府濕熱蘊結不消也舌紅脹大滿口者乃心胃俱有熱毒也紅舌脹出口外不餂者熱毒乘心也外用銀針砭去惡血以梅冰人中黃末摻之舌形圓大胖軟者足少陰虛證也生有紅點者熱毒乘心也若舌腫耳干下血不止腳浮者六日死足腫者九日死腎絶也又耳干舌腫光絳溺血大便赤泄足腫者肉絶九日死胃絶五日死也嘉約翰云舌之腫大或有出於心火發炎或因於疔毒者或因於過服汞藥而致者間有舌微腫一伸出即現齒印者舌癟者薄瘦也舌肉屬心脾心脾虛則舌瘦癟也亦須辨其苔色若淡紅嫩紅者心血不足也紫絳灼紅者內熱動風也舌乾絳甚則紫暗如豬肝色者皆心肝血枯也舌紫枯癟形如豬肝色絶無津液乃不治證也舌質不赤中黃無苔枯瘦者乃過汗津枯血燥死證也舌紅乾癟不能言者亦死證也舌紅乾癟能言者因證治之或可救也第三節戰痿舌為心苗其伸縮展轉則筋之所為肝之用也舌戰者舌顫掉不安也舌紅而戰動難言者心脾虛也汗多亡陽者有之舌挺出振戰者多見於酒客濕熱病神經衰弱者大抵舌戰由於氣虛者蠕蠕微動由於肝風者習習煽動更宜添之舌色如舌色淡紅而戰者氣血俱虛也嫩紅而戰者血虛液虧也鮮紅而戰者血液虧肝風內動也紫紅而戰者肝臟熱毒動風也舌薑者舌軟而不能動也為舌神經麻痹所致亦有暴久之分如暴痿多由於熱灼故常現於紅干之舌如深紅者宜清涼氣血紫紅者宜泄肝熱通腑氣鮮紅宜滋陰降火色淡紅者宜補氣血若病久舌色絳而痿軟者陰虧已極津氣不能分布於舌本為不治葉天士云若舌絳而不鮮乾枯而痿者腎陰涸也宜阿膠雞子黃地黃天冬等治之吳坤安云舌形斂束伸不過齒紫絳痿軟為肝腎陰液枯涸而敗若其舌色紅澤而光或其色鮮紅者屬胃陰乾涸猶可滋養胃陰章虛谷云舌本或短或痿而赤色苔厚者為邪閉色淡白如煮熟豬肝而痿者不論有苔無苔皆為正敗死不可治第四節歪斜歪者斜偏於一邊也痙痱與偏枯常見當再辨其色若色紫紅勢急者由肝風發痙宜熄風鎮痙色淡紅勢緩者由中風偏枯若舌偏歪語塞口眼喎斜半身不遂者偏風也舌偏向左者左癱舌偏向右者右瘓宜補氣舒筋通絡化痰嘉約翰云舌伸出有偏於一邊者乃第九對腦筋壞也偏右者則壞右之半面偏左者則壞左之半面而將發半身不遂之病也第六節吐弄脾主舌本脾熱則吐舌弄舌舌伸長而收緩者為吐舌乃心脾積熱水不上濟舌微出口外而即收者為弄舌屬心脾虧損兼有微熱若心火亢盛腎陰不能上制所以舌往外舒肝火助焰風主動搖胃熱相煽舌難存放故舌如蛇舔左右上下伸縮動搖謂之弄舌小兒總微論云弄舌者其證有二一者心熱心系舌本熱則舌本乾澀而緊故時時吐弄舒緩之二者脾熱脾絡連舌亦乾澀而緊時時吐弄舒緩之皆欲飲水因心熱發渴脾熱則津液耗二證雖引飲相似惟心熱面赤睡即口中氣熱時時煩躁喜冷咬牙治宜清心經之熱脾熱者身面微黃大便稠硬赤黃色治宜微導之不可用涼藥又不可用下法若誤下之則脾胃虛津液耗又加五心煩熱面黃肌瘦變為疳也馮楚瞻曰凡舌出長而收緩者名曰舒舌微露即收舌乾腫澀者名曰弄舌又曰弄舌者是心脾結熱舌絡微緊時時舒舌宜瀉黃散徐徐服之若大病後弄舌者大凶舌如蛇舔伸縮動搖唇焦舌乾煩躁便穢名曰弄舌心脾熱也慎齋用黃連湯緩緩與服凡弄舌搖頭者癰病也病人喜揚目吐舌者羊癰也第十一章辨舌之質本質者舌肉也本者舌本也經云唇舌者肌肉之本也平人察舌本即知其脾之氣血故無苔則審舌之本色有苔則憑舌之苔也皆無苔之謂也如舌質生點刺舌生瓣暈舌生星斑舌生裂紋及舌中凹如剝去及舌生凹塊舌苔之直橫皆燥熱傷陰盲腸有燥矢久留不去其證多陰茲將各狀匯辨如下第一節點刺苔點凹而起瘰者梟毒內伏也凹而缺陷者臟形委頓也苔點如粞者內有蟲蝕也若苔現檳榔紋隱隱有點者亦屬蟲蝕也皆宜祛積殺蟲亦有紅舌中更有紅點如蟲碎之狀者熱毒熾甚也宜苦寒清泄之若舌絳碎而有黃腐點者此溫熱邪火蘊久不宣蒸腐氣血化為淤濁葉氏云舌絳而有碎點白黃者當生疳也黃連金汁皆可用即此證也滿舌紅點墳起者心火燔灼也宜即清之若舌紫腫而起大紅點者乃熱毒乘心以導赤加犀連金汁舌紅而有大紅點者營熱甚也苔白而帶黑點者亦胃熱也舌苔青藍雜色如斑如點者此疫癘穢邪也舌本不紅苔滑者為虛寒舌本赤而乾燥者為實熱面赤舌紅舌邊有一點紫疱如黃豆大或舌邊缺曲如鋸齒者在左屬肝膽者重在右者輕在中間者更輕舌赤起紫疱者心經熱極也又有舌根白苔板厚如水泡形而兩邊現紅肉兩點者是下焦寒水甚結真陽不宣也如舌黑而灰或黃而發泡生蟲蝕腐爛雖為濕熱亦屬肝傷俱為危候舌常有刺也無刺者氣衰也刺大刺多者邪氣實刺微刺少者正氣虛葉天士云舌上生芒刺者皆上焦熱極也當用青布拭冷薄荷水揩之即去者輕旋即生者險矣章虛谷云凡舌生芒刺者苔必焦黃或黑無苔者舌必深絳其苔白或淡黃者胃無大熱必無芒刺或舌尖或舌邊有赤小瘰是營熱鬱結當開泄氣分以通營清熱也如白滑灰刺如濕潤刮之即淨為真寒假熱乾厚刮不淨是脾胃濕熱困心肺里證熱極也白苔黑刺滿舌者如刮之黑刺即淨光潤不幹渴不多飲在雜病為真寒假熱若刮之不淨乾燥粗澀乃表經皆熱極傳人陽明里證始有此舌又有白苔滿布中有硃砂點子者是暑疫失解抑鬱心陽宜涼透開泄之如厚黃苔燥刺或邊黃中心焦黑起刺臍腹脹滿硬痛乃陽明裡證也若純紅鮮紅起刺此膽火熾營分熱即用犀角知丹等清解之如舌尖獨赤起刺心火上炎之故犀角合導赤散以涼散之若舌紅極而有黃黑芒刺者熱毒入府也調胃承氣湯下之若舌起紅紫刺心經極熱而又受疫邪熏蒸而發也若舌尖灰黑乾燥起刺是得病後如常飲食乃熱極津枯宿食不消也宜調胃承氣湯下之若黑而燥刺是熱邪已入太陰宜清火解毒津液枯涸宜甘露飲黃而生芒刺黑點者為熱勢極黃而瓣裂者為胃液干下證尤急也舌中紅赤點目黃頭汗小便不利者將發黃也第二節瓣暈苔起瓣暈由臟腑實火熏蒸見於溫濕瘟疫等病為多瓣則黑色為多暈則灰黑為多瓣則一二瓣尚輕三四瓣已重六七瓣極重而難治石室祕録云凡舌見黃苔而隔一瓣一瓣者乃邪濕已入大腸即用大黃茵陳下之若舌黃而澀中有花瓣形者熱入胃府邪毒甚也石頑云極黃而瓣裂者為胃液乾涸宜增液湯即下之亦有黑苔生芒刺及燥裂紋隔瓣者先用青布蘸薄荷湯拭潤以生薑切平擦之撅去隔瓣看下瓣底舌質紅者可治宜即下之若舌質俱黑為不治矣舌黑腐爛者心腎俱絶更不治暈則一暈尚輕二暈則重三暈必死亦有橫紋二三層者與此相同宜急瀉火解毒急下存陰服至灰暈紋退淨則氣津血液漸復可愈凡灰色苔起深黑重暈者溫熱疫毒傳遍三陰也熱毒傳內一次舌增灰暈一層最危之證急用涼膈散大承氣湯等下之凡舌有純灰色中間獨兩暈黑者亦瘟疫熱毒將入腎也亦有舌根淡紅中有紅暈一圈而弦又純黑者乃心包絡蘊熱後受邪火二火相逼故現此舌宜即下之亦有舌邊黑暈二重而中心紅者乃陽明熱毒傳厥陰心包亦當急下若舌苔上見圓暈分二三色者乃燥熱內結燥糞不下之候其證必險第三節星斑星者較點大也亦屬臟腑血分熱也凡純紅舌而有深紅星乃臟腑血分皆熱也燥火疫毒及實熱證誤用溫燥藥皆有之吳坤安云舌現紅星此因熱毒乘心外證必神昏譫語宜用苦寒急瀉其陰狂亂者非川連金汁不解石頑云紅舌中起紅星心包火炎也消膈散主之若舌淡紅尖起紫色蓓蕾星點乃熱毒中心血也時疫酒濕梅毒等證皆有之宜犀角大青銀翹金汁等解之舌紅而起白星點者乃心火有邪也若紅舌上起白星點如珍珠者乃火極水化之象較之紫赤黃苔上芒刺者更重瘟疫多見此舌即宜解毒清泄亦有冬月傷寒自苔嘔惡誤用白虎以致脈伏舌苔成圓圈如白豹紋者用正氣散加薑桂數服愈若舌紅而有黑星點者乃胃熱已極將發斑疹之證大抵舌上星點鼓起者皆心火胃熱也在兩旁主肝膽熱在尖主心熱淡而陷下者胃虛也在小兒為有滯有蟲正義云凡紅舌中見紫斑者將發斑也宜元參升麻湯斑己見宜化斑湯舌淡紅中見紅赤斑點將發黃也章虛谷云舌紅極有紫斑及紅斑如遍身發斑者陽毒入心宜人參白虎湯加犀連若舌渾紫滿舌有紅斑為酒毒內蘊濕中生熱宜化斑湯消斑青黛飲石頑云舌紫中有紅斑或紫而干黃紫而短縮俱宜涼膈散下之何報之云若酒毒內蘊舌必深紫而赤或乾涸若淡紫而帶青滑則為寒證矣須辨若白苔黑斑舌如刮之即淨者為濕熱微也刮不淨者為臟腑皆實熱陰液欲竭也即以苦寒合甘寒救陰舌見紫斑身疼惡寒發熱腮赤者將發斑也第四節裂紋平人之舌無紋也有紋者血衰也紋少紋淺者衰之微紋多紋深者衰之甚舌生橫裂者素體陰虧也舌生裂紋如冰片紋者老年陰虛常見之象也淡白舌有發紋濤布者乃脾虛濕侵也舌紅露黑紋數條而苔滑者水乘火位寒證也舌淡紅中見紫黑筋數條肝經寒證也全舌絳色無苔或有橫直罅紋而短小者陰虛液涸也舌現藍紋者在傷寒為胃氣衰微在雜病為寒物積滯中宮碎裂者血痕傷迹也舌衄與抓傷當辨凡有傷痕血迹者必問曾經抓挖否不可見有血而便認為枯證也如裂紋出血者血液灼枯也此因內熱失治邪火熾甚者有之宜急下存陰如舌尖出血乃手少陰心經邪熱壅盛所致宜三黃瀉心加犀角治之凡舌見裂紋斷紋如人字川字爻字及裂如直槽之類雖多屬胃燥液涸而實熱內逼者亦有之急宜涼瀉清火中有裂紋者多屬胃氣中虛忌用寒涼宜補陰益氣間有本無裂紋經下後反見人字紋者此為腎氣凌心宜納氣益腎若舌根高起纍纍如豆中露人字紋深廣者胃有積也若舌紅而開裂紋如人字者乃邪初入心宜石膏黃連以解之陳杏軒治一農人傷寒數日寒熱交作自汗如雨脈虛神倦舌白滑分開兩岐宛如刀劃考已任篇有陰證誤服涼藥舌見人字紋之語先與六味回陽飲繼進左右二歸飲數劑舌苔漸退而愈陰證誤用涼藥舌赤亦現人字紋如杏軒醫案是也舌紅潤而有黑紋為厥陰之寒候若舌純紅乾燥中露黑紋兩三條為火極似水一帶純黑者俱不可治舌黃如有虎斑紋者為氣血兩燔之候急宜清泄之舌紅赤苔膩厚而裂紋者臟腑實熱也即宜苦寒泄熱如無苔無點而裂紋者陰虛火炎也宜苦寒兼育陰舌紅極而裂紋燥熱入肝也宜清涼兼下凡舌絳光燥裂紋為陰液大傷但裂不光為胃陰不足痰熱凝結若舌色絳紅邊尖破碎舌有血痕而痛者此陰液大虧心火上熾也宜費氏大澤湯西洋參生地天冬麥冬龜板丹皮柏子仁茯神蛤粉石膏燈心竹葉藕汁主之舌大赤裂大渴引飲者上消之證也第五節凸凹凡舌起瘰而凸者多見溫毒時疫證多腸胃梟毒內伏急宜涼瀉速攻其毒若凹陷而有缺點者有虛有實實者舌間先起糜點糜脫去則現凹點虛者由胃陰中竭氣盛則凸氣陷則凹余如黴點性潰潰則舌上乳頭縮小成凹亦有舌生瘡久蝕成穴屢服涼劑不效用黑錫丹以鎮浮陽而得瘥舌生瘡者上焦熱也舌生瘡裂破引唇揭赤者心臟熱也舌黑中爛凹陷者不治舌中剝蝕邊有膩苔者濕痰停積也更有紅點坑爛凸似蟲蝕草者乃水不濟火熱毒熾甚也第六節直橫合病舌則直分二三路者以表裡分中間為里兩邊為表左主肝膽右主脾胃並病舌則橫分兩三截者以三焦分尖為上焦中為中焦根為下焦再辨其顏色可以決其寒熱虛實也如傷寒邪入胃經則白苔中黃邪中少陰則自中變黑若滿舌一色為一經症邊與中間兩色俱傳經證若從根至尖直分兩路者是合病與夾陰寒證舌也合病則白中兼兩路黃夾陰則白中兼兩路黑潤及灰色也若從根至尖橫分兩三截者是並病舌也合病者一邪而傷兩經也或雖由此經傳彼經而仍是寒邪謂兩經合病於一邪也並病者此經寒邪蘊為彼經熱病或一經而有寒熱之二病謂兩邪合併於一身也故尖白根黃尖白根黑為並病以上下焦分若半邊苔灰滑者為半表半裡證白苔多而滑者黃黑苔少者表證多也尚宜和解若黃黑苔多而白苔少或生芒刺黑點乾燥者里證多也必下無疑雖中心黃黑而潤邊仍白者此表證未盡風寒尚未全化熱也傷寒則大柴胡湯而解之溫熱時疫則涼膈散或白虎合承氣攻下之張石頑曰中間一路舌質潤苔黑燥兩邊或黃或白者此因素有蓄血正氣內虛邪氣外實邊黃則調胃承氣邊白則大柴胡湯若中間一路黑滑薄苔兩邊白滑此表裡俱虛胃中雖有留結急宜附子湯溫之凡黑苔為凶因心氣為瘀血所阻故見此舌邪氣內潰更神速矣第十二章辨舌之神氣通俗傷寒論曰舌色如朱柿或如錦面或如去膜腰子或斂束如栗子肉或乾枯細長而有直紋透舌尖者病皆不治更有舌質已枯生氣將絶而舌質上面反罩一層苔色潔白似雪花片呆白似豆腐渣或如嚼碎飯子㿠白兼青枯白而起糜點視其舌邊舌底必皆於晦枯痿一無神氣乃舌質之壞臟氣絶也病必不治張景嶽云黑舌連地灰黯無神此其本原已絶死無疑矣若舌心焦黑質地紅活未必皆為死證陽實者清其胃火火退自愈亦有元氣大損而陰邪獨見者其舌色黃黑真火涸竭者其舌亦乾焦此腎中水火俱虧原非實熱之證但察其神氣脈色自有虛實可憑而從補從清反如冰炭矣故凡焦黑乾澀者尚有非實火之證再若青黑少神而潤滑不燥者則無非水乘火位虛寒證也若誤認為火苦寒一投則餘燼隨滅矣凡見此者但詳求脈證神氣以定寒熱虛實亦不可以其焦黑斷熱言清火也茲將舌之神氣分淡濃深淺榮枯老嫩為四節臚舉如下第一節淡濃舌色本紅淡紅者血虛也淡紅無苔反微似黃白苔者氣燥不化液也淡紅兼青者血分虛寒也婦人子宮冷者舌色亦多青胎初死腹中舌亦見淡青若平素有痰必有舌苔其心虛血少者舌色多淡紅或淡暗無神邪陷多危若舌質淡紅無苔者熱初入陰分也紅而濃者氣不化津也舌質淡紅無苔中有直溝如刀背印成者陰津元氣皆虛也舌淡白者氣分寒有水白而有發紋者多濕淡白而青者寒深淡黑者氣血虛寒紅之依者絳也舌尖絳者心火上炎也舌根絳者血熱內爍也通絳無苔反似有苔黏膩者血熱又挾穢濁也若絳而無苔亦屬陰虛更有病後絳舌如鏡發亮而光或舌底嗌乾而不飲冷此腎水虧極也唐烈三云大紅舌色無苔者是心火之色浮越於外盛極將衰欲化灰也若舌色純紅必腎氣素虛之人無他症而忽現此舌者宜用附子引火歸原又有瘟疫將發之時舌現純紅乃熱蓄於內而病將發也不問何經用透頂清神散治之若絳而深紫而干晦者肝腎內竭也紫而濃者熱傷陰液也紫潤而暗者中脘瘀也紫而專黑者絡瘀化毒血液枯涸也舌本無苔隱隱若摻煙煤者若兼之煩渴乃平素胃燥舌也吸煙體多有之不渴而肢冷也為陰證舌光黑苔者腎水凌心也第二節深淺諸色深者邪實諸色淺者正虛赤為熱赤之深者實熱赤之淺者虛熱青為寒青之深者實寒青之淺者虛寒舌明潤而或赤或青則生枯暗之淺者雖病輕而當死舌赤者心之正色也赤者火之色也乾紅火之煙也赤黑相雜則為紫色水剋火也火少甚則舌尖起刺火之焰也火亢甚則舌中焦刺深赤者為太過若硃紅喜熱熱飲者為龍雷之火上炎也淺紅者為不及深而紫者血分熱深青者瘀血疼痛深赤而黑者熱極深黃膩厚者大熱也淺黃膩薄者微熱也劉吉人云又有似自非白如畫工以胭脂調粉者為雪青色亦有深淺二種深者如雪青杭紡色此乃暑熱二邪已入血分之候淺者如雪青湖綢色此乃熱邪入營初候此苔類似薄白但舌質紅而細看有乳頭微點者故以雪青色名之為邪熱入血分必由之苔但人多以白苔視之多誤作寒治故特提出如舌質深紅如紅蘿蔔干有鹽霜者此乃熱邪深入久留誤服攻燥之藥胃陰大傷之候第三節榮枯榮者有光彩也凡病皆吉枯者無精神也凡病皆凶榮潤則津足乾枯則津乏榮者謂有神神也者靈動精爽紅活鮮明得之則生失之則死明潤而有血色者生枯暗而無血色者死凡舌質有光有體不論黃自灰黑刮之而裡面紅潤神氣榮華者諸病皆吉若舌質無光無體不拘有苔無苔視之裡面枯晦神氣全無者諸病皆凶凡病初起舌即乾者津竭可知病久而舌猶潤者胃氣尚存望之若干捫之卻潤其色鮮紅者濕熱蒸濁也色紫而暗者瘀血內蓄也望之若潤捫之卻燥其苔白厚者氣濁痰凝也苔白而薄者氣虛傷津也第四節老嫩凡舌質堅斂而蒼老不論苔色白黃灰黑病多屬實舌質浮胖兼嬌嫩不拘苔色灰黑黃白病多屬虛舌圓大碎嫩其質紅潤者皆屬心經虛熱病尚可治舌枯小卷短其質焦紫者皆屬肝腎陰涸病多速死若舌本無苔而舌皮光薄且紅白柔嫩宛如新生望之若有津唾抹之燥涸殆甚者此因妄汗吐下走亡血液所致雖不板硬亦死不治若舌紅色柔嫩望之似潤而實燥乾者數行汗下津液告竭也病多不治如淡紅嫩紅白中帶紅是溫邪之輕證初起微寒繼則發熱不已口渴甚者是也宜柴芩梔翹等清解之舌心絳於而老乃胃熱上爍心營宜清心胃舌尖絳干乃心火上炎宜導赤散以瀉其腑余如黃苔亦有老嫩之不同劉吉人云老黃色為胃陽旺盛之候若厚腐堆起此胃中飲食消化腐濁之氣上達之候為濕溫化熱之始濕熱傳入陽明之候黃如炒枳殼色為胃陽盛極陽亢陰虛之候胃氣欲傷胃汁乾稿故苔色如枳殼炒過狀以其苔色乾枯不潤澤也嫩黃色者由白而變為黃乃胃陽初醒之吉兆也為飲食消化腐濁初生也牙黃色者為胃中腐濁之氣始升也牙黃無孔謂之膩苔中焦有痰也裱心紙色苔雖黃而兼灰青此傷風初候或陽明抑鬱則苔無正色當舒氣化郁黃如粟米顆粒分明此謂胃陽太旺胃熱之候黃如蠟敷濕溫痰滯之候第十三章辨舌之津液夫腎主津液內溉臟腑經系舌本外應病症故察津液之潤燥可知胃氣之盛衰察律液之滑澀可知病氣之寒熱其他如腐膩可辨津液與濕濁糙黏可辨穢濁與痰涎此四者為察津液之要綱茲別列如下第一節潤燥滋潤者其常燥澀者其變潤澤為津液未傷燥澀為津液已耗濕證舌潤熱證舌燥此理之常也舌色紅潤屬表屬陰屬寒屬虛舌燥有苔屬裡屬陽屬熱屬實無論潤燥大抵有苔垢者濕病為多無苔垢者熱病為多然亦有濕邪傳入血分氣不化津而反燥者如熱症傳入血分而舌反潤亦有誤用燥藥津液被劫逼迫而上胃陰不能下濟舌反潤者何報之云凡脾胃有痰飲水血則舌多不露燥象不可誤認為寒也凡舌苔不燥自覺悶極者為脾濕盛也張石頑云脾胃有痰飲水血者舌多不燥不可因其不燥而延緩時日致誤也若陰虛夾食亦黃而不燥總宜即下但下法微有分別耳凡發熱內夾瘀血者舌心多黑潤不可誤作陰證治凡舌絳而潤為虛熱舌絳而燥為實熱舌絳而光亮為陰液不足舌無苔而乾燥者腎臟不足津液虛極也舌中心黑厚而乾燥者謂之焙舌邪傳少陰熱甚津枯也口乾舌燥而渴者少陰病也舌上苔津液乾燥毒邪傳裡也舌白者陽氣虛不能化津上潤也白而乾者津液已枯雖有表邪宜作里治舌黃燥下利不渴胸中實下不止者死證也腹滿口乾舌燥者腸間有水氣也如潤滑薑黃色苔者為太陰寒化也焦燥不渴者陰液枯稿也舌苔黃燥若足冷脈沉非純陽證切忌硝黃無病舌紅而涸偶見紅心點者將欲發黃也凡乾燥之舌皆屬熱毒亢盛胃陰欲竭之勢切忌溫燥淡滲傷陰之品必須以存津液為先若燥而垢者痰毒甚也燥而黃者胃熱極也燥而黑者熱極而陰竭也若全舌黃黑積滯或乾焦罅裂芒刺者實熱也宜清涼之苔黑而燥為痰熱結胸苔黑而潤為虛寒夾濕灰黑苔為濕食停滯若初病發熱胸悶遍舌黑色而潤外無險惡情狀此胸膈素有伏痰也即用薤白桂枝半夏一劑黑苔即退或不用桂枝即枳殼桔梗亦效唐烈三云凡舌黑如淡墨不分燥潤總屬腎水克心火陰盛陽衰之候宜溫補之法若久病舌起煙煤為胃虛液涸亦有舌無苔而有如煙煤隱隱者不渴肢寒如口渴煩熱而燥者平時胃燥也不可攻之若燥者宜甘寒益胃若不渴肢冷而潤者知夾陰病也宜甘溫扶中若黑燥而中心厚苔者為脾燥腎竭急以鹹苦下之若舌黑望之雖燥而生刺但渴不多飲或不渴其邊或有白滑其舌本淡而潤者亦屬真寒假熱治宜溫補其舌心並無黑苔而舌根有黑苔而燥者熱在下焦也宜即下之若舌本無苔惟舌尖黑燥為心火自焚不可救也若全舌燥苔由舌邊漸漸潤至舌心者為病退佳兆大抵辨舌之法不論黃白灰黑先宜區分燥潤及刮拭堅松以定胃腸津液之虛實若無苔而舌色變幻多屬心腎虛證或肝膽風火證甚則臟腑絶證第二節滑澀滑者津足捫之而濕澀者津乏捫之且澀滑為寒寒有上下內外之分澀為熱熱有表裡虛實之辨滑苔者主寒主濕也有因外寒而滑者有因內寒而滑者全舌淡白滑嫩無點無罅縫無餘苔者虛寒痰凝也如邪初入里全舌白滑而浮膩者寒滯中宮胃陽衰也若全舌白而有點花罅裂積沙等苔者真熱假寒也舌苔刮不淨底色卻隱紅多刮欲嘔重刮則沙點旁或出血少許此假證也最易感人宜辨之白滑者風寒濕也滑而膩者濕與痰也滑膩而厚者濕痰與寒也惟薄白如無則虛寒也但滑膩不白者寒濕與痰也兩條滑膩者非內停濕食即痰飲停胃也白浮滑薄苔刮去即還者太陽表證受寒邪也白浮滑而帶膩帶漲刮之有淨有不淨者邪在半表半裡少陽證也王肯堂云如舌上滑苔者不可下是邪未全化熱猶帶表寒故也及其邪傳裡為熱則舌上苔之不滑而滑澀也舌上白苔而膩滑咳逆短氣者痰飲也咳而口中有津液舌上苔滑者肺寒也舌上無苔而冷滑者少陰中寒也臟結舌上白苔滑者難治也舌色淡紅苔薄而滑者內寒也舌色深紅苔厚而滑者外寒也苔黃而滑目黃頭汗齊頸而還小便不利者必發黃也舌黑而滑者水極似火也黑舌俱系危證惟冷而滑如淡黑然者乃無根虛火可以化痰降火治之若黃苔光滑乃無形濕熱中虛之象澀為熱苔薄而澀舌淡紅者虛熱也苔厚而澀舌深赤者實熱也苔白而澀熱漸入里也苔轉黃膩深入胃也舌白粗澀兼有朱點罅裂紋之苔粗則不光澤朱點者顯其臟腑有熱罅裂紋多因誤服溫藥之故白乾膠焦燥滿苔刮不脫或脫而不淨者刮去垢泥後底子仍留汙質膩澀不見鮮紅皆裡熱結實也又有其白苔在舌如面上敷粉刮之多垢其白色與舌為兩物是實熱也成無己云舌上白膜白滑如苔甚則或燥澀黃黑是邪熱淺深之別也若舌苔乾澀如雪者脾熱也舌赤明潤苔厚燥澀者形氣病氣俱有餘舌淡紅枯暗苔薄冷滑者形氣病氣俱不足舌乾口渴苔不滑而澀者邪傳厥陰也嘉約翰云大抵初起白苔而後乾燥或粗澀或硬漸變黑色者重也更有血枯而津液不清及不能改換炭氣則遺毒而致病者舌亦乾澀此險證也余如溫暑之證其舌紅干內臟發熱及瘄痘者其舌亦多幹澀總之口乾者舌汁少也由此而推而舌乾者澀即知五臟內津液少也凡病舌先干而後漸潤者輕舌先潤而後乾枯者重第三節腐膩腐者無迹揩之即去為正氣將欲化邪膩者有形揩之不去為穢濁盤踞中宮劉吉人云腐與膩不同腐者如腐渣如腐筋如豆腐堆鋪者其邊厚為陽有餘能鼓胃中腐化濁氣上升故有此象膩者則中心稍厚其邊則薄無毛孔無顆粒如以光滑之物刡刮一過者亦有刮而不脫滿積而干而舌本尚罩一層黏涎此為厚膩之常苔為陽氣被陰邪所抑必有濁濕痰飲食積瘀血頑痰為病宜宣化一為陽氣所餘一為陽氣被郁蓋厚腐之苔無寒證由胃陽上蒸濁氣上達故苔腐厚忌用溫燥宣化之劑尤忌發表宜清降導下或中有直槽氣虛不能運化之故宜補氣不得因苔色尚白而溫表之宜燥之犯之必變灰暗不可不知也厚腐雖由胃中腐濁上泛然尤有膿腐黴腐之別如舌上生膿腐苔白帶淡紅黏厚如瘡膿凡內癰多現此苔肺癰及下疳結毒多白腐胃癰多黃腐肝癰多灰紫腐若黴腐滿舌生白衣為黴苔或生糜點如飯子樣謂之口糜此由胃體腐敗津液悉化為濁腐蒸騰而上循食道上泛於咽喉繼則滿舌直至唇齒上下顎皆有糜點其病必不治矣上參通俗傷寒論醫原云此因胃腎陰虛中無砥柱濕熱用事混合熏蒸證屬不治苔黃而膩為痰熱濕熱黃膩而垢為濕痰初結腐氣不利及食滯滑厚而膩為熱未盛結未定宜清下之黃腐苔如豆渣炒黃堆鋪者下證也白滑而膩者濕濁與痰也滑膩厚者濕痰與寒也滑膩不白為濕痰兩條滑膩非內停濕食即痰飲停胃舌苔黑而濕滑者臟結證也劉吉人云黃苔無孔而膩水黃舌如雞子黃白相間染成之狀此黃而潤滑之苔為痰飲停積溫濕正候或為濕熱病而有水飲者或熱傷胃陰誤服燥藥變生此苔者宜以脈參斷第四節糙黏糙者穢濁也黏者痰涎也苔白如糙石糙手者此燥傷胃汁不能潤舌腎氣不能上達之候亦有清氣被抑不能生津者如舌苔黃黑相間如鍋焦黃色摸之刺手看之不澤如胃中津液焦灼舌乾口燥之候然亦有陽氣為陰邪所阻不能上蒸而化為津液者當以脈證分別斷之凡黃苔有質地而起濁腐而動者邪已結里黃濁愈甚則入里愈深熱邪愈結焦黃則熱甚宜下之平人舌上有黏黑苔垢拭之不淨經久不退且口甜氣穢便是胃脘發癰之候宜涼膈散下之若津液如常口不燥渴身發熱而苔自滑逮寒化熱則舌苔不滑而枯以熱耗津液糙者津液已燥也若舌燥苔漸厚是邪熱入胃挾濁飲而化火也此時已不辨滋味矣逮厚苔而轉黃黏邪熱化火已入陽明胃府若熱甚失治津液漸枯則舌苔黑色胃火已甚也若擦去厚苔而舌底紅色者火灼津虧也此皆表邪傳裡由津液多少之變也第十四章辨舌之苔垢苔者如地上之草根從下生垢者如地上浮垢刷之即去無根者表分濁氣所聚其病淺有根者邪氣內結其病深有根之舌又當辨其無病常苔及病時所變有無食物觸染與苔之偏全與厚薄偏者邪結一臟全者苔全鋪滿舌也有虛有實厚者邪重薄者邪輕及化退先後鬱滯內結然後參以脈證則寒熱立判虛實可辨茲將各節列舉於下第一節常變常者舌苔始終一色不拘白黃灰黑即有厚薄滑澀干潤濃淡之不同總屬常苔變者如苔色一日數變或由白而黃由白變黃以嫩黃色者為順由黃而黑或乍有乍無乍赤乍黑者皆為變苔感變緩變者吉暴變驟變者凶欲知其變先察其常如平人無病常苔宜舌地淡紅舌苔微白隱紅須要紅潤內充白苔不厚或略厚有底然皆乾溼得中斯為無病之苔乃火藏金內之象也所謂變者有因感觸而變有因得病而變者有因病中誤藥而變感觸及因病而變者如陰虛火旺之人平時舌質淡紅無苔偶因用力過度或行路太急則舌質驟變深紅或常舌淡紅素不飲酒而強飲至醉則舌亦變深紅甚則紅紫或平時舌淡紅無苔在早起食物未進之前亦有淡薄白苔一層食後仍退者亦有平時苔潤在臥時口不緊閉則醒覺後舌必乾燥因腎系蒸騰之氣液隨口開而外出故舌乾燥也亦有在惹厭之時舌小而尖痰阻胸膈之時舌胖短而潤在暈厥並停呼吸之時舌之熱度減少在霍亂吐瀉時舌之熱度更極少並其呼吸亦稀在熱病熱退後再用涼降藥太過舌色先青而後黑潤而冷呼吸氣亦稀而寒新病血足者色或鮮紅久病血枯者色必淡白周雪樵云血熱而多則舌色紅血寒而少則舌色淡此皆余之經驗也利濟外乘雲無病之舌形色各有不同有常清潔者有稍生苔層者有鮮紅者有淡白色者或為緊而尖或為松而軟並有牙印者或當伸出之時潤而軟弱或收束緊時而成尖鋒此因無病時各有稟體之不同故舌質亦異也其他如常人胃氣現於舌舌上亦必有淡白薄苔一經感寒白苔必滑舌質淡紅傷暑傷熱舌質必紅即或質上有苔垢亦必薄白然亦有無病常見白厚苔者多里滯脾虛濕勝也有病而苔不顯者多中虧胃枯液涸也病本無苔而忽有者胃濁上泛也病本有苔而忽無者腎陰將絶也苔之變色亦有因誤藥而致者如唐笠三云常人舌上必有薄白苔垢俗醫誤用消導藥以致光赤無苔必須調養胃氣至漸能思食則白苔亦漸生余常見久病厚苔滿舌者一用消攻藥忽然退去光而且燥乃胃氣漸絶之徵劉吉人云如白如銀色者謂光亮似銀此熱證誤補之變苔也白如旱煙灰色者不論潤燥皆熱證誤燥之變苔也白如銀錠底者謂有如銀錠底式此因熱病誤補誤燥津液已傷元氣欲陷邪將深入之候也白如腐渣堆積者此因熱病誤燥腐濁積滯胃中欲作下證也如中心開裂則為虛極反似實證之候宜補氣養胃更參脈症分別之又如婦人病傷寒舌最易生黑苔不得遽以為凶若內有瘀血舌即轉黑雖有內熱而不遽生芒刺若瘀血兼挾痰水則苔灰黑有煙癮之人苔亦常帶灰黑糙刺此非內有真熱乃肺胃津傷耳凡見灰黑之苔無硬刺者必須兼用行血若火證熱甚現此苔必有神昏譫語灼熱便利症狀無寒熱者必胸膈有一塊結熱內煩而夜不安眠也第二節觸染林慎庵云凡臨證欲視病人舌苔必須禁飲湯水余謂亦有未然若灼熱液涸之人舌乾焦黑糙舌縮口內無津必須先潤以湯水其口能開舌可舒伸苔之燥潤糙黏須以指摸為準若舌本紅白偶食酸甜等物皆能染成黑色非因病而生也又如食枇杷白苔則成黃色食橄欖則成黑色然染成之色必潤而不燥刮之即淨如虛寒舌潤能染若舌苔乾燥實熱之證亦不染也章虛谷云有黃白苔垢而食酸味其色即黑尤當辨其潤而不燥又如燈下看黃苔亦似白色凡吸煙之人無病常見燥苔一經染病不拘白苔黃苔必兼灰黑或兼裂紋故臨診之時先須問其吸煙與否常苔染苔斯可攸分爰吸煙之人上焦皆燥痰中焦皆積滯下焦則寒濕也其熱在腑其虛在臟且脈象便尿亦與常人不同雖然我民國政府煙禁森嚴吸食之人漸次絶迹然於診斷上仍須備具一格耳余如因受事物感觸舌亦變色宜參前節常變互考第三節全偏全者苔鋪滿地也為濕痰滯中偏者其苔半布也有偏內偏外偏左偏右之分凡偏外者外有苔而內無也邪雖入里而尤未深也而胃氣先匱偏內者內有苔而外無也里邪雖減胃滯依然而腸積尚存及素有痰飲者亦多此苔偏左滑苔為臟結證邪併入臟最為難治偏右滑苔為病在肌肉為邪在半表半裡再看苔色以分表裡白色多表證宜和解黃黑灰色多及生芒刺黑點裂紋皆裡熱已結宜和解兼下又有從根至尖直分二三條為合病從根至尖橫分二三截為並病已見前橫直中茲不再辨又如邊厚中薄或中道無苔者陰虛血虛也中道一線深陷極窄如隙者胃痿也舌根高起纍纍如豆中路人字紋深廣者胃有積也舌中小舌者傳變危象也舌有中道一條或拇指大黑潤浮苔兩邊或黃或白者兩感證也石頑曰凡舌苔半黃半黑或半黃半白或中燥邊滑或尖干根潤皆為傳變之邪寒熱不和之候舌有根黑而尖帶紅者乃腎中熱邪未散也舌根黑而尖白者乃胃火乘腎也舌根黑而尖黃者乃邪熱將傳腎也舌純紅而尖黑者乃腎虛心火來乘也舌中心紅暈而四周邊旁純黑者乃君相二火炎騰急用大黃重加生地而救之舌中心灰黑而四邊微紅者乃邪結大腸也下之則愈不應是腎水枯稿又能潤之推送舌外紅而內黑也此火極似水也亦宜下之又如內黑而外白內黑而外黃皆前證也與上同治十中可愈五六惟舌中淡黑而外或淡紅外或淡白內或淡黃者較前稍輕俱可前法減制治之十中可痊七八也李梴云舌黑有數種有四邊紅而中灰黑成路者失下也有黑圈者過經未解也有黑尖者虛煩也有舌見黃而中有黑至尖或雜黑點者熱毒深也有弦紅心黑或白苔中見黑點者表未解也有根黑尖黃脈滑者可下之脈浮者可汗之有尖黑而有亂紋脈滑實者急下之脈數無力者必發渴而死此皆論遍苔舌也若全舌光滑無苔者虛寒也有苔者微熱也滿舌俱白隱隱黑色者大虛大寒也有苔散堆滿舌如雪松厚滿邊者胃氣絶心火自焚也如全舌淡白兼微紅無苔垢者無病之舌也若瘟疫見此舌舌上必有煙霧白色蓋滿外必有發熱惡寒等症也若全舌苔白起砂四圍肉色紫紅者即白砂苔為濕遏熱伏之溫邪伏於膜原者宜達原以透邪若四周肉色膩者為白鹼色為中宮濕阻氣滯與食積相搏宜淡滲兼消導若黃苔見於全舌者為臟腑俱熱見於某部即某經之熱也若舌無苔全舌黃如金色者臟氣交絶也第四節薄厚苔垢薄者形氣不足苔垢厚者病氣有餘苔薄者表邪初見苔厚者里滯已深白而苔薄者寒邪在表或氣鬱不舒薄白無苔為虛寒白而苔厚者為中脘素寒或濕痰不化薄黃為熱薄黃而滑表猶未罷熱未傷津苔黃而厚濕熱內滯黃苔有根地而濁者邪已入里黃濁愈深入里愈深熱邪愈結若望之似有薄苔一刮即淨全無苔迹者血虛也一片厚苔或黃或白如濕粉所塗兩邊不能漸勻漸薄者胃絶也若白厚粉濕滑膩苔刮稍淨而又積如麵粉發水形者裡寒濕滯也凡舌苔初則粗白漸厚而膩是寒邪入胃挾濁飲而欲化火也逮變黑則胃火已甚也或乾而燥裂則毒火更甚也若苔厚漸退而舌底紅色者火灼水虧也平人舌中常有薄苔者胃中之生氣也診家直訣云凡舌苔以勻薄有根為吉白而厚者濕中熱也忽厚忽薄者在輕病為肺氣有權在困病為腎氣將熄也劉吉人云舌苔薄白如米飲敷舌者此傷寒中寒之初候也如無表症為飲停膈上也如白而滑潤如稠白豆漿敷舌者傷寒中寒濕邪痰飲等候也若舌薄白不潤澤舌質不甚紅者傷燥表證也白而厚如豆腐腦鋪舌者痰熱證也亦有如白豆腐筋堆舌者謂白苔厚而有孔如豆腐煮熟有孔者曰筋謂有二三條白者余則紅色或圓或長此胃熱痰滯腐濁積聚誤燥當下不下之候過此不下則無下證可見矣若白而疏如米粉鋪紅者傷寒傷暑初傳之候也白如粟米成顆粒者此熱邪在氣分也第五節化退醫級云苔隨食化者中虛之候因朝起未食則舌苔食後則苔退又如舌苔忽剝蝕而糙干為陰虛剝蝕邊仍有膩苔為濕痰剝換由尖及內症可漸平四圍旁退中留胃敗變至劉吉人云苔之真退真化真退必先由化而後退假如苔由厚而退薄由板而生孔由密而漸疏由有而漸無由舌根外達至舌尖由尖而漸變疏薄乃里滯減少是為真退由退而後生薄白新苔乃胃氣漸復穀氣漸進之吉兆若驟然退去不復生新苔或如駁去斑斑駁駁存留如豆腐屑鋪舌上東一點西一點散離而不連續皆逆象也皆因誤用攻伐消導之藥或誤表之故胃氣胃液均被傷殘故現此候若滿舌厚苔忽然退去舌底仍留汙質膩澀或見朱點或有發紋者是為假退一二日間即續生厚苔亦有滿舌厚苔中間駁落一瓣或有罅紋或有凹點底見紅燥者須防液脫中竭若厚苔忽然退去舌光而燥者此胃氣漸絶也病多凶危例如鳳溫之邪首傷肺經氣分故舌多無苔即有黃白苔亦薄而滑漸次傳裡與胃腑糟粕相為搏結苔方由薄而厚由白而黃而黑而燥其象皆板滯不宣逮下後苔始腐腐者宣松而不板實之象由腐而退漸生浮薄新苔一層乃為病邪解盡第六節滯郁凡食滯於中宮則舌現灰白滯積甚則黃厚灰白宜消運黃厚宜攻下食消則苔必自退邪鬱於血分則舌紅郁甚則舌紫紫而枯燥者血鬱熱甚也紫而滑潤者寒鬱血瘀也若舌本紅紫雜現而色不勻者營血瘀滯也鬱於氣分者則舌苔薄白濕而不浮苔如地生之草胃氣和調苔必升浮中氣鬱滯苔必緊閉也陽為陰鬱則舌青升陽則青退陰竭則舌光亮陰枯多死第十五章辨舌之顏色馬良伯云舌根心脾腎三臟之陰司腸胃傳化之變外淫內傷臟腑失和則舌上生苔故白苔者病在表黃苔者病在裡灰黑苔者病在腎苔色由白而黃由黃而黑者病日進苔色由黑而黃由黃而白者病日退吳坤安云白苔肺經黃苔胃經黑苔脾經絳苔心經鮮紅膽經紫色腎經焦紫起刺肝經青滑肝經李纘文云凡病在太陽太陰舌白入胃則苔黃厚入三陰則舌灰黃或黑虛人舌多裂紋津液少舌光赤無苔癆病壞病舌起白浮點此皆一定之顏色也其他如黑與黃間紅與紫呈白與黃雜紅與黑形此兼經互呈猶當鑑別茲分類條辨於下第一節白苔肺經吳坤安曰肺主衛主氣主皮毛風寒先入皮毛內應乎肺又太陽經亦主一身之表故肺家之邪即可以候太陽之表仲景麻黃湯亦散肺分之邪也舌無苔而潤或微白薄風寒在表故無苔而或薄白者風寒也外證必惡寒發熱而口不渴宜溫散之舌苔白而燥刺者溫邪也外證初必微寒繼即發熱不已此邪在手太陰肺經宜涼散之忌足經辛溫藥舌白而黏膩者濕邪在於氣分也外證必發熱頭重身痛而口不渴宜解肌去濕如桂枝秦艽羌活紫蘇二陳二苓之類肺分雖兼太陽惟寒邪可用足經辛溫藥若風溫入肺症見發熱口渴咳嗽喉痛舌苔白燥或白兼邊紅治宜輕清涼解肺經如焦梔豆豉桑葉杏仁栝蔞皮象貝前胡薄荷蘇子黃芩桔梗之類凡風寒濕初中皮腠則苔白薄當疏散之寒濕本陰邪白為涼象故白苔滑者風寒與濕也白滑而膩者濕與痰也滑釉而厚者濕痰與寒也但滑膩不白者濕與痰也兩條滑膩者非內停濕食即痰飲停胃亦宜溫化白苔黏膩吐出濁厚涎沫而口甜者為脾熱濕聚當用佩蘭葉白蔻滑石通草芳淡而化之舌白不燥或黃白相兼或灰白不渴此濕熱鬱而未達或素多痰飲雖中脘痞痛亦不可攻宜用開肺化濁舌苔白膩胸膈悶痛心煩乾嘔時欲飲水水入則吐此熱因飲郁宜辛淡化飲舌苔薄白而乾者為肺津已傷宜用清潤之品如麥冬銀花露鮮蘆根等白而燥者肺陰亡也宜麥冬花粉元參之類白厚而乾燥者此胃燥氣傷也宜加甘草於滋潤藥中使之甘守津還之意舌苔燥如白砂者此溫邪過重宜急下之白燥而厚者調胃承氣下之苔白底絳為濕遏熱伏防其就干當先泄濕透熱再從里透外則變潤矣初病舌就干如神不昏急加養正透邪之藥神已昏則已內匱脈沉脘悶則為痰阻於中而液不上潮補益未可投也苔如鹼者胃中宿滯挾濁穢而鬱伏當急急開泄否則閉結中焦不能從膜原遠出矣苔白不燥而口中自覺黏膩者濕漸化熱也宜用厚朴檳榔等苦辛微溫之苔白不燥而口中苦渴者邪已化熱也宜用淡滲苦降微涼之苔白不燥而渴喜熱飲者邪已化熱而痰飲內盛也宜用清熱而蠲飲初病舌苔白燥症見發熱口渴咳嗽喉痛者風溫入肺也宜輕清涼解肺經如桑葉杏仁栝蔞皮象貝前胡焦梔桔梗之類忌用辛溫苔白滑而脈右緩者穢濕著里邪阻氣分也宜草果楂肉神麯以運脾陽白苔漸退而舌心反見裂紋者此濕熱己轉燥矢苔白滑而光亮無津者此濕蘊津傷之候勿投香燥苔自而滑厚者寒飲積聚膈上又臟結證也白浮滑薄其苔刮之即還者太陽表分受寒邪也白浮滑而帶膩帶脹刮之有淨有不淨者傷寒邪在半表半裡也全舌白苔浮膩浮脹漸積而干微厚刮去浮面其底仍有者寒邪欲化火也苔白厚粉濕滑膩刮稍淨而又積如麵粉發水形者裡寒濕滯也用草果以醒脾陽則地氣上蒸天氣之白苔可除滿舌苔白干膠焦燥刮不脫或脫不淨者為裡熱結實也舌起白苔如雪花片者此俗名雪花苔為脾冷而閉也不治舌與滿口生白衣如黴苔或生糜點者胃體腐敗也多死粉白實熱馬良伯云舌厚膩如積粉者為粉色舌苔舊説並以為白苔其實粉之與白一寒一熱殆水火之不同道溫病熱病瘟疫時行並外感穢惡不正之氣內蓄伏寒伏熱之勢邪熱瀰漫三焦充滿每見此舌與熱在陽經者異與腑熱燥實者亦異治宜清涼泄熱粉白乾燥者則急宜大黃黃連瀉心湯等甚或硝黃下之切忌拘執舊説視為白苔則大誤矣又有舌正赤苔如積粉不滑外證若煩熱發渴亦當以白虎清內熱也又脾胃有水飲者舌多不燥不可誤認為寒證也全白虛寒王晉三云戊午歲之疫舌苔白者居多傷寒臟結證舌上白苔滑者難治戒之不可攻而舌鑑白苔十九症皆用汗下辛熱之法余閲歷多年未有能治之者夫白苔雖有白滑白屑白粉之異原其義皆由熱勝寒復火勝水復熱極反兼勝已之化也用炮薑附子則白苔厚而液燥用芩連則手足冷而陽脫余尋思舌為心之外候其色當赤白為肺之色反加心火之上是侮其所勝顯系寒邪入肺鬱蒸見於舌是衛實營虛乃以大劑生薑汁泄衛肉桂通營人參南棗當歸助營衛之正氣服之皆應手而愈名曰薑桂湯生薑汁三錢肉桂二錢四分人參三錢當歸二錢四分南棗三枚上水二鍾煎八分沖薑汁分三服隨時服之宗仲景心營肺衛立方也按溫熱證初起舌白瘟疫證舌白如粉而滑四邊色紫絳者乃疫邪初入募原未歸胃府當即與透解如前條粉白證是也此方不可誤投治法匯曰脾熱則舌滑而苔脾閉則白苔如雪陳準齋云二句不論內傷外感皆以脾熱閉論大抵當以症象參脈互斷之不可專執舌苔沈堯封云項腫如匏按之熱痛目赤如血而足冷便泄人事清明六脈細數右手尤軟略按即空堯封云此虛陽上攻也唇上黑痕一條如干焦狀舌苔白如傅粉舌尖亦白不赤是皆虛寒確據沉便泄足冷脈濡斷非風火若是風火必痞悶煩熱燥渴不安豈有外腫如此而內里安貼如平人者乎按此即喻氏濁陰從胸上入即咽喉腫痹舌脹睛突從背上入即頸項粗大頭項如冰渾身青紫而死之類也末句辨證尤為精切不易最眩人者在熱痛目赤若非此者雖足冷便瀉脈濡不空猶未能決為真寒也上二條録之以反復探察白苔之實熱虛寒也因症狀疑似難明故特列專條以申辨之白兼黃凡白苔由白轉黃者風熱從火化也治宜清泄有苔而黃白者熱滯胃脘也宜枳實厚朴元明粉之類舌苔白中帶黃或微黃而薄者邪初入陽明也如兼微惡寒猶帶表證也宜涼散之舌苔由白而黃者白苔主表黃苔主裡但看舌苔帶一分白病亦帶一分表必苔純黃無白邪方離表而入里苔黃白相兼而脘悶者外邪未解而里先結也宜輕苦微辛如杏蔻桔橘等以宣氣滯舌尖白根黃不甚干而短縮不能伸出者痰挾宿食也宜下之白兼紅凡舌苔先白後紅者溫邪從口鼻吸入上焦心肺先受邪先入氣分而後入營分也白中帶紅外症初起微寒繼即發熱不已口渴者此濕邪之輕症也宜芩梔翹赤等清解之紅中兼有白苔者更感非時之寒也舌白無苔而兼淡紅者肺胃虛寒也苔白底紅脈形弦細者陰虛而挾濕熱也四邊色紅中心干或白燥外症煩渴煩熱者乃上焦氣熱爍津宜急散無形之熱此非邪入血分勿用血分藥左半邊光紅右半邊白苔濕滑如水晶粉團之色者此肝營被劫而痰濁又變於胃也白兼絳凡舌苔白而底色絳者濕熱自氣分傷營也及濕遏熱伏也當先泄濕透熱防其即干也從里而透於表則變潤矣舌苔白膩底絳尖紅者濕遏熱伏之徵也色絳而白苔滿布者肺胃熱也宜清肅肺胃若兼神氣昏普者伏痰內盛也宜兼開其痰熱舌底絳望之黏膩獨舌心有苔白厚如豆大一瓣者伏暑內挾痰飲也深絳而苔白厚膩者溫邪入營而兼伏濕也白兼灰舌白滑灰者寒濕也灰白不濁者寒兼痰濕也為陽氣不化陰邪奎滯不可亂投苦寒滑泄以傷陽從根至尖白中直紋兩條灰色而潤者濕熱兼夾陰寒食也舌白半邊苔灰而滑者傷寒半表半裡證也白兼黑凡白苔帶黑點或苔見黑紋而黏膩者太陰氣分之濕也宜行濕和脾黑苔望之雖燥而生刺但渴不多飲或不渴或邊有白苔其舌本淡紅而潤者假熱也治宜溫補全黑由淡白忽然轉色其間無變黃之一境望之似焦黑芒刺干裂刮之必淨濕之必潤外症唇白不紅為寒結在臟真寒假熱也從根至尖白中直紋兩條黑潤者夾陰寒證也尖白根黑者傷寒半表半裡也白兼青凡舌色㿠白兼青者中焦生氣已絶也不治白兼黃紅凡絳色中兼黃白苔者為熱初傳營分氣分之邪未盡也泄衛透營兩和之白兼黃黑凡白苔變黃由黃變黑刮之不脫濕之不潤者為寒邪傳裡化火熱極傷陰也甚則芒刺干焦罅裂宜用苦寒以瀉陽急下以救陰中間一拇指大黑潤浮苔兩邊或黃或白者兩感證也由白苔漸黃而灰黑者傳經證也或生刺點燥裂不拘在根在尖皆宜急下若苔黃黑白雜見或中燥邊滑或尖干根潤皆並病合病寒熱不和之候白兼灰黑凡白苔而灰黑更兼黏膩浮滑者此太陰在經之濕邪是從雨霧中得之宜解肌滲濕如五苓加羌防之類白兼絳紫凡苔白如粉而滑四邊色紫絳者瘟疫病初入膜原未歸胃府也急宜透解勿使傳入而為險證也第二節黃苔胃經陽明燥金從土化故黃色應胃蓋白苔主表黃苔主裡太陽主表陽明主裡故黃苔專主陽明裡證辨證之法但看舌苔帶一分白病亦帶一分表必純黃無白邪方離表入里如見舌苔白中帶黃或微黃而薄是邪初入陽明猶帶表證微寒惡寒宜涼散之如苔黃而燥外症不惡寒反惡熱是傷寒外邪初入陽明之裡或溫熱內邪欲出陽明之表斯時胃家熱而未實宜梔豉白虎之類清之可也如厚黃燥烈或邊黃中心焦黑起刺臍腹脹滿硬痛乃陽明裡證也宜承氣湯下之若嗜酒之人濕熱內著從飲食中得之苔必厚黃黏膩痞滿不飢嘔吐不納惟瀉心湯最效川連乾薑赤苓半夏枳實茵陳通草之類舌黃或渴當用陷胸瀉心若光滑者乃無形濕熱已有中虛之象大忌前法其腹或滿或脹或痛此邪已入里表證必無或十之一二亦須驗之於舌或黃甚或如沉香色或如灰黃色或老黃色或中有斷紋皆當下之如小承氣湯加檳榔青皮枳實元明粉生首烏等若未見此舌不宜用此法舌中苔黃而薄者脾熱也舌中苔厚而黃者胃微熱也黃苔不甚厚而滑者表猶未罷熱未傷津猶可清熱透表黃薄而於者邪雖去而津受傷也宜甘寒輕劑養之苔或黃或濁而有地並不光滑並脘中痛或痞脹者邪已入里當用苦辛泄之以其入腹近也或黃或濁而光滑者此無形濕熱也只宜開泄橫疏如杏蔻橘桔等味老黃色或中有斷紋而臍以上之大腹或滿或脹或痛者邪已入里也當下之舌中有黃燥苔者腸中有燥矢也然腹無硬痛之狀只宜養陰潤燥不可妄用下法舌苔黃而脈沉實者邪積聚於陽明也平素多黃苔者其人必胃熱黃苔刮之潔淨光明見淡紅潤澤底者為無病矣黃苔刮之仍留粗澀垢膩如薄漿糊一層或竟不脫者均熱證也淺黃膩薄者微熱也乾澀深黃厚膩者大熱也老黃芒刺焦裂者熱極也全舌黃苔者臟腑俱熱也黃苔滑厚而膩者熱未盛結未定也冬時未可遽攻夏月伏陰在內裡熱即熾而苔不燥即當用下黃燥而生芒刺中心瓣裂者熱結甚也當速下以存其陰黃兼紅凡熱時舌色乾紅熱退舌色黃膩者為濕遏熱熾將燥未燥也又陰液已傷而濕熱猶盛也四邊色紅中心干或黃並煩渴煩熱者乃上焦氣熱灼津急用涼膈散散其無形之熱勿用血藥黃兼絳凡苔黃不甚厚而舌絳者熱初入營邪結未深也尚可清熱以辛開之藥從表透發黃兼灰凡舌先灰滑後黃燥大便堅結為濕久生熱熱必傷陰也黃兼黑凡舌苔黃中帶黑而浮滑而黏膩者太陰濕熱內結宜利濕清熱邊黃中心焦黑起刺外症兼臍腹脹滿硬痛者陽明裡證也宜下之舌芒刺焦裂老黃夾黑色苔者裡熱極也亦宜下之舌燥苔黃中黑通尖下利臭水者腸胃腐敗也十不救一舌苔老黃甚則黑者黑水色也火極而似水也黃兼紅黑凡舌反赤為黃反黃為黑者乃熱極反兼水化至危之候也紅中兼黃黑有芒刺者邪熱入腑也黃赤兼黑者此名黴漿色乃臟腑本熱而夾有宿食也且內熱久郁者夾食中暑者夾食傷寒傳太陰者皆有之黃兼青紫凡苔黃厚而舌中青紫者陰寒夾食也甚則碎裂口燥而舌不幹宜斟酌溫下之第三節紅色膽經少陽相火從火也故紅色應膽少陽以木火為用溫邪內發必借少陽為出路乃同氣之應也如淡紅嫩紅白中帶紅是溫邪之輕者初起微寒繼則發熱不已口渴甚者是也宜柴芩梔翹等清解之如純紅鮮紅起刺此膽火熾而營分熱急宜犀角翹丹等清解之如不解此溫邪伏於少陰而發於少陽之表也症非輕渺速宜重加鮮生地麥冬元參之類以滋少陰之水而少陽之火自解矣大忌風藥凡風溫瘟疫等證如舌苔鮮紅者當從手少陰治或從手厥陰心包絡施治亦即是治心如舌尖獨赤起刺心火上炎之故犀角合導赤散以瀉之舌尖紅而出血者心經邪熱壅盛所致亦宜清之舌尖赤者心熱也尖赤而起芒刺者心熱甚也舌邊色赤者肝熱也甚則起芒刺者肝熱極也舌形胖嫩而色淡紅外症見躁擾不安六脈遲微或動氣內發腹寒畏冷或初起吐利手足逆冷或格陽躁狂六脈洪數無根者為腎氣大虧坎中火衰也宜益火之源更衣後舌苔去而見淡紅有神者佳兆也淡紅無神或干而色不榮者為胃津傷而氣不化液也當用炙甘草湯不可用寒涼藥紅嫩如新生望之似潤而燥涸殆甚者為妄行汗下以致津液內竭也多不治舌乾紅知飢善納者水虧陽亢土燥於中也宜投鹹苦寒劑舌心乾紅者為陰傷也宜用甘寒平素舌多紅赤者其人必營虛全舌淡紅不淺不深者為無病平人之常苔也全舌無苔色淺紅者氣血虛也全舌無苔色赤紅者臟腑俱熱也全舌純紅而有黑小點者臟腑皆熱極也舌色鮮紅無苔點舌底無津舌面無液者陰虛火炎也舌色的紅無苔點而膠乾者陰虛水涸也舌色灼紅無苔點而有裂紋者陰虛火炎也舌紅中有裂紋如人字形者心火燔灼熱毒炎上也紅舌中有紅點如蟲碎之狀者熱毒熾甚也舌紅碎痛者肝家風火炎炎之勢漸迫心君也舌光如硃紅柿者君火上炎也又相火下熾引動君火皆危險之候也紅兼灰凡舌紅中夾兩條灰色者濕熱兼夾寒食也紅兼紫凡全舌無苔色紫紅瘀紅者臟腑熱極也中時疫者有之誤服溫補者亦有之紅兼青凡舌淡紅帶青者血分虛寒也婦人子宮冷者常有之久痢虛極者亦有之第四節絳色心經凡邪熱傳營舌色必絳絳深紅色也心主營主血舌苔絳燥邪已入營中宜清絡中之熱血分之火忌用氣分藥馬良伯云滿舌明紅並無他苔者為絳色心之本色也舌絳而潤為虛熱舌絳而干為實熱絳而起刺為熱甚絳而光嫩為陰液不足絛光燥裂為陰液大傷凡溫病熱病瘟疫傷寒邪熱內傳三焦熏灼心包先受熱蒸則本臟之色見故治宜清心存陰化熱章虛谷曰熱入營分舌色必絳風熱無濕者無苔或有苔亦薄熱兼濕者必有濁苔而多痰也然濕在表分者亦無苔或有苔亦薄其脈象必細澀也溫邪從口鼻吸入上焦心肺先受如舌苔先白後紅者邪先入氣分後入營分也如初起舌即絳色者邪不入氣分而入營分也宜清解營分之熱如犀角鮮地丹皮元參之類凡初傳絳色中兼黃白色氣分之邢未盡也泄衛透營兩和可也白苔邪在氣分宜解表忌清裡絳苔邪在營分宜清熱忌發汗絳純鮮色者包絡受病也宜犀角鮮生地連翹鬱金鮮菖蒲等清泄之若平素心虛有痰外熱一陷里絡就閉有痰者必有舌苔心虛血少者舌色多不鮮赤或淡晦無神邪陷多危而難治若邪火盛而色赤宜牛黃丸痰濕盛而有垢濁之苔者宜至寶丹以開其閉再邪己入營則舌色絳胃火爍液則中心乾者乃心胃火燔劫爍津液宜鮮生地犀角黃連石膏等以清營熱而救胃津或白虎湯加犀地竹葉蓮心黃連亦妙若干絳延及舌尖者為津干火盛宜玉女煎再加西洋參花粉蔗漿梨汁舌尖絳獨乾者此心火上炎其熱在氣分者必渴以氣熱爍津也熱在血分其津雖耗其氣不熱故口乾而不渴也宜導赤散加童便治之舌絳赤外症耳聾目赤者為溫病從少陽發出也宜犀角鮮大青梔翹鮮地丹皮之類以解木火之郁大忌汗散舌赤無苔其症神昏內閉此係濕熱傷陰宜犀角鮮地銀翹菖郁蘆根梨汁竹瀝薑汁等絳而光亮者胃陰亡也急用甘涼濡潤之品如炙甘草湯去薑桂加蔗漿石斛飴糖舌絳而上有黏膩似苔非苔者中挾穢濁之氣急加芳香逐之舌絳望之若干捫之原有津液者此津虧而濕熱熏蒸將成濁痰矇蔽心包也舌絳而苔滑澤者溫邪入營而平素有痰也絳而抵齒難伸出口者痰阻舌根有內鳳也舌絳無苔無點光亮如鏡或半舌薄小而有直紋或有泛漲而似膠非膠或無津液而咽乾滯澀不等紅光不活絳色難名者水涸火炎陰虛已極也舌絳無苔乾枯紅長而有直紋透舌尖者心氣內絶也必死絳舌者因實熱證誤補溫補灼傷真陰或誤服滋補膩澀酸斂膠黏實熱引入陰分俾鬱火耗爍真陰致現此舌而為陰虛難療矣舌雖絳而不鮮乾枯而痿者腎陰涸也急以阿膠雞子黃生地天冬等救之緩則恐涸極無救矣病後絳舌如鏡光亮或舌底嗌乾而不飲冷者腎水虧極也宜急救其津液否則立涸矣舌尖獨紅絳者心營暗熾也宜犀羚鮮石斛鮮生地等舌根絳者血熱內燥也全舌無苔色深紅者氣血熱也舌肉絳者邪居血分也舌絳不渴夜甚者邪入營也無苔而紅絳者熱傷血分也宜丹皮地黃麥冬元參等舌色絳而潤者虛熱也舌色絳而乾者實熱也絳而起刺者熱甚也絳而有黃白碎點者將生疳也絳而光者陰液不足也滿舌紅紫色而無苔者兩色合而成絳腎虛也第五節灰色脾經灰色苔者即黑苔之輕也如以青黃和入黑中則為灰色也當與黑苔同治為痰水注於脈中致微絲血管停阻而淤而呈斯苔然有直中傳經之殊蓋傳經熱邪始自白苔而黃由黃而灰或生芒刺黑點紋裂乾燥不拘在根在尖俱宜攻下泄熱舌灰而潤並無苔垢更不變別色始病即見非由白黃漸變者為夾食中寒及停飲蓄血證當用消用補用燥用攻因證而治又有屢經汗下而灰黑不退或滋潤或不潤亦不燥者脈必虛微無力此因汗下太過傷陰使然急宜救陰津因不得用硝黃亦不可用薑附灰色即黑之輕也與黑同治兼有表者雙解散下利者解毒湯內實者承氣湯但少陰寒證亦見灰色見在一二日無苔而冷滑是也四逆湯主之下利者理中湯舌中尖見灰色者外症消渴氣上衝心飢不欲食食則吐蛔乃傷寒邪入厥陰也宜烏梅丸若雜病見此舌為實熱里證則宜大承氣湯與白虎湯合用全舌純灰無苔而少津者火邪直中三陰也宜三黃白虎大承氣並用舌苔灰色重暈者為溫病熱毒傳遍三陰也急去表藥用涼膈散合承氣以下之舌灰唇焦者中焦有濁積也舌灰目黃者濕中生熱也舌灰齒煤其脈細澀若無身已不熱者此火過呈炭須大劑補陰宜熟地西參麥冬阿膠龜板雞子黃等不必寒涼以其病已無熱也無苔而有如煙煤隱隱並不渴肢寒而潤者挾陰病也宜甘溫扶中無苔如煙煤隱隱口渴煩熱者平時胃氣燥也宜甘寒益胃久病舌起煙煤者胃虛液涸也凡舌見灰色者病皆非輕均里證無表證有實熱證無虛寒證有邪熱傳裡證有時疫流行證鬱積停胸證蓄血如狂證其證不一治法不外寒涼攻下寒涼以救真陰攻下以除穢毒在當用之時不得以此言為戒伐焉第六節黑色脾經大陰濕土所主而水就濕故脾家見症每每舌現黑色有始病即舌心黑色非由白黃變化舌轉瘦小者為真臟中寒此寒水凌心腎氣外現急宜用溫稍緩則誤事有中黑而枯並無積苔邊赤不絳或略有微刺者為津血燥證急宜養陰生津誤用攻下或溫經皆必死夏月中暑多有黑苔為濕痰鬱熱亦有黑滑膩厚舌又不可與傳經證同論有苔黑腐爛者為心腎俱絶舌黑而捲縮者乃肝絶皆不治若黑薄而潤滑者可治如苔灰黑而滑者此寒水侮土太陰中寒證也外症腹痛吐利手足指冷六脈沉細宜理中湯主之甚加附子若雜症而現黑滑苔者必是濕飲傷脾宜溫中和脾逐飲治之若黑而燥刺是陽證注入太陰之熱邪宜清火解毒兼陽明治如屢清不解腹無痞滿硬痛之症者不可妄投承氣是胃中津液乾涸少陰腎水不支宜大小甘露飲主之如舌苔黑刺大便閉結臍腹硬滿耕痛此燥矢為患也承氣湯下之仍從陽明治若黑而堅斂焦刺如荔子形者乃陽亢陰竭胃汁腎液俱涸也不治不得已用大劑滋陰清熱之法藥勿間斷間有生者以上吳坤安辨黑舌法也凡舌苔由白而黃由黃而焦或枯黑燥裂其舌邊胖大舌底滑潤者甚有舌底亦燥而絶無津液其糙刺如沙皮斂束如荔子者皆因勞傷脾肺氣虛發熱誤用發散益虛益熱復用寒冷重陰內逼以致虛火上炎所以白上加黃黃上加焦而枯黑燥裂也大劑參附養榮湯不時灌服多有得生者更有其舌以一黑色一屬寒水侮土一屬腎氣凌心蓋寒水侮土者其黑色正聚於舌中系陰甚於內逼陽於外外假熱內真寒格陽證也宜附子理中湯腎氣凌心者其黑色直抵於舌尖然未有不胖且嫩者乾燥滑潤在所不拘系陰盛於下逼陽於上上假熱而下真寒戴陽證也宜人參八味湯若是實火證則其形必堅斂其色必蒼老而萬無胖嫩者耳此一虛二寒症皆驗舌所必知為楊云峰之言也黑苔舌有水竭津枯一候不宜涼藥宜重用壯水之劑世多習而不察率投苦寒遺人夭殃殊不知脈虛數或微細胸腹無脹滿日多錯語舌雖焦黑乾枯腫而生刺乃真水衰竭水不制火使然大禁涼劑以大劑生料六味地黃湯飲之虛寒者苔黑而鬆加桂附五味子則焦黑刺腫渙若冰釋此余所親驗故看黑舌苔須分燥潤及刮之堅松以定虛實寒熱為要法此即林慎庵之法也凡黑苔有寒熱之分辨別不精死生立判汪苓友謂舌苔雖黑必冷滑無芒刺斯為陰證無疑誠扼要之言也舒馳遠傷寒集注云黑苔干刺為二症一為陽明熱結陰津立亡法主大黃芒硝急奪其陽以救其陰陰回則津回一為少陰中寒真陽霾漫不能熏騰津液以致乾燥起刺法主附子炮薑急驅其陰以回其陽陽回則津回據此則黑苔冷滑者必無陽證而黑苔干刺者有陽證復有陰證矣臨證者可不慎歟苔黑而口黏淡者當從太陰脾濕治不可便泥腎氣凌心也其因亦不僅虛寒實熱伏痰挾血而已也舌中苔厚而黑燥者胃大熱也舌心有黑燥苔者腸中有燥糞也然腹無硬痛之狀只宜養陰潤燥不可妄用下法治之舌中心焦黑者腎陰涸心胃火熾也宜犀角地黃湯清之舌中苔黑燥而連牙床唇口俱黑者胃將蒸爛非生大黃等大劑不能救也然以舌燥不燥為別黑而不燥者非是舌根黑苔而燥者熱在下焦也舌本無苔惟尖黑燥者為心火自焚不可救藥黑苔焦枯者火熾水竭也不治中黑無苔而舌底乾燥有小點紋者胃經實熱非六氣侵擾也宜白虎三黃等中黑無苔而舌底濕嫩光滑無點紋者胃經虛寒也宜理中溫之初病遍舌色黑而潤發熱胸悶外無險惡情狀者此胸膈素有伏痰也宜用薤白瓜蔞桂枝半夏即退或去桂枝用枳殼桔梗亦效舌黑濕滑無苔無朱點無芒刺不罅裂刮之明淨如水浸獵腰有淡淡融融之形外症口不苦唇不燥者為臟腑極寒也全黑無苔而底紋粗澀乾焦刮之不淨者熱極也全黑無苔而無點無罅裂乾燥少津光亮似鏡者即絳色之變陰虛腎水涸也孕婦亦有之宜大劑甘寒全黑無苔有點有罅乾燥無津澀指如銼者極實熱證也宜大劑苦寒黑色暗淡無苔無點無罅非濕非干似亮不亮者陽虛而氣血兩虧也久病見之不吉舌淡黑如淡墨乃腎虛火炎為無根之火也黑舌燥裂芒刺隔瓣者津液焦灼少陰真水垂涸最為凶象用新青布蘸薄荷湯濕潤揩去刺瓣舌質色紅者可治急攻下其熱滯若刺瓣下仍黑色者則腎陰己竭臟色全露不治苔黑腐爛者心腎俱絶也不治舌黑而捲縮者肝絶也亦不治舌黑咽燥煩渴不寐者熱人心營而血液受劫也黑兼灰傷寒已經汗解而見舌尖灰黑者此有宿食未消或又傷飲食熱邪復盛之故也以調胃承氣湯下之若雜病裡熱見此舌宜大承氣湯重加黃連淡灰轉黑者傷腐脾胃也不治黑兼青平素舌常如水黑青色者其人多虛寒若因跌僕而舌青黑者瘀血內蓄也因痘疹而舌青黑者疫毒內陷也因癰疽而舌青黑者毒氣內攻也因中寒而舌青黑者邪氣入臟也因發斑而舌青黑者胃爛也因痢疾而舌青黑者胃腐敗也第七節紫色腎經少陰君火從火化故紫色應腎六經惟腎無實證故仲景於少陰證中揭出脈微細但欲寐為主病示正氣之虛也如見舌形紫而乾澀口渴唇燥外見少陰證者此腎陰不足坎中水虧宜壯水為主六味飲一陰煎之類如兼譫語神昏又當從手少陰治微清痰火如生地丹參茯苓川貝菖蒲鉤藤天竺黃之類如舌形胖嫩而色淡紅者外症必見煩躁不寧六脈遲微或動氣內發腹寒畏冷或初起吐利手足逆冷或格陽躁狂六脈洪數無根此腎氣大虧坎中火衰宜益火之原人參八味湯主之舌形紫燥唇焦齒黑二便俱閉此為陰中兼陽可兼陽明以治凡舌形圓大胖嫩皆屬足少陰虛證不拘傷寒雜證如見舌色紫如豬肝枯晦絶無津液者此腎液已涸痢疾見此苔胃陰已竭必死傷寒更衣後舌苔頓去而見紫色如豬肝者此元氣下泄胃陰已絶不治如舌苔去而見淡紅有神者佳上録吳坤安舌診馬良伯云紫如豬肝色上罩浮滑苔者邪熱傳裡表邪未淨也既不可下又不可表治宜清中以解外若全舌紫光暗並無浮苔者陽極似陰也多不可救急下之間有得生者若酒後中寒及痰熱鬱久者往往亦見紫色苔葉桂云熱傳營血其人素有瘀陽宿血在胸膈中挾熱而搏其舌色必紫而暗暗即晦也捫之潮濕不幹以涼膈散加入散血之品如琥珀丹參桃仁丹皮等不爾瘀血與熱為伍阻遏正氣遂變如狂發狂之症乃其人胸膈中素有虛瘀與熱相搏宜犀地丹皮丹參赤芍鬱金花粉桃仁藕汁等味涼血化瘀若晦而乾者精血已枯邪熱乘之故為難治紫而腫大者酒毒攻心也於應用藥中急加黃連以清之深紫而乾涸者酒毒內蘊也紫如去膜豬腰者危險之候也舌斂束如荔子肉而絶無津液者亦危險之候也紫兼紅周澄之曰紅紫二舌均指舌質言之固無紅苔亦斷無紫苔其有見紫苔者必舌面己腐或兼微黑苔與赤紅相映而然也舌紫腫大而生大紅點者熱毒乘心也用導赤散加犀角黃連金汁治之或稍加大黃紫而青淡紫而帶青滑者寒證也或為直中陰經證治宜用溫淡紫帶青而濕潤又絆青黑筋者寒邪直中三陰經其身涼四肢厥冷脈沉緩或沉弦宜四逆湯理中湯小腹痛甚者回陽急救湯若舌不濕潤而乾枯乃是實熱青紫無苔多水滑潤而瘦小者傷寒直中腎肝陰經吳茱萸湯四逆湯溫之紫舌中心帶青或灰黑下證復急者熱傷血分也宜微下之紫兼藍淡紫轉藍者邪毒攻心也不治第八節焦紫肝經厥陰風木從火化故焦紫應肝舌苔焦紫起刺如楊梅狀者此陽邪熱毒已入肝臟之險症也大便閉者更衣丸下之金汁人中黃之類大清大解之舌苔兩旁有紅紫點者肝臟伏毒也大凶之症急用犀角尖人中黃透之解之第九節青滑肝經肝屬木故青色應肝舌苔青滑乃陰寒之象急宜四逆吳萸輩溫之外症若見面青唇紫囊縮厥逆筋急直視等症者厥陰敗症也不治凡舌苔紫焦如刺厥陰熱毒難治青滑厥陰寒邪吳萸溫之即愈舌邊色青者有瘀血鬱阻也有熱者用赤芍生瓦楞殼竹茹等治之舌青口燥漱水不欲咽唇痿胸滿無寒熱脈微大來遲腹不滿其人自言滿者內有瘀血也産母舌青而面赤者子已死於腹中也古方用黑神散下之或平胃散加芒硝下之更穩孕婦面舌俱青者母子俱死第十節藍色肝經藍者緑與青碧相合猶染色之三藍也馬良伯云有苔滑中見藍色苔者肝臟本色也邪熱傳入厥陰陰液受傷臟色外見深而滿舌者法在不治有微藍而不滿舌者法宜平肝熄風化毒舊法主用薑桂邪熱鴟張肝陰焦灼逼其本臟之色外現再用薑桂是抱薪救火也瘟疫及濕溫熱鬱不解亦有此舌感受不正之氣蒸熱不解也治宜芳香清泄滿舌滑膩中見藍色者濕痰痰飲為陰邪化熱之候法宜清化藍色苔者濕熱鬱蒸也舌見藍色者肺氣已絶肝木獨盛來侵土位也微藍者肺氣猶在可生深藍者必死宜大劑補肺脾而制肝木也藍色有苔者臟腑尚能生苔雖傷未甚猶可醫治光藍無苔者不論何脈皆屬氣血極虧勢必殞命孕婦舌見純藍者胎死腹中也宜即下之周澄之曰余嘗見癰厥及胃氣久痛者舌體全藍此亦瘀血在胃肝氣不舒也故青黑藍絳皆謂之濁皆竭血分須辨寒熱燥濕及痰血宿食燥屎癥塊而治之總以鬆動血分為主
