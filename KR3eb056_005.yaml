body:
  text: 卷五第二十五章灰舌類診斷鑑別法灰舌總論四舌鑑灰色舌苔有陰陽之異寒熱之辨直中陰濕即時舌便灰色而無積苔熱傳三陰必四五日表證罷而舌變灰色黑苔也有在根在尖在中之分亦有渾舌俱灰色者大抵傳經熱證則有灰黑乾薹法當攻下泄熱以存其陰若直中三陰見灰色無苔之舌又當溫經散寒以扶其陽更有蓄血證其人如狂或瞑目譫語亦有不狂不語不知人事而面黑舌灰者當分輕重以治其血切勿誤與冷水引領敗血入心而致不救也辨正灰色不列五色乃色不正也舌見灰色病概非輕均里證無表證有實熱證無虛寒證有邪熱傳裡證有時疫流行證鬱積停胸症蓄血如狂證其證不一而治法不外寒涼攻下寒涼以救真陰攻下以除穢毒在當用之時不得訾為戕伐焉舌鑑總論為熱傳三陰則有灰黑乾薹皆當攻下泄熱也是又謂直中三陰見灰黑無苔者當溫經散寒此說甚謬蓋灰黑與淡黑色頗相似惟灰則黑中帶紫淡則黑中帶白之殊耳若寒邪直中三陰者其舌淡黑無苔宜溫經散寒如熱邪直中三陰者其舌灰黑無苔宜三黃白虎大承氣湯並用連投失出失入其害非輕故望舌者小心謹慎焉石頑云灰黑舌者足三陰互病如以青黃和入黑中則為灰色也為痰水注於脈中致血微停瘀也然有傳經直中之殊蓋傳經熱邪始自白苔而黃黃而灰黑或生芒刺黑點不拘在根在尖俱宜攻下泄熱灰色之苔據化學原子分析之由炭尼酸與鐵化合而呈此灰色苔也灰舌證治圖說純灰色舌第九十二圖說全舌灰色或潤或燥舌鑑舌灰滑無苔者直中三陰而夾冷食也脈必沉細而遲不渴不煩者附子理中四逆湯酌治之次日舌變灰中有微黃色者生如漸漸灰黑干縮者必死吳坤安曰舌苔灰黑而滑潤此寒水侮土太陰中寒證也外證必腹痛吐利手足指冷六脈沉細宜理中湯甚則加附子辨正純灰舌全舌無苔而少津者乃火邪直中三陰證也外證或煩渴或二便閉或昏迷不省人事脈必散亂沉細伏代不等舍脈憑舌均屬裡證凡灰舌無表證治宜三黃白虎大承氣並用急連投服至灰色轉黃轉紅為止病則立愈舌鑑專指為寒用附子理中湯四逆湯安得不致漸漸灰縮乾黑而死乎張石頑云凡直中三陰始病無燥熱便見灰色舌潤無苔更不變別色此必內挾寒食及冷痰水飲或蓄血如狂等證當隨證治之又有感冒夾食屢經汗下消導二便已通而舌上灰黑未退或濕潤或雖不濕亦不幹燥者不可因其濕誤認為寒妄投姜附亦不可固其不潤誤與硝黃此固汗下過傷津液虛火上炎所致其脈必虛微少力治宜救陰為急雖無心悸脈代亦當用炙甘草湯主之內有生地阿膠麻仁麥冬之甘潤可以滋陰潤燥蓋陽邪亢盛則用硝黃以救陰陰血枯涸則宜生地以滋陰可不辨乎灰尖舌第九十三圖說舌尖灰黑中漸漸紅至根舌鑑已經汗解舌尖見灰色者宿食在胃口或又傷飲食熱邪盛膈於內也調胃承氣湯下之此釜底抽薪法也辨正灰黑尖舌傷寒已經汗解而見舌尖灰黑有宿食未消或又傷飲食熱邪復盛之故也以調胃承氣下之舌鑑是也若雜病裡熱見此舌宜大承氣湯重加黃連灰多黃少舌第九十四圖說中尖灰多惟根黃色苔舌鑑舌灰色而根黃乃熱傳厥陰膈熱盛而胃有食停也調胃承氣湯下之苔去後發熱下利汗出不止者死正氣脫也辨正灰黑根黃舌如苔厚乾燥刮之不淨者乃熱入厥陰臟腑實熱而脾胃之火尤熾也其證多胃有積滯二便閉發燒熱大渴消水自汗不止出至頸以下不出者諸病急宜十全苦寒救補湯以收汗服至二便利則熱渴自汗必止待舌色明淨則愈舌鑑謂傷寒六七日不利便發熱而渴汗出不止者正氣脫必死其說未盡然也心灰弦黃舌第九十五圖說舌心中根灰色邊弦皆淡黃舌鑑灰舌中邊有微黃色者是陰回陽復胃土有氣即宜調理胃氣不可輕忽否則不治當隨現症治中虛邪少者補中益氣湯加溫暖藥治之辨正心灰弦黃舌臟腑本熱疫毒復中脾胃也宜三黃大承氣急下之則愈或傷寒證誤服補中藥燥傷脾胃者宜大柴胡湯下之如下見黑糞急以破格苦寒救補湯不次急投至舌淨必愈舌鑑云否則不治者誤也灰根中赤黃尖舌第九十六圖說舌根灰色中紅尖黃色舌鑑灰根黃尖中赤舌乃腸胃燥熱真水涸竭之候必大渴譫語五六日不大便轉矢氣者急下以存真陰如溫病熱病惡寒脈浮者涼膈散雙解散兩下之辨正灰根黃尖中赤舌乃腸胃燥熱也如大渴譫語五六日不大便者以大承氣湯急下之如瘟疫證熱證惡寒脈浮者酌用涼膈散雙解散舌鑑之說是也灰色重暈舌第九十七圖說淡灰舌中起灰黑重暈一二層或灰舌黑暈舌鑑此瘟疫熱毒傳遍三陰也熱毒傳內一次舌增灰暈一層最危之症急用涼膈散或雙解散黃連解毒湯大承氣湯酌用之一暈尚輕二暈為重三暈必死亦有橫紋二三層者與此重暈不殊舌辨云如有表邪先宜解表表邪盡宜再攻裡下黃糞者生下黑糞者危辨正舌鑑之論尚合理惟熱毒傳裡已深涼膈雙解二方嫌有表藥亦不宜解毒湯太輕大承氣僅能利下而不能涼透臟腑之熱不如用十全苦寒救補湯四倍加生石膏不次急投服至灰暈退淨為止雖見二三重暈均能救治周澂之云此由病久寒熱互結夙有痰飲蓄血又新加停滯也若因內傳一次即見一重於理難通或者邪氣化寒化熱化燥化濕轉變一次即增一重又或傷寒傷熱傷食傷飲多傷一次即增一重也又有灰舌黑暈舌乃熱毒中臟腑大氣交攻故令舌灰色內兼黑暈為時疫熱毒內中脾胃逼及於腎多見此舌傷寒救治失宜邪陷厥陰亦有此舌不論何證何脈將十全苦寒救補湯分為二劑先服大承氣湯後服三黃白虎湯等藥循環急投至黑暈灰苔漸退則愈若用酒泡大黃舊說有此法則誤矣凡治實熱及疫證宜用生大黃專瀉陽明之火治陰虛證宜酒浸九蒸九曬之熟大黃治傷寒證宜酒洗大黃以一洗為度若炮製太過失其生氣凝而不走潤而不涼投之實熱人必將陽分之病引入陰分更難治也附灰暈微紅舌圖說舌邊圍灰黑暈中心有紅暈者舌鑑此邪熱入心包之候灼爍血分也脈必數大症必昏妄宜涼膈散承氣湯下之正義云舌苔黑暈二重而中心紅者陽明傳厥陰熱入心包也大承氣湯下之辨正凡黑舌偶有寒者紅舌則無寒證故黑暈間紅可斷為熱也灰黑沿紅舌第九十八圖說舌心灰黑邊沿與尖皆紅舌鑑此乃傷寒化火傳入陽明而逼太陽宜承氣湯下三四次方退若五六次下之不退者不治辨正灰黑沿紅舌乃脾胃實火鬱結不得流通也傷寒化火傳入陽明而逼太陽者亦有之不論何證何脈大承氣湯不次急投服至灰黑色退淨則必愈舌鑑云三四次下之方退若五六次下之不退不治者此未徹底明白之談也灰中帶紫舌第九十九圖說邊圍淡灰中根淡紫舌鑑舌邊灰色舌中淡紫時時自齧其舌尖為夾陰證也乃少陰厥氣上逆不自知其痛苦也不治辨正淡灰中紫舌瘟疫中藏者居多傷寒邪傳手少陰熱逼心營者亦有之其症多卒然倒地不省人事或狂妄昏迷或疾呼大叫或自齧舌尖或拍胸嗟恨不等治宜三黃瀉心湯加黃柏連翹木香甘草不次急投服至舌色漸淨則必愈若稍涉遲疑則淡灰轉黑淡紫轉蘭為邪毒攻心己甚而傷腐脾胃則不治矣舌鑑云自齧舌尖少陰厥氣逆上非藥可治者蓋誤於遲疑耳灰中紅底舌第一百無圖圖說全舌紅底中央灰色舌鑑凡灰色見舌中央而消渴氣上衝心飢不欲食食即吐蛔者此熱傳厥陰寒傷胃口之候烏梅丸主之舌辨云下之利不止六七日來又當入府胃虛客熱飢不欲食蛔聞食則出而吐年壯者生老弱者恐不治也辨正灰中舌乃傷寒證熱邪傳入厥陰舌中央灰色其症消渴氣上衝心飢不欲食食則吐蛔者宜烏梅丸烏梅細辛乾薑當歸黃連附子川椒桂枝人參黃柏此丸能治寒痢舌鑑是也若雜病見此舌為實熱里證宜大承氣與白虎湯合用灰苔黑滑點舌第一百零一圖說舌淡灰色中間有滑苔點子四五點深黑如墨汁舌鑑此邪熱傳裡內夾宿食不化也大柴胡湯加乾薑芒硝少許下之舌辨云余見一人有此舌墨滑數點余用大柴胡湯加減下之次早則舌滑俱無而見少微紅色後調理而愈辨正灰中黑滑舌淡淡灰色中間有滑苔四五點如墨汁此熱邪傳裡而腹有宿食未化宜大柴胡湯舌鑑是也微灰生刺舌第一百零二圖說全舌微灰燥生芒刺舌鑑此乃疫邪實熱中脾胃也宜三消飲老人生脈散主之辨正微灰生刺舌乃疫邪中脾胃居多或實熱人誤服溫補辛燥藥所致不論老少何證何脈見此舌者即宜十全苦寒救補湯分兩劑先大承氣後三黃白虎不次急投至苔刺退盡乃愈舌鑑用三消飲則兼有表藥灰舌色屬裡證不宜表藥如羌葛柴胡溫燥皆忌檳榔草果薑棗等溫藥皆忌老人用生脈散人參麥冬五味子甘補酸斂熱邪不解矣皆誤不可從也灰尖干刺舌第一百零三圖說舌尖灰黑乾燥有刺舌鑑此乃熱極津枯得病後又加飲食之故是宿食不消也雖症見耳聾脅痛發熱口苦不得用小柴胡必用大柴胡湯或調胃承氣湯下之或解毒湯加消導藥方可取效辨正如舌鑑治法甚是全灰干刺舌第一百零四無圖圖說全舌灰黑滿生干刺舌鑑灰黑舌中又有干刺滿舌而見咽乾口燥喘滿昏妄乃邪熱結於手足少陰腎水涸極之候不下必死調胃承氣下之又云然必待其轉矢氣者方可下若下之早令人小便難辨正灰黑干刺舌傷寒邪傳少陰口燥咽乾症偶見此舌宜大承氣湯下之或臟腑實熱己極煩躁大渴胸中脹滿肉痛飲食不進一食即吐常作乾嘔等症宜十全苦寒救補湯不次急投服至灰黑色退淨則愈舌鑑必待其轉矢氣乃下之遲疑誤人矣傷寒陽明篇云少與承氣湯腹中轉矢氣者有燥屎也乃可攻之彼以熱邪初傳陽陰故用探試之法今見灰黑舌且有干刺是熱邪已結陰分無可疑矣若灰黑舌起裂紋者血液灼枯也內熱失治邪火毒熾者有之宜增液承氣湯鮮生地黑無參麥冬小枳實生錦紋芒硝急下以救真陰則裂紋自平附灰黑裂紋舌無圖圖說灰黑苔乾燥滿舌裂紋舌鑑舌見灰黑起裂紋是手足太陰二經邪毒至甚也涼膈散調胃承氣湯均可酌下十中可救二三下後渴不止熱不退者死辨正灰黑苔乾裂紋舌此臟腑熱極又因誤食熱物或誤服溫補辛燥藥灼傷真陰所致凡裂紋者多固誤食溫燥之故治宜破格十全苦寒救補湯不次急投服至灰黑色退紋裂自平則立愈如舌鑑僅用涼膈散調胃承氣湯下之熱不退則不敢再用寒涼遂歸於不治姑息貽禍也灰短硬捲舌第一百零五圖說舌灰黑而燥卷短而硬舌鑑短硬或捲舌凡舌短由於生就者乃初生時將含口之血吞下之故無關壽夭若因病縮短不能伸出者危證也傷寒邪陷三陰及實熱證火逼三陰皆能致舌短不論何脈當辨其苔色如確是內熱則宜大承氣湯急下以救其陰若少陰自絕證則不治凡舌硬者即重舌木舌腫舌大舌強舌之類臟腑俱熱而心經尤熱也宜十全苦寒救補湯加羚羊角三錢不次急投則愈附孕婦卷短舌無圖圖說舌乾卷短或黃黑刺裂舌鑑孕婦傷寒發熱至久熱深熱極舌乾卷短或黃黑刺裂乃里證至急不下則熱邪傷胎下之則危在頃刻如無譫妄直視循衣撮空等危證下之或可救十中之一二辨正孕婦卷短舌面黑而舌乾卷短或黃黑刺裂乃傷寒化火傳足厥陰也宜大承氣湯加元明粉急瀉之則愈舌鑑謂不瀉則熱邪傷胎下之則危在頃刻此見識未透耳若明於醫者除暴即以安良無多疑慮第二十六章紅舌類診斷鑑別法紅舌總論五舌鑑紅色者舌之正色也舌屬南方火其色本當紅第紅光外露不能內藏斯為有病之舌夫紅舌是少陰伏熱蓄於心胃乃自里而達於表也仲景云冬傷於寒至春變為溫病至夏變為熱病故舌本煊紅而面色亦赤至溫疫之候一方之內老幼皆相似者舌亦正赤而加以積苔也如或失治則蘊熱內蒸豈但舌赤而已必舌瘡疳腐癟細長短病斯劇矣然病有輕重舌有微甚且舌有根尖中下左右種種之不同皆瘟毒蘊熱之所化以見病之淺深輕重有殊治法亦各不相侔當清化者內解其毒宜攻下者搜滌其邪縱使元陰元氣無傷庶不失中和之治若論攻邪無過達源解毒梔子淡豉三黃石膏大小承氣皆是至於養正又須滋陰養營六味七味保元左歸生脈無疑矣辨正全舌淡紅不淺不深者平人也有所偏則為病表裡虛實熱證皆有紅舌惟寒證無此舌如全舌無苔色淺紅者氣血虛也色深紅者氣血熱也色赤紅者臟腑俱熱也色紫紅瘀紅者臟腑熱極也中時疫者有之誤服溫補者有之色鮮紅無苔無點無津津出舌底無液液出舌面者陰虛火炎也有苔可作熱論虛極不能生苔色灼紅無苔無點而膠乾者陰虛水涸也色絳紅無苔無點光亮如錢或半舌薄小而有直紋或有泛漲而似膠非膠或無津液而咽乾帶澀不等紅光不活絛色難名如豬腰將腐難以言狀水涸火炎陰虛已極也瘦人多火偏於實熱醫者拘於外貌輒指為虛誤服溫補灼傷真陰或誤服滋補名為滋陰降火實則膩澀酸斂膠黏實熱引入陰分俾鬱火漸耗真陰亦絳舌而為陰虛難療矣其初必有黃苔醫者不知久之內傷已甚不能顯苔而變絳色矣凡陰虛火旺之病自生者極少多由醫家誤服補藥逼成也不論病狀如何見絳色舌則不吉舌鑑引仲景云冬傷於寒春變為溫病至夏變為熱病故舌紅面赤此專言瘟疫與傷寒也而紅舌各病實非瘟疫傷寒所可賅括勿泥古以致誤見圖十六十七紅舌證治圖說純紅舌第一百零六圖說紅赤如瘀血之色不雜他苔舌鑑乃溫熱內蓄自里而達於表也宜敗毒散去防風加淡豆豉蔥白或葛根解肌湯炳章按暑證多見此舌宜鮮地梔翹豆豉黃連黃芩知母青蒿薄荷益元散之類不宜此法辨正純紅舌非純而不雜即瘀血之色也臟腑極熱者中時疫者誤服溫補者皆有之宜三黃白虎湯加連翹或大小承氣湯等藥酌用此舌亦有表證者則兩臉周身必發熱頭暈目眩乍寒乍熱脈浮數邪熱在太陽也宜用薄荷荊芥葛根竹葉生甘草等以涼散表邪不可遽用寒涼攻下舌鑑專指表證用人參敗毒散人參羌活獨活柴胡前胡桔梗川芎枳殼茯苓甘草余恪守家訓不敢妄用人參柴胡以升燥少陽經及羌獨活逼燥諸經必須風邪深入方可用若熱邪在太陽用之適引邪入他經光紅柔嫩舌第一百零七無圖圖說全舌鮮紅柔嫩光而無津液或謂鏡面舌舌鑑舌色光紅柔嫩無津良由汗下太過元精耗極於內宜生脈保元清補之張石頑云光紅舌柔嫩如新生望之似潤而燥涸殆甚者為甚行汗下津液竭也多不治宜生脈散合三白湯主之更有病後絳舌如錢發亮而光或舌底咽乾而不飲涼此腎虧已極宜大劑六味地黃湯投之以救其津液凡少陰虛證舌形必圓大胖嫩吳坤安曰如舌形胖嫩而色淡紅者外證必見躁擾不寧六脈遲微或動氣內發腹寒畏冷或初起吐利手足逆冷或格陽躁狂六脈洪數無根此腎氣大虧宜人參八味湯主之辨正紅嫩無津舌全舌鮮紅柔嫩而無津液望之似潤而舌燥涸者乃陰虛火旺也宜十全甘寒救補湯常服之舊說用生脈散人參三白湯人參澤瀉茯苓白朮白芍薑棗醫家積弊誤人不少五味白芍酸斂人參燥肺苓朮薑棗皆溫補以此治陰虛人則腎火愈旺真水益虧矣若舌絳而光亮者胃陰亡也急用甘寒濡潤之品如炙甘草湯去薑桂加鮮石斛蔗漿麥冬葉天士云舌淡紅無色者或干而色不榮者當是胃津傷而氣無化液也宜用炙甘草湯不可用寒涼藥章虛谷云淡紅無色心脾氣血素虛也更加干而色不榮胃中津氣亦亡也故不可用苦寒之藥以炙甘草湯養營血以通經脈其邪自可漸去矣薛生白雲舌光如鏡外證口大渴胸悶欲絕乾嘔不止此乃胃液受劫膽火上衝宜西瓜汁金汁水鮮生地汁甘蔗汁磨服木香鬱金香附烏藥等味章虛谷云此營陰素虧肝火素旺者肝火乘胃耗其津液故舌先無苔實津桔非濁壅胸悶欲絕者肝膽氣上逆也敵以諸汁滋胃液辛香散逆氣凡治陰虛氣滯者可以仿此用藥此證近時甚多特附錄之紅中微黃滑舌第一百零八圖說淡紅舌中見黃滑薄苔舌鑑紅中微黃滑舌乃傷寒五七日舌中見黃苔則為陽明證熱勢初盛也如脈沉實譫語雖苔滑亦宜大柴胡湯若苔乾燥者內邪熱盛也急以大承氣湯下之辨正凡傷寒見此舌舌鑑治法甚是如無病人有此舌是臟腑本熱而飲食復留濕熱也行動即消化可勿用藥吳坤安云若舌質絳黏膩苔上浮暑濕釀蒸痰濁蒙閉心包也急用芳香逐穢宣竅滌痰之品如西黃至寶丹鮮菖蒲天竺黃川貝母之類若舌絳中仍帶黃白等苔是邪在營衛之間當用犀羚以透營熱荊薄以散衛分表邪兩解以和之可也章虛谷云若其舌四邊紅而不絳中兼黃白苔而渴此熱不在血分尚在上焦氣分當用涼膈散清之勿用血藥引入血分以滋膩難散若舌絳望之若干以手捫之原有津液此津虧濕熱熏蒸胃中濁氣成痰蒙閉心包宜用宣竅滌痰等法若舌苔白底色絳者熱被濕遏不得外透也用犀角滑石等藥以泄濕透熱紅根黃尖舌第一百零九圖說舌根紅赤尖苔黃色舌鑑乃濕熱上乘心位溫熱初起多見此舌宜銀翹散涼膈散酌治之辨正舌鑑法甚是當再與黃苔類第四十一五十一舌參看紅中黑斑舌第一百十圖說全舌純紅中有小黑斑點舌鑑乃瘟疫熱毒陷於陽明也熱極則斑黃狂亂身上亦有紅紫斑者解毒湯合調胃承氣湯急下之遲則不救正義云舌紅而中見紫斑者將發斑也元參升麻葛根湯斑已見者化斑湯舌淡紅而中見紅赤點者將發黃也茵陳五苓湯辨正生斑舌全舌純紅而有小黑斑點者臟腑皆熱也傷寒邪傳陽明府失治以致邪火逼入三陰證或疫毒直中三陰證或實熱人誤用辛溫藥燥傷三陰證均有之不論老少何病何脈見此舌即宜十全苦寒救補湯倍加犀角尖連服必愈正義用元參升麻葛根湯及化斑湯人參生石膏知母生甘草誤人多矣非陰火何可用元參非表證何可用升麻葛根熱毒正旺時以補邪火吾願後起學者勿再泥古不化甘受其誤矣章虛谷云舌紅極而有紫斑及紅斑且周身亦發斑者此陽毒入心人參白虎湯加犀角黃連治之吳坤安云若舌上見赤斑而身上亦見赤斑丹疹者此邪在營分血分舌質亦必絳赤宜犀角鮮大青連翹鮮生地人中黃銀花等透營解毒大忌升葛足經之藥若斑疹發於氣分其色淡紅而白者名曰白㾦其舌苔亦白宜葛根防風蟬衣荊芥連翹薄荷牛蒡等松肌達表此斑疹㾦各證治法也紅內雙灰干舌第一百十一圖說全舌紅色兩畔夾兩路紅灰苔舌鑑乃疫熱內熾夾宿食不化也故身熱譫語脈滑者一下即安如脈澀下黑糞者死張石頑云紅中夾兩路灰色苔者溫熱而夾寒食也涼膈散加消導藥一二味辨正紅中雙灰干舌乃臟腑皆熱而脾胃尤亟也傷寒邪入胃府發熱譫語循衣摸床神昏撮空者有此舌實熱人飲食鬱結者亦有之不論何脈宜十全苦寒救補湯分二劑先大承氣湯後三黃白虎不次急投循環速服將黑糞下淨則愈舌鑑謂下黑糞者死謬甚紅內紅星舌第一百十二圖說純紅舌中滿布深紅紅星如珠鼓起舌鑑純紅舌中紅星滿布如瘡如瘰乃溫熱傷於心脾也盦而將欲發黃宜茵陳蒿湯合五苓散主之石頑云紅舌中紅珠鼓起如紅星者心包絡之火上炎也涼膈散主之辨正紅星舌乃臟腑血分皆熱也中燥火者中疫毒者實熱人誤服溫補者皆有之其病多大熱大渴心胸脹滿皮膚燥癢日夜不能眠大便閉小便澀不等宜十全苦寒救補湯急投則愈舌鑑指為傷寒將發黃用茵陳蒿湯合五苓散誤也按熱毒傳裡茵陳蒿湯不濟事五苓散內有苓朮肉桂皆不宜於熱證吳坤安云濕溫證舌現紅星點點者此熱毒乘心必神昏譫語宜苦寒之品清之狂亂者非川連金汁水不解紅內白泡舌第一百十三圖說舌紅短而起白泡舌鑑口瘡舌短而起白泡聲啞咽乾煩躁者乃瘟疫強汗傷其津液傷寒未汗遏熱傷經瘟疫黃連犀角湯清之傷寒三黃石膏湯汗之張石頑云舌紅短起白泡者炎氣燔灼也固浮淺不入血絡故起白泡宜三黃石膏湯去麻黃辨正舌鑑治法亦是紅內紫瘡舌第一百十四圖說純紅舌上起紫色瘡舌鑑瘟疫多此舌乃疫毒上熏肺胃受病故煩躁作渴咳嗽多痰宜解毒湯並益元散加元參薄荷尺無脈者必死戰慄者亦死正義云舌紅而尖起紫泡者此心經熱毒也黃連瀉心湯張石頑云紅舌起紫瘡者此火氣鬱伏也宜解毒湯辨正紅色紫瘡舌瘡在心肺經位者乃時疫毒中心肺或楊梅毒注心肺皆有之宜十全苦寒救補湯倍加生石膏黃連不次急投至瘡平則愈舌鑑謂疫氣煩渴或咳用解毒湯並益元散加元參薄荷此時非大承氣不能驅毒非白虎不能救陰解毒益元散輕不濟事元參為陰分涼藥病屬陽火而反瀉陰火則無益有損薄荷亦不對症尺脈無則死病重脈亂當舍脈憑舌皆不明治法之論也深紅蟲碎舌第一百十五圖說深紅舌中更有紅點坑爛如蟲蝕之狀舌鑑乃水火不能既濟熱毒熾盛於中也不拘日數宜小承氣湯下之不退調胃承氣湯下之正義云舌紅而碎爛如蟲蝕者少陰瘟毒也小承氣湯二三下可愈張石頑曰紅苔紅點坑爛者濕熱入脾也小承氣湯加芩連半夏辨正蟲碎舌紅舌中更有紅點如蟲碎之狀者熱毒熾盛也宜小承氣湯下之不退再用大承氣湯下之舌鑑之說是也然不如將十全苦寒救補湯分為大承氣三黃白虎等二劑循環連服以舌淨為度吳坤安云舌絳碎而有黃白腐點者此濕熱邪毒蘊久不宜蒸腐氣血化為瘀濁得風木之氣化而成蟲也葉桂曰舌絳而有碎點黃白者當生疳也黃連金汁皆可加入紅色人字紋舌第一百十六圖說深紅舌中有裂紋如人字川字爻字者舌鑑相火上乘君位致令舌紅燥而紋裂作痛也宜黃連解毒湯加麥冬以寒潤之紅極而紋裂者燥熱入肝也大承氣加柴胡白芍甚則加芩連如舌色赤紅苔厚膩而裂紋者臟腑實熱也宜十全苦寒救補湯倍加犀角如灼紅色即比絳色略鮮無苔無點而裂紋者陰虛火炎也黃連解毒湯加麥冬可也陽火陽藥陰火陰藥誤投必敗舌深紅而碎裂如人字紋者乃陽明熱毒熏蒸於膈上傳熱於少陰心也涼膈散加白蜜以潤之如內實腹脹口渴而轉矢氣者大承氣湯合解毒湯下之若舌淡紅而碎裂如川字紋者外症神昏自利用導赤散加黃連後再用生脈散加黃連棗仁辨正人裂舌紅色中有裂紋如人字者君火燔灼熱毒炎上故發裂也如渴甚燥熱者宜大承氣湯下之舌鑑亦是然不論白黃紅黑各舌若中有裂紋如川字爻字人字不等或裂直槽者多有實熱人誤服溫補藥以致熱火在臟腑相爭大承氣雖能下毒而未能涼沁腸胃宜以白虎湯與承氣循環服不知者以為太重實則力求周密之策也凡治實熱內逼之症皆宜如此紅尖出血舌第一百十七圖說全舌紅絳色舌尖出血如濺舌鑑邪熱內逼心臟心血不藏故舌尖出血如濺也宜犀角地黃湯加大黃黃連治之正義云舌紅而出血如衄此熱傷心包也犀角地黃湯或回生丸林慎庵將前方再加黃連蒲黃炭更效辨正紅尖出血舌乃手少陰心經邪熱壅盛所致宜三黃瀉心湯加川柏連翹生地各三錢真犀角尖四錢不次急投則愈舌鑑論證尚合用藥嫌雜如犀角地黃湯黑犀角鮮生地西赤芍粉丹皮內之丹皮辛攛上升皆於邪盛時不宜紅細枯長舌第一百十八圖說舌色乾紅枯而細長舌鑑乃少陰之氣絕於內石頑云乾紅舌忽瘦而長為心絕也而不上於舌也雖無危症脈若衰絕朝夕恐難保矣吳坤安云舌形紫晦如豬肝色絕無津液者為枯不治辨正紅細枯長舌如絳紅無苔乾枯紅長而有直紋透舌尖者此陰虧已甚手少陰之氣已絕於內不能上通舌根故不顯苔也命絕難治即用滋陰降火亦為敷衍而已若赤紫紅色中間尚帶顯苔膩者黃黑不等雖有直紋透尖亦為臟腑實熱證不作陰虛宜三黃白虎大承氣湯合投可愈倘用二地二冬等滋膩藥引邪入陰分即難治矣辨之詳慎方不誤入紅脹出口舌第一百十九圖說舌紅長大脹出口外不餂者舌鑑乃熱毒乘心舌本弛長也內服三黃瀉心湯外用銀針砭去惡血從舌之脾經部位輕以出毒若誤治傷筋絡則血出不止亦足誤人以梅冰片和人中黃末摻於舌上即愈辨正舌鑑治法甚善如不針則合用大承氣三黃瀉心湯不次急投必大瀉頻瀉乃愈紅餂舌第一百二十無圖圖說全舌紫紅頻出口外餂至鼻尖上下或口角左右舌鑑乃熱傷心臟熱極生風舌故動搖餂出時弄不止也急用解毒湯加鮮生地效則生不效則死正義云舌紅而吐弄者此熱在心脾也安神湯主之辨正紅餂舌天行燥火時疫症多有之全舌必紫而兼瘀臟腑為疫毒內攻逼迫心經所以舌長出口外時弄不止或餂上下唇左右口角或餂至鼻尖不等宜十全苦寒救補湯倍加川連生石膏不次即投至舌收回乃愈知治法者可以十全否則十無一生舌鑑用解毒湯加生地必不效也紅戰舌第一百二十一無圖圖說全舌深紅或淡紅蠕蠕瞤動於口中舌鑑此因汗多亡陽心陽不振故漏風心悸而舌戰也宜十全大補湯大建中湯酌用正義云舌淡紅而戰動難言者此心脾虛也汗多亡陽者有之應用方中多加人參可救辨正紅戰舌顫掉不安蠕蠕微動也深紅赤紅而戰者宜三黃石膏等湯紫紅瘀紅而戰者宜三黃白虎大承氣湯淡紅而戰者宜十全大補湯黨參白朮茯苓甘草當歸黃耆川芎白芍熟地肉桂鮮紅灼紅而戰者宜六味地黃湯熟地萸肉丹皮懷藥茯苓澤瀉此舌虛火實火皆有之誤治即壞舌鑑指為汗多亡陽或漏風所致且不詳辨而概用溫補謬也紅痿舌第一百二十二無圖圖說舌本痿軟不能舉動色淡紅深紅赤紅灼紅不等故不能列圖舌鑑舌本痿軟不能轉動此心臟受傷心氣不振也當參脈證施治然亦十難救一也正義云紅而痿軟不能言者此心脾虛極或有痰也死不治張石頑云舌痿不能轉動者肝絕也不治辨正痿者軟而不能動也淡紅痿者宜補氣血深紅痿者宜涼氣血赤紅痿者宜清涼臟腑紫紅痿者宜寒涼臟腑並攻瀉之鮮紅灼紅痿者宜滋陰降火惟絳紅痿者為陰虧已極無藥可救舌鑑但云紅痿不治而不分類謬甚葉天士云其有雖絳而不鮮乾枯而痿者腎陰涸也急以阿膠雞子黃天冬生地等救之緩則恐涸疾而無救矣吳坤安云舌形斂縮伸不過齒紫絳不鮮者為痿為肝腎陰液枯涸而致若舌色紅絳而光其色鮮明者屬胃陰乾涸猶可滋養胃陰如鮮生地鮮石斛鮮大青葉蔗漿梨汁之類紅硬舌第一百二十三無圖圖說全舌深紅或紫紅舌根強硬不語舌鑑邪結咽喉舌根強硬失音不語死證也脈若有神外無危證者急用清心降火兼去風痰藥亦有得生者正義云舌紅而強硬失音者死候也有痰者舌必灰胖而硬宜膽星橘紅豐夏菖蒲竹茹主之內實者可下之大抵溫熱暑邪舌硬不語屬下證為多雜證不語同中風治用黃耆防風湯或人參湯加竹瀝辨正紅硬臟腑實熱已極又為燥火浸淫或誤服溫藥則舌根強硬不能言語或時疫直中三陰者亦有之均里證實熱證無表證虛寒證宜十全苦寒救補湯不次急投必愈若舌尖能動而舌根胖硬不能言語此痰阻舌根有內風上逆也宜開降豁痰中加辛涼咸潤以熄內風也脾腎之脈皆連舌本亦有脾腎氣敗而舌短硬不能伸者其形貌面色亦必枯瘁多為死證也厥陰舌第一百二十四圖說全舌純紅或紫紅內有黑絲紋滿布舌鑑厥陰舌舊圖全舌純紅或紫紅內有黑絲紋環其後方正而不達邊余以為凡舌色純紅兼顯黑絲必非寒證當是熱氣結於足少陰宜用寒涼藥舌鑑指為陰毒中厥陰以理中四逆湯溫之未知合否寒涼之判吉凶所繫余未見此舌不敢妄斷請識者辨之參辨正孕婦純赤舌第一百二十五無圖圖說全舌純赤若有兼色當參前各證看法舌鑑孕婦傷寒濕熱而見面舌俱赤宜隨證汗下子母無虞若傷寒面白㿠白而舌赤者母氣素虛宜溫中如薑桂等溫暖藥治之桂不墜胎安常所言是也若面黑舌赤亦非吉兆若臨分娩則子得生而母當殞也五六個月之胎豈能生乎亦必同死舌辨云母面白如膏舌赤似朱此心熱乘肺熱雖在裡固初感寒邪尚輕宜小柴胡湯加減以平其熱若面黃舌赤者面黃有淺深舌赤有輕重若感邪之多少也宜清熱安胎如黃芩白朮梔子等藥治之則安辨正孕婦純赤舌凡孕婦發溫舌色純赤此陰血素虛少陰伏熱外發臟腑俱熱也必發斑當養陰泄熱以安胎實熱盛者宜三黃白虎湯並投則子母俱安萬無可慮舌鑑泥定傷寒又指面白為氣虛而投薑桂竊慮如火益熱有損無益豈可不辨乎第二十七章紫舌類診斷鑑別法紫舌總論六舌鑑紫色舌苔者乃酒後傷寒也或由大醉露臥當風取涼或涼飲停積不散或已病仍飲不節或感冒不即解散妄用薑蔥發汗汗雖出而酒熱留於心包伏於經絡血氣不能上榮於舌或酒後雄飲冰水致令酒之餘毒沖行經絡酒味入心汗雖己出心包絡內還有酒毒不盡皆能令舌現紫色且又有微白苔膜也苔之初結舌之根尖左右長短厚薄之變紅黃白黑之色涎滑乾焦之異刺瘰隔瓣之殊種種不同當參脈證調治之周澂之云推其所以皆由寒氣束於肌表酒力不能外行而內積於胃與包絡也辨正紫見全舌臟腑皆熱極也紫之微甚亦熱毒之微甚也見於舌之某部即某經之鬱熱也傷寒邪化火者中時疫者內熱熏蒸者誤服溫補者酒食濕滯者皆有紫舌有表裡實熱證無虛寒證若淡紫中夾別色則亦有虛寒證矣凡辨舌無苔則論舌之本色有苔則憑舌之見色參之望問以判表裡寒熱虛實之真假雖不中不遠矣餘數十年來但知有紫色舌未聞有紫苔舌但見紫舌為各種熱證未聞概屬酒後傷寒舌鑑專指酒後傷寒未免拘執見圖十八紫舌證治圖說純紫苔舌第一百二十六圖說全舌渾紫舌上無浮苔舌鑑舌見渾紫舌者乃酒後傷寒舌也或傷寒在表不用藥而以蔥酒發汗或未汗又飲燒酒取汗致令酒毒入心心含酒毒故舌見紫舌況汗未盡邪熱至甚又加酒毒愈助其熱直升麻葛根湯加石膏滑石治之解酒毒又解其表也若心中煩或懊憹不安者梔子豉湯主之否則發斑身有斑者黃連化斑湯加葛根青黛辨正舌鑑治法尚是然紫舌非專屬傷寒也如傷寒寒邪化火或中時疫毒或誤服溫補藥或內熱鬱結諸症皆有之均宜十全苦寒救補湯急服紫上白苔舌第一百二十七圖說全舌紫舌中心白苔上罩舌鑑舌紫而中心見白滑苔者此醉後傷寒或誤飲冷酒停積不散亦令人頭痛身熱惡寒是酒毒在太陽也有表者葛根湯加生石膏或兼服葛花解醒湯皆治之舌辨用麻黃葛根湯以取汗辨正紫上白滑舌此臟腑本熱或因感冒時邪身熱惡寒頭痛者宜紫蘇薄荷荊芥甘草等輕表之若白苔不滑而厚膩則實熱內蓄也如無表證宜苦寒清裡藥舌鑑謂酒後感寒或誤飲冷酒所致亦令人身熱頭痛惡寒隨證解表可也紫上黃苔濕潤舌第一百二十八圖說外淡青紫色中有黃滑濕潤苔舌鑑此食填胃口寒傷太陰也心下必痛小承氣湯加附子或黃龍湯主之張石頑云若舌質青紫苔且黃厚甚則裂紋但覺口燥舌仍不幹者此陰證夾食也周澂之云青紫是有瘀血非陰證也濕是邪蘊結深陷於血分也脈或沉細而伏或虛大而澀按其心下或臍旁硬痛此結痰與瘀血相挾而間有矢氣者即宜大承氣另煎生附子佐大黃下之若脈虛者黃龍湯主之熱極煩躁者更加鮮生地麥冬夏月尤宜若冬時陰證夾食夾痰瘀者舌上苔黃必不燥宜附子理中合承氣下之時常矢氣非有宿食燥矢即為氣脫之候不可救藥也總之凡中宮有痰飲水血者舌多不燥不可因其不燥而延緩時日致誤也辨正紫上黃苔濕潤舌外淡青紫色而中有苔濕潤而滑此食傷太陰也脈必沉細而心下臍旁按之必硬痛或轉矢氣者小承氣加附子或黃龍湯舌鑑尚是而石頑治法更備余意熱邪既已深入無須溫以附子表以桔梗補以參薑棗原本專指傷寒證之傷寒者若雜病里證有黃苔必熱宜下而兼涼紫上黃苔乾燥舌第一百二十九圖說外紫干色中有黃燥苔舌鑑乃嗜酒食辛之人又傷寒邪至四五日舌紫上積干黃苔者是濕火內盛宜大承氣湯加芩連葛根如表證未盡用大柴胡湯如邪在半表半裡其舌色微黃者必有脅痛耳聾止可用小柴胡湯內少加鮮生地之類辨正紫上黃苔乾燥舌乃臟腑素熱脾胃尤甚或嗜酒積熱或燥火入里或誤服溫補所致皆實熱里證宜十全苦寒救補湯對症加減連服則愈舌鑑用大承氣湯近是用大柴胡湯則非也淡紫灰心舌第一百三十圖說外邊皆淡紫舌心帶灰或青黑不燥舌鑑淡紫舌中心生薄青紫苔或略帶灰黑而不燥不濕此濕中生熱熱傷血分也下證復急者犀角地黃湯加酒大黃微利之辨正淡紫灰心舌或青黑不燥不濕者為傷寒邪傷血分雖有下證只宜犀角地黃湯犀角鮮生地丹皮西赤芍加酒洗大黃微利之舌鑑近是淡紫帶青舌第一百三十一圖說全舌淡紫帶青滑潤無苔舌質瘦小舌鑑舌色青滑乃直中腎肝陰證陰寒之象急宜吳茱萸湯四逆湯溫之再加化痰之品外證若見面青唇紫男子囊縮婦人乳縮厥逆筋急直視等症厥陰敗症也不治辨正淡紫帶青舌青紫無苔多津滑潤而瘦小為傷寒直中腎肝陰證宜吳茱萸湯吳茱萸人參薑棗治胃氣虛寒中夾寒飲者效四逆湯溫之舌鑑是也肝色青腎色黑青黑相合而見於舌變化紫晦者腎肝色泛也此舌雖無邪熱亦必難治淡紫青筋舌第一百三十二圖說舌淡紫中帶兩路青黑筋而潤者舌鑑此寒邪直中厥陰真寒證也外證必身涼四肢厥冷脈沉面青宜理中四逆二湯並加葛花治之脈沉面黑者不治辨正淡紫青筋舌舌淡紫帶青而濕潤又伴青黑筋者乃寒邪直中陰經也必身涼四肢厥冷脈沉緩或沉弦宜四逆湯理中湯小腹痛甚者宜回陽救急湯即四逆理中又加肉桂半夏五味子茯苓陳皮舌鑑之說是也若舌不濕潤而乾枯則是實熱宜用涼潤之劑何報之曰酒毒內蘊舌必深紫而赤或乾澀若淡紫而帶青滑則為寒證矣須辨紫中紅斑舌第一百三十三圖說舌渾紫而有紅斑滿舌者舌鑑舌渾紫色而上滿舌紅斑或渾身亦發出赤斑者此酒毒內蘊濕中生火之證也宜化斑湯或三黃解毒湯加青黛葛根有下證者涼膈散或消斑青黛飲主之吳坤安云舌苔兩旁有紅紫點者肝臟伏毒也急用犀角尖鮮大青人中黃透之解之辨正舌鑑治法亦是惟消斑青黛飲青黛川連石膏犀角柴胡人參甘草知母山梔元參生地薑棗加醋一匙和服大便實者去人參加大黃此陶節庵方之人參元參生地柴胡薑棗醋七味皆與陽火實熱里證不當除去乃效若泥古亦足誤人張石頑云若紫中有紅斑或紫而干黃紫而短縮俱宜涼膈散主之紫上青腫乾焦舌第一百三十四圖說舌邊紫而中心赤腫或青腫舌鑑紫上赤腫乾焦舌乃是陽明受邪或已下後即食酒肉邪熱復聚所致若赤腫青潤大柴胡湯微利之若煩躁厥逆脈伏先用枳實理中湯即理中湯加枳實茯苓次用小承氣湯下之或加芩連葛花亦佳辨正舌鑑是指傷寒證之寒食結胸也若雜病見此舌乃脾胃實熱已極不論何脈將十全苦寒救補湯分兩劑一大承氣湯二三黃白虎湯循環急投服至赤腫消盡則必愈過於遲疑勢必誤人凡舌忽然紫腫作疼不能言語飲食者用元明粉枯礬蒲黃飛鹽各二錢飛月石薄荷殭蠶各一錢煅皂礬錢半共研極細末頻頻吹之吐去涎痰遂愈熟紫老幹舌第一百三十五圖說舌全紫干老如煮熟豬肝者即死肝色也舌鑑乃濕熱傳入厥陰胃氣不化陽極似陰也其外證必厥冷脈必沉滑血脈瘀阻陽郁不達急宜當歸四逆湯加酒浸大黃桃仁下之然多不救周澂之曰當歸四逆尚嫌近補大黃又嫌泄氣此證宜宣散化血通脈使血開氣達耳辨正熟紫老於舌乃臟腑熱極又因邪熱傳厥陰也惟有十全苦寒救補湯分劑連投先服大承氣湯次服三黃白虎湯加犀角尖等服至舌色嫩淨則愈遲疑則不治舌鑑明知是熱邪傳陰而仍用當歸四逆湯之溫補謬極紫尖㾦瘰舌第一百三十六圖說舌色淡紫尖生㾦瘰舌鑑感寒後不戒酒食或醉飽後感寒遏熱於裡血氣不得流通而見咳嗽生痰煩躁不寧舌色淡紫尖生㾦瘰乃酒毒傷膽咳痰傷胃所致也宜小柴胡湯加葛花滑石鮮生地赤芍治之辨正紫尖㾦瘰舌乃熱毒中心血也時疫酒濕梅毒等症皆有之宜三黃犀角連翹銀花生大黃鮮大青葉各三錢治之舌鑑謂傷寒不戒酒食所致殊未當也若舌苔焦紫起刺如楊梅狀者此陽邪熱已入肝臟險症也大便閉者急以更衣丸下金汁水人中黃之類紫短舌第一百三十七圖說全舌色紫短而團圞舌鑑紫短舌乃食滯津虧熱傳厥陰也而筋脈攣縮五六日間至危困恐邪毒又遺於脾土即用大承氣湯下之下後熱退脈靜舌舒者生不然難治正義云舌紫且腫厚者此酒毒而又飲冷壅壓其熱也外證煩躁四逆先進以理中丸撤其在上之寒次以承氣湯下之微有脈者可治辨正紫短舌色紫短而團圞乃食滯中宮又熱傳厥陰也急以大承氣湯下之舌鑑尚是又云下後熱退脈靜舌柔和者生否則死是不知舍脈憑舌之治法也余意必當下淨其積涼透其熱以十全苦寒救補湯分兩劑循環急投若偶爾嘗試遲疑誤人孕婦紫青舌第一百三十八無圖圖說全舌紫色帶青不雜他色舌鑑孕婦傷寒面赤舌紫乃感寒頭痛身熱腰脊強惡寒脈浮而緊此寒邪在表當發太陽經之汗即安若誤用蔥酒發汗一二次致令酒毒逼內傳經則煩躁懊憹宜梔子豉湯不然則發斑矣若不發熱但惡寒乃酒毒內傳寒邪直中陰證兼夾冷食者舌必淡紫帶青恐胎損腹中枳實理中湯加味治之如面赤舌青母雖無妨子殞腹內宜即下死胎用平胃散加芒硝下之或用元明粉三錢研末童便送下或天花粉三錢為末長流水調送下胎即出也或用黑龍丹研灌皆能下死胎於俄頃也辨正孕婦紫青舌傷寒無此舌其或有者乃熱體誤投溫補胞胎受熱上衝所致宜用三黃解毒湯誤藥則母子俱危紫青為熱若青紫則為寒辨之宜慎舌鑑謂傷寒夾食非也第二十八章黴醬色舌類診斷鑑別法黴醬色舌總論七舌鑑黴醬色苔者為黃赤兼黑之色如物經久雨青黑而曰黴色是也乃夾食傷寒而復夾濕熱胃氣不化熏蒸於舌故見此象也傷之輕者苔色薄雖腹中疼痛不止下利惡寒者可用桂枝湯加枳樸橘半痛甚便閉不通者加薑汁煮大黃因冷食不消加乾薑厚朴草蔻甚則調胃承氣湯加炮姜下之其苔色厚而腹痛甚服藥不應者必危要知黴醬色乃老黃兼黑色釀成食填太陰郁遏不得發越久盦而成醬色也確是土邪剋水水精不獲上榮故口齒燥唇乾焦下利大渴不能多飲如胃氣絕脈結代者死雖應下奪鮮有克愈者正義云舌生厚苔而如黴色者此夾食傷寒也色淡者生色濃者死下之得通者生不得通者死周徵之曰此即沉香色也總是血瘀氣濁所致濕熱夾痰亦常有之不僅夾食也黴音梅辨正黴醬色者有黃赤兼黑之狀乃臟腑本熱而夾有宿食也凡內熱久郁者夾食中暑者夾食傷寒傳太陰者皆有之凡見此舌不論何證何脈皆屬裡證實熱證無表證虛寒證舌鑑謂苔薄用桂枝湯加枳橘半夏苔色厚為土邪剋水鮮有得愈者皆謬說也見圖十九黴醬色舌證治圖說純黴醬色舌第一百三十九圖說全舌黃赤兼黑之色如沉香色舌鑑舌見黴醬色乃飲食填塞於胃復為寒邪郁遏內熱不得外泄濕氣熏蒸盦而變成此色也其脈必沉緊澀數其人必煩躁腹痛五七日下之不通者必死太陰少陰氣絕也辨正純黴醬色舌為實熱蒸胃為宿食困脾傷寒傳陰中暑躁煩腹痛瀉利或閉結大渴大熱皆有此舌不論老少何病何脈宜十全苦寒救補湯連服而愈舌鑑謂下之不通必死駭人誤人中黴浮厚舌第一百四十圖說全舌灰黑兼紫中黴厚苔如醬餅浮於舌中舌鑑乃食結中宮濕滯不化之象如脈有胃氣不現結代嘴不苦齒不燥不下利者揩去舌苔不再長者可用枳實理中湯加薑汁炒川連若舌苔揩去復長仍前者必難救也辨正中黴浮厚苔乃宿食在中郁久內熱胃傷脾困也或刮不淨而頃刻復生者不論何證何脈宜十全苦寒救補湯分三劑先大承氣湯次三黃白虎等藥循環急服則愈舌鑑用枳實理中湯加姜炒川連此治寒實結胸者與此舌不對黴黃色舌第一百四十一圖說舌黴色中有黃苔者舌鑑此乃濕熱之物鬱滯中宮也二陳湯加枳實黃連若苔乾焦黃更加酒大黃下之辨正黴黃色黃苔舌全舌黴色中有黃苔實熱鬱結顯然可見宜大承氣連服舌鑑謂二陳加枳實黃連恐未必效也第二十九章藍色舌類診斷鑑別法藍色舌總論八舌鑑藍色者肝臟之純色也因無胃氣而發見於外也如傷寒日久屢經汗下失於調理致胃氣傷極精微不能上奉而心火無氣胃失其所依而肺亦乏其生氣則肝寡於畏反假濁汙之氣以上乘膈中而胃脘之陽和頓失故純藍之色見於舌上也明知肺肝相併心脾氣絕之候是以必死正義云舌見藍色者為肺氣已絕肝火獨盛來侵土位也如舌色微藍或略見藍紋者脈不沉澀固正氣不至脈形斷絕不勻也猶可溫胃強脾調肝益肺十中可救其一脈微弦者氣能至而血阻之故脈繃急也為臟氣未絕可治用小柴胡湯加肉桂炮姜主之若純藍色現確是肝木獨旺胃失陽和雖無劇症必死無疑至葡萄瘟疫其舌色青藍或兼紫兼醬乃是病邪致然非若傷寒之藍色必關臟氣為死候矣宜並參合之辨正藍者綠與青碧相合猶染色之三藍也舌見藍色而尚能生苔者臟腑雖傷未甚猶可醫治若光藍無苔者不論何脈皆屬氣血極虧勢難延年舌鑑泥於五行肺肝相併心脾氣絕不分有苔無苔概云不治亦管窺之見耳馬良伯云有微藍而不滿色者法宜平肝熄風化毒舌鑑主用小柴胡湯加薑桂然邪熱鴟張肝陰焦灼逼其本臟之色外見再用薑桂是抱薪救火也瘟疫及濕溫熱鬱不解亦有此舌治宜芳香清泄濕痰痰飲證亦有舌滿滑膩中見藍色者為陰邪化熱之候法宜清化周澂之曰余常見癇厥及胃氣久病者舌體全藍此亦瘀血在胃肝氣不舒也故青黑藍絳皆謂之濁皆竭血分須辨寒熱燥濕及痰血宿食燥屎癥塊而治之總以鬆動血分為主藍色舌證治圖說純藍色舌第一百四十二圖說全舌純藍如染布三藍之色舌鑑舌見純藍乃中土氣衰胃陽將絕之候見之則百不一生矣辨正純藍色舌凡病舌見藍光無苔者不治若藍色而有苔者心肝肺脾胃為陽火內攻熱傷氣分以致經不行血也其症有癲狂大熱大渴哭笑怒罵捶胸驚怪不等宜十全苦寒救補湯倍生石膏黃連急服則愈若孕婦舌見藍色者胎死腹中也宜下之藍紋舌第一百四十三圖說全舌微藍如靛花五分鉛粉五分調和之色也上有藍色之紋舌鑑舌見藍紋乃胃土氣衰肝氣相乘之候小柴胡湯去黃芩加炮薑桑葉若寒物積滯中宮急宜附子理中湯或大建中湯辨正藍紋舌有藍色之紋也在傷寒為胃氣衰微小柴胡湯去黃芩加炮姜若因寒食積滯者宜附子理中湯或大建中湯黃耆當歸桂心芍藥人參甘草半夏附子薑棗急救舌鑑之法尚合葡萄瘟舌第一百四十四圖說全舌微藍中兼青兼紫兼黃兼醬等具有五色雜呈舌鑑葡萄瘟疫乃瘟病中之一原雜病氣屍氣與雜氣蘊釀而成其舌或青或紫或醬或黃或藍猶可按法治之辨正口舌起疱如葡萄並有青黃紫黑綠色罩於舌上唇腫咽痛口穢噴人臂斑或藍或紫或起紫疱甚則心胸亦見灼熱神昏便閉溲短徹夜不寐脈形細數而澀此痰阻上焦熱伏營分氣機鬱結熱毒上湧也宜急用鮮生地鮮大青葉黑元參人中黃焦山梔連翹殼紫草天花粉金銀花竹茹枇杷葉夏枯草薔薇根海蜇煎湯調神犀丹等味為劑不次急投服至舌本轉赤舌苔轉黃疱平腫消為止外以紫雪丹塗口舌紫疱上並用錫類散吹喉附孕婦辨舌通論妊娠傷寒邪入經絡舌苔漸生輕則子殞重則母傷枝損果必墜母傷胎必傾母子安危當驗於舌舌青面赤子死母活舌赤面青母死子活舌面俱赤子母皆活舌辨云舌灰是傷寒里證熱入子宮恐胎不固宜小柴胡湯加白朮苧麻根等藥內解邪熱外固胎元若面黑舌藍主子在胎將死因母傷寒後已過經失於調理致令如此恐二命皆難保也梁特嚴云余家訓望舌分經察色辨苔但求於表裡寒熱虛實詳審明確即得治法要領初無男婦老少之殊亦無妊娠傷寒之異名也治孕婦勿誤用損胎之藥然亦不能妄用保胎藥以助火而擾胎夫表有感邪必發散之里有虛寒必溫補之倘里有實熱留之為害亦必攻瀉之內經所謂有故無殞也有故者有病也宜用重藥時適對其病則病當之而無害也如孕婦或有黃黑舌厚苔膩芒刺大便閉者亦可酌用生大黃元明粉等藥以去大熱而不傷胎也如此則不必別立妊娠傷寒一門舊本舌鑑既有圖說因踵為之辯不敢人云亦云將錯就錯舊論謂邪入經絡輕則母傷重則子傷而視母舌以知子命色澤則安色敗則斃面青舌青者子死母活面舌俱青出沫者母子俱死亦有面舌皆白而母子俱死者蓋色不澤也梁玉瑜云以上一百四十四舌傷寒雜病皆有之大半為重病不常見者其輕病常見之舌分經別色辨其表裡及某經寒熱虛實不必拘定圖說庶能隨機應變虛則衛母實則泄子急則治標緩則治本審病用藥以平為期補瀉溫涼無或軒輕本書後附古案新案諸條力言用補藥保全黑舌不可枚舉命意偏重溫補是但知甘溫為補而不知當用苦寒之時雖瀉亦補也原本又論燕都王生黑舌既用甘溫大劑復用冷水一二斗妄治而愈彼亦不知其故輒歸功於溫補以余觀之安知非熱病而得力於冷水乎總之黑舌有實熱有虛寒區別之法已詳總論若不將病源認明在先而以探試幸中之藥味表彰於後斷定某藥可治某舌鮮不傳誤附錄王文選傷寒舌鑑跋云以手拭舌滑而軟者病屬陰粗而燥者病屬陽胸喜熱物者病屬陰胸喜冷飲者病屬陽病在陰者宜溫宜散在陽者宜解宜下數語尚是然閱者若固執鮮通必多貽誤何也虛寒者舌固滑而軟邪初傳裡者真熱假寒者亦間有軟滑之舌實熱者與邪入陰者舌固粗而燥陰虛水涸者真寒假熱者亦或有粗燥之舌其別異處虛寒證必全舌色淡白滑嫩無點無罅縫無餘苔邪初傳裡證全舌白滑而有浮膩苔寒滯積中者舌亦相類惟問所因以辨證耳真熱假寒證必全舌色白而有點花罅裂積沙各實苔不等面苔刮不淨底色卻隱紅多刮欲嘔或乾嘔重刮沙點旁或出血少許假證最惑人宜慎辨之以上為滑軟舌之別真寒假熱證全舌亦或有黑色乾焦罅裂芒刺厚苔惟用老生薑切片輕擦即脫淨舌底必淡白而不紅或口呼渴而不多飲水者也若用姜擦之而苔堅不退或口極渴而飲水常多者是實熱甚也寒熱之判關乎生死實熱者與邪火入陰之證全舌必有或黃或黑積滯乾焦罅裂芒刺等苔陰虛水涸者全色必絳色無苔或有橫直罅紋而舌短小不等以上為粗燥舌之別至若胸喜熱物者不必定屬虛寒胸喜冷飲者不必定屬實熱真寒假熱者胸亦喜冷飲又當別之舌色舌苔參之望聞問切以窮其變辨證諸條輒言用苦寒重劑不次急投蓋察舌色苔狀與病證毫無疑義確知急病不可緩治必神速方能奏功苟逡巡退縮拘於一劑一日勢必貽誤古所謂藥到病除者謂用藥已到勝病之分量病方能痊到者藥力之到也或數劑而到或數十百劑方到非入口即愈也此中消息惟閱歷深者知之若心氣粗浮察舌不準審證未確遽執余說妄投重劑又將致禍所謂辨舌者小心謹慎於表裡寒熱虛實六字鑑別至當庶幾經權正變悉閤中庸余恪遵家訓用自攝養非欲與世爭長過承垂詢不敢人云亦云罄布愚忱遑問知我罪我
