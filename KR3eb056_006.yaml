body:
  text: 卷六第五編雜論方案第三十章辨舌雜論補遺本章專採諸家辨舌精論能闡幽發微故辯論不嫌其詳以期推源尋流互相參考庶幾察舌用藥能決死生於俄頃也間有已見前卷各條者未免偶有重複惟前則東鱗西爪未窺全斑此皆摘錄全編可無遺憾焉編述者志傷寒辨舌總論一舌乃心之苗心為君主之官應南方赤色甚者或燥或澀或青或白或黑是數者熱氣淺深之謂舌白者肺金之色也由寒水甚而致火不能平金則肺自甚故色白也舌青者肝木之色也由火甚而金不能平木則肝木自甚故色青也色青為寒者訛也仲景云少陰病下利清穀色青者熱在裡也大承氣湯下之舌黃者由火盛則木必衰所以一水不能制五火而脾土自旺故色黃也舌紅為熱心火之色也或赤者熱深甚也舌黑亦言為熱者由火熱過極則兼水化故色黑也五色應五臟固如此敖氏以舌白者邪在表未傳於裡也舌白苔滑者痛引陰經名臟結也舌之赤者邪將入也舌之紫者邪毒之氣盛也舌之紅點者火亢極也舌之燥裂者熱深甚也或有黑圈黑點者水之萌發也舌根黑者水之將至也舌心黑者水之已至也全舌黑者水之體也其死無疑舌黃者土之正色也邪初入於胃則本色微黃發見舌黃白者胃熱而大腸寒也舌之通黃者則胃實而大燥也調胃承氣湯下之黃自去矣舌灰黑者厥陰肝木相承速用大承氣湯下之可保五死一生舌乃心苗心開竅於舌心屬火主熱象黎明人得病初在表則舌自紅而無白苔等色表邢入半表半裡之間則舌色變為白苔而滑見矣切不可不明表證故邪傳於裡則舌必見黃苔乃邪已入於胃急宜下之苔黃自去而疾安矣至此醫者或誤用湯丸失於遲下其苔必黑變證蜂起遂為難治若見舌苔如漆黑之光者十無一生此心火自焚與邪熱二火相攻熱極則有兼化水象故色從黑而應水化也若乃臟腑皆受邪毒日深其症必作熱證急宜下之以去胸中之熱否則其熱散入絡臟之中鮮有不死者譬如火之自炎初則紅過則薪為黑色炭矣此亢則害誠乃制之理是也上見敖氏傷寒金鏡錄傷寒辨舌秘法二凡見舌系白苔邪火未甚也用小柴胡湯解之舌系黃色者心熱也可用黃連梔子以涼之凡見黃而帶灰色者系胃熱也可用石膏知母以涼之凡見黃而帶紅者乃小腸膀胱熱也可用梔子以清之見舌紅而白者肺熱也用黃芩蘇葉以解之見舌黑而帶紅者乃腎虛而挾邪也用生地元參又入柴胡以和解之見舌紅而有黑星者乃胃熱極也宜用石膏以辛涼之元參乾葛亦可終不若石膏之妙見舌紅而有白點者乃心中有邪也宜用柴胡黃連以解之心肝同治也見紅舌而有大紅點者乃胃熱而帶濕也須茵陳五苓散以利之蓋水濕必歸膀胱以散邪非肉桂不能引入膀胱但止可用一二分不可多入見舌白苔而帶黑點者亦胃熱也宜用石膏以涼之見舌黃而有黑者乃肝經實熱也用柴胡梔子以解之不使入里柴胡乃半表半裡之藥不可不用也見舌中白而外黃者乃邪入大腸也必須五苓散以分水水分則瀉止矣見舌中黃而外白者乃邪在內而非在外邪在上而非下止可加柴胡枳殼以和解不可驟用大黃以輕下也天水散加五苓散亦可終不若柴胡枳殼直中病源少加天水則更妥或不加用天水散加五苓散亦可也見根黃而光白者亦胃熱而帶濕也亦須用石膏為君而少加利水之品如豬苓澤瀉之味也見舌黃而隔一瓣一瓣者乃邪濕已入大腸急用大黃茵陳下之不必用抵當十棗湯也若下之遲則不得而用之然須辨水與血之分下水用十棗湯下血用抵當湯見舌有紅中如蟲蝕者乃水未升而火上乘也亦須用柴胡黃連以和解之見舌紅而開裂如人字者乃邪初入心宜用黃連石膏以解之見舌有根黑而尖帶紅者乃腎中有邪未散宜用柴胡梔子以解之見舌根黑而尖白者乃胃火乘腎宜用石膏知母元參以解之不必論其渴與不渴亦不必問其下利也舌根黑而尖黃者亦邪將入腎須急用大黃下之然須辨其腹痛與否若腹痛拒按者急下之否則只用柴胡梔子以和解之見舌純紅而尖獨黑者乃腎虛而邪火來乘也不可用石膏湯腎既虛而又用石膏是速之死也當用元參一兩或二兩以救之多有能生者見舌有中心紅暈而四圍邊旁純黑者乃君相二火炎騰急用大黃加生地兩許下而救之十中可救五六見舌有中央灰黑而四邊微紅者乃邪結於大腸也下之則愈不應則死以腎水枯槁不能推送故潤之此時又不可竟用熟地補腎之藥蓋邪未散不可補補則愈加脹急適所以害之也必先下而後以生地滋之則可然亦不可多用也見舌有純灰色中間有兩暈黑者亦邪將入腎也急用元參一兩許少加柴胡治之見舌有外紅而內黑者此火極似水也急用柴胡梔子大黃枳實以和利之若舌又見刺則火亢熱之極矣尤須多加前藥總之內黑而外白內黑而外黃皆前證也與上同治十中可得半生也惟舌中淡黑而外或淡紅外或淡白內或淡黃者較前稍輕俱可以前法治之十中可愈八人見舌有純紅而露黑紋數條者此火極似水也一帶純黑俱不可治傷寒能知舌之驗法便有把握庶不至臨證差誤耳黑色陰寒而直中腎經舌黑眼閉下身盡黑上身仍青大便出小便遺此更危急之證余用救心湯人參五兩附子一枚白朮八兩肉桂一兩菖蒲五分良薑三錢水煎服此方參朮多用者少則力不能勝任以駕馭附桂之熱藥也故必多加而後可望其通達上下以盡祛周身之寒毒若得大便止而小便不遺便有生機再進一劑則目開而舌黑亦退而身黑身青俱盡解也苟服藥後仍前大小便不禁不必再服藥聽其身死而已矣十中可救一二耳生刺人有火盛之極舌生芒刺唇口開裂大渴呼飲雖非傷寒之症所得而患此病即不身熱亦去死不遠也白虎湯亦可救但過於太涼恐傷胃氣往往有熱退而生變仍歸於亡故白虎湯不可輕投也宜清涼散元參二兩麥冬一兩甘菊青蒿各五錢白芥子生地車前子各三錢水煎服此方妙在元參為君以解上焦之焰麥冬為臣以解肺中之熱甘菊青蒿為佐以消胃中之火尤妙在車前子白芥子生地為使或化痰或涼血盡從膀胱以下瀉其大熱之氣是上下之間無非清涼而火熱自散又不損胃敵能扶危而不至生變也燥裂亡血之後舌燥裂不能飲食者死蓋亡血自然無血以生精精涸則津亦涸必然之勢也欲使口舌之乾者重潤必須使精血之竭者重生補精之方六味丸最妙然而六味丸單補腎中之精而不能上補口舌之津也雖補腎於下亦能通津於上然總覺緩不濟急余今定一方名上下相資湯熟地麥冬各一兩山萸肉北沙參當歸懷牛膝生玉竹各五錢人參玄參各三錢北五味子二錢車前子一錢水煎服此方補腎為君而兼以補肺之藥子母相資上下兼潤精生而液亦生血生而津亦生矣安在危亡之證不可慶再生耶干腫燥證舌乾腫大溺血便血不止亦是死證蓋感暑熱之毒至秋而燥及肺金清肅之令不行大小便熱極而齊出血也論理見血宜治血矣然而治血血偏不止及至燥添而不可救吾不治血而專治燥方用兼潤丸熟地當歸白芍各一兩元參麥冬北沙參各二兩生地車前子各五錢地榆三錢水煎服一劑減半二劑血止便有生機此方純是補血妙品惟用地榆以清火牟前子以利水火清水利不治血而血自治也上錄陳遠公石室秘錄舌病之原三心開竅於舌舌者心之官也心屬火而火性升其下降者胃土右轉金斂而水藏也胃逆而肺金失斂則火遂其炎上之性而病見於舌疼痛熱腫於是作矣火之為性降則通暢升則堙郁鬱則苔生舌苔者心液之瘀結也鬱於胃則苔黃鬱於肺則苔白火盛而金燥則舌苔白澀火衰而金寒則舌苔白滑火衰而土濕則舌苔黃滑火盛而土燥則舌苔黃澀五行之理旺則侮其所不勝衰則見侮於所勝水者火之敵水勝而火負則苔黑而滑水負而火勝則苔黑而澀凡光滑滋潤者皆火衰而寒凝凡芒刺焦裂者皆火盛而燥結也心主言而言語之機關則在於舌舌之屈伸上下者筋脈之柔和也筋司於肝肝氣鬱則筋脈短縮而舌卷不能言靈樞經脈篇云足厥陰氣絕則筋急筋者聚於陰器而脈絡於舌本脈弗榮則筋急筋急則引舌與卵故唇青舌卷囊縮足太陰氣絕則脈不榮其唇舌脈不榮則舌萎人中滿素問熱論少陰脈貫腎絡於肺系舌本故口燥舌乾而渴足三陰之脈皆絡於舌凡舌病之疼痛熱腫則責心火之升炎若其滑澀燥濕攣縮弛長諸變當於各經求之也上錄黃坤載四聖心源舌苔辨四舌者心之官法應南方火本紅而澤傷寒邪氣在表者舌無苔及邪氣傳裡津液相搏則舌生苔矣明理舌上苔滑者以丹田有熱胸中有寒邪氣相傳入里也仲景寒變為熱者則舌上之苔不滑而澀是熱耗津液而滑者已於也若熱聚於胃則舌黃金匱云舌黃者下之黃自去若舌上黑色者又為熱之極也靈樞曰熱病口乾舌黑則死心開竅於舌黑為腎水之色水火相刑故知必死明理腎虛有火是為無根虛火舌色淡黑二三點用補腎降火之藥凡舌黑俱系危症惟冷而滑如淡墨然者乃無根之火也上錄東醫寶鑑舌色辨五舌為心之官本紅而澤凡傷寒三四日以後舌上有苔必自潤而燥自滑而澀由白而黃由黃而黑甚至焦乾或生芒刺皆邪氣內搏由淺入深之證也故凡邪氣在表舌則無苔及其傳裡則津液乾燥而舌苔生矣若邪猶未深其在半表半裡之間或邪氣客於胸中者其苔不黑不澀止宜小柴胡之屬以和之若陽邪傳裡胃中有熱則舌苔不滑而澀宜梔子豉湯之屬以清之若煩躁欲飲數升者白虎湯加人參之類主之大都舌上黃苔而焦澀者胃府有邪熱也或清之或微下之金匱曰舌黃未下者下之黃自去然必大便燥實脈沉有力而大渴者方可下之若微渴而脈不實便不堅苔不幹燥芒刺者不可下也其有舌上黑苔而生芒刺者則熱更深矣宜涼膈承氣湯大柴胡湯之屬酌宜下之若苔色雖黑滑而不澀者便非實邪亦非火證非惟不可下且不可清也按傷寒諸書皆云心為君主之官開竅於舌心主火腎主水黑為水色而見於心部是為鬼邪相刑故知必死此雖據理之談然實有未必然者夫五行相制難免無克此其所以為病豈因克為病便為必死第當察其根本何如也如黑色連地而灰黯無神此其本原已敗死無疑矣若舌心焦黑而質地紅活未必皆為死證陽實者清其胃火火退自愈何慮之有其有元氣大損而陰邪獨見者其色亦黃黑真水涸竭者其舌亦乾焦此腎中水火俱虧原非實熱之證欲辨此者但察其形氣脈色自有虛實可辨而從補從清反如冰炭矣故凡以焦黑乾澀者尚有非實非火之證再若青黑少神而潤滑不燥者則無非水乘火位虛寒證也若認此為火而苦寒一投則餘燼隨滅矣故凡見此者但當詳求脈證以虛實為主不可因其焦黑而熱言清火也傷寒固爾諸證亦然上錄景岳全書辨舌法六舌尖屬心舌根屬腎中間屬脾胃兩邊屬肝膽赤為熱深黃為濕熱食滯厚白為濕寒水飲灰白為極虛極寒紫黑為熱極或脾胃有瘀血伏痰芒刺燥裂亦為熱極紅紫如豬肝為火灼胃爛死證也錄醫鏡舌者心之竅凡病俱現於舌能辨其色證自顯然舌尖主心舌中主脾胃舌邊主肝膽舌根主腎假如津液如常口不燥渴雖或發熱尚屬表證若舌苔粗白漸厚而膩是寒邪入胃挾濁飲而欲化火也此時已不辨滋味矣宜用半夏藿香迨厚膩而轉黃色邪已化火也用半夏黃芩若熱甚失治則變黑色胃火甚也用石膏半夏或黑而燥裂則無半夏而純用石膏知母麥冬花粉之屬以潤之至厚苔漸退而舌底紅色者火灼水虧也用鮮生地麥冬石斛以養之此表邪之傳裡者也其有脾胃虛寒者則舌白無苔而潤甚者連唇口面色俱痿白此或泄瀉或受濕脾無火力速宜黨參焦朮木香茯苓炙甘草乾薑大棗以振之虛甚欲脫者加附子肉桂若脾熱者舌中苔黃而薄宜黃芩心熱者舌尖必赤甚則起芒刺宜連心麥冬竹葉捲心肝熱者舌邊赤或生芒刺宜柴胡黑山梔其舌中苔厚而黃者胃微熱也用石斛知母花粉麥冬之類若舌中苔厚而黑燥者胃大熱也必用石膏知母如連牙床唇口俱黑則胃將蒸爛矣非石膏三四兩生大黃一兩加金汁水鮮生地汁天冬麥冬汁銀花露大劑投之不能救也此惟時疫發斑及傷寒證中多有之余嘗治一獨子先後用石膏至十四斤余而斑始透病始退此其中全恃識力再有舌黑而潤澤者此係腎虛宜六味地黃湯若滿舌紅紫色而無苔者此名絳舌亦屬腎氣虛乏宜生熟地天麥冬等更有病後絳色舌如錢發亮而光或舌底咽乾而不飲涼此腎氣虧極宜大劑六味地黃湯投之以救其津液方不枯涸上錄筆花醫鏡苔因內熱致脾氣閉滯不行飲食津液停積於內故苔見於外若脾氣不滯則飲食運化津液流通雖熱甚不必有苔也吾每診寒濕內盛者往往舌不見苔及服溫散之劑乃漸生白苔轉黃而病始愈矣舌青或青紫而冷滑者為寒證青紫而焦燥或脹大或捲縮者為熱證寒甚亦必捲縮筋脈得寒而收引也然必不焦燥凡舌強硬短縮及神昏妄語者不治亦有痰病而舌本硬縮及神昏不語者當以形證色脈添之熱病舌本爛熱不止者死傷寒陰陽易舌出數寸者死按此乃房勞復非陰陽易也上錄郭元峰脈如舌苔辨寒熱七傷寒表裡輕重驗舌色辨苔垢亦得大半今余分立白苔黑苔黃苔燥苔滑苔五者以為要若舌色如常身雖大熱是表熱而里未有熱也但治其表如見白苔而滑邪在半表半裡未入於裡也但宜和解若見黃苔者熱在胃家苔黃而乾裂者熱已入里宜清裡熱若有下證者可以下之若見黑苔者有二條分別黑而焦裂硬刺者裡熱已極火極似炭之苔也黑而有水軟潤而滑者裡寒已甚水來剋火之寒苔也以上五者驗舌之大節目也然仍要看症切脈以參定之如舌上黑苔燥裂有刺此裡熱無疑矣然或身痛或足冷或無汗或脈浮或脈伏仍從表證治之雖不可用辛溫之藥必宜辛涼散表然後清裡若過用清熱則表汗不出表邪不解如舌上生苔口渴不能消水脈浮大不數用清熱之藥及加譫語神昏此證多見不治以舌苔主裡熱渴宜消水脈宜沉數脈症相反故耳然余以渴不消水脈滑不數擬以食滯用消導治之亦有生者自此而知表邪夾食之證亦有舌苔生刺者也大凡察病人之舌沿邊缺陷如鋸齒狀者此不治之證也以上錄秦皇士傷寒大白然有苔黑屬寒者必舌無芒刺口有津液也即小便之赤白口中之潤燥舌苔之滑澀亦皆因乎津液之榮枯未足憑以遽斷寒熱也故尤宜以脈之有力無力細辨之總之醫家治病須隨機應變活潑潑地不可膠執一方不可泥滯一藥不必以藥治病惟以藥治脈可也古今氣運不同舊方新病何能符合只可讀其書廣其義考其方得其理潛心默究自得其神即羅氏譬之拆舊料而改新房務必工穩耳上錄顧練江瘍醫大全舌色辨吉凶八在表則無苔按白苔亦屬表證在半表半裡苔白而滑在裡則黃苔熱甚則黑苔芒刺不熱不渴黑苔有津為寒舌乃心茵紅為本色故吉黑為水色故凶凡舌硬舌腫舌卷舌短舌強者十不救一二舌縮神昏脈脫者死不治夏月黑苔可治冬月黑苔難醫黑苔刮不去易生刺裂者死凡見舌苔以井水浸青布擦淨舌苔以薄荷細末蜜調敷之吐舌者摻冰片末即收上錄李士材傷寒括要溫熱辨舌心法九心開竅於舌脾之大絡繫於舌本肝腎脈亦通舌本凡木舌重舌舌衄屬心經燥熱舌菌舌墊舌腫大塞口屬脾經濕熱挾心火上壅舌本強硬為熱兼痰若舌卷短痿軟枯小則肝腎陰涸而舌因無神氣矣溫病初起舌苔白而少津者宜杏仁桔梗牛蒡之類辛潤以解縛束桑葉蔞皮之類輕清以解燥熱佐梔皮連翹之微苦微燥舌苔白而底絳濕遏熱伏也須防變干宜辛淡輕清泄濕透熱如三仁湯以蔻皮易蔻仁稍佐滑石淡竹葉蘆根之類以清化之初病舌苔白燥而薄或黃燥而薄為胃腎陰虧其神不昏者宜鮮生地元參麥冬等味以救陰分兩不宜過重恐遏伏邪熱銀花知母蘆根竹葉等味以化邪尤須加辛潤以透達若神即昏者加以開閉如普濟丹清上丸此二方無考開閉可用紫雪丹王定牛黃清心丸可也遲則內閉外脫不治舌苔燥如白砂者此溫邪過重宜速下之佐以甘涼救液白燥而厚者調胃承氣湯下之佐以清潤養陰如鮮生地元參梨汁蘆根之類若白膩不燥自覺悶極口甜吐濁涎沫宜加減正氣散加佩蘭神麯若舌脹大不能出口屬脾濕胃熱鬱極前法加大黃汁利之舌白不燥或黃白相兼或灰白不渴此濕熱鬱而未達或素多痰飲雖中脘痞痛亦不可攻宜用開化如杏蔻枳桔陳皮茯苓通草之類舌苔白膩胸膈悶痛心煩乾嘔欲飲水水入則吐此熱因飲鬱而生宜辛涼化飲如白芥子細辛通草茯苓豬苓澤瀉苡仁滑石竹葉蘆根如飲熱並重舌苔黃膩宜辛苦通降佐以淡滲如小陷胸湯半夏瀉心湯去參甘大棗以薑汁炒黃連代乾薑加通草茯苓蔞皮薤白等味黃芩滑石湯黃連溫膽湯均可選用邪傳心包神昏譫煩如舌苔黃膩仍屬氣分濕熱內蒙包絡宜半夏瀉心湯小陷胸等湯或用杏仁白芥子薑汁炒川連鹽水炒木通連翹滑石淡竹葉蘆根蔞皮之類辛潤以通之鹹苦以降之清淡以泄之涼膈散亦可間用寧上丸普濟丹亦效若舌赤無苔此證與前證同一神昏而虛實相反前系濕熱明證此係傷陰確據神昏為內閉之象閉則宜開心宮用虛靈之所虛則忌實宜犀角鮮生地連翹銀花鬱金鮮石菖蒲鮮蘆根梨汁竹瀝少和薑汁緩煎熱服再用寧上丸普濟丹開閉養陰地黃用鮮者取其滑利少和薑汁涼藥熱飲取其流連此即陰陽開闔之理蘆根尤宜多用輕清甘涼兩飲金水又能泄熱化濕從膀胱而解如此治法斷無不效之理最忌一派苦寒永伏陰柔濁膩今時習俗尤誤於溫病傷陰之說不知氣分熱鬱爍津之理每見舌絳便用大劑陰柔是濁熱已遏上焦氣分又用濁藥兩濁相合逼令邪氣深入膏育深入骨髓遂成固結不解之勢又或舌苔黃膩明系氣分濕熱熏蒸法宜辛苦開化乃不用開化而用大劑涼藥亦足逼令邪氣深伏邪伏則胃氣不得上升舌苔因之亦伏轉成舌絳無苔矣若舌色紫暗捫之濕潤乃其人胸膈中素有虛瘀與熱相搏宜鮮生地犀角丹皮丹參赤芍鬱金花粉桃仁藕汁等味涼血化瘀舌紫腫大或生大紅點者乃熱毒乘心用導赤犀角加黃連金汁治之或稍加大黃汁利之舌絳欲伸而抵齒難伸者此痰阻舌竅肝風內動宜於清化劑中加竹瀝薑汁膽星川貝等味以化熱痰切勿滋膩遏伏火邪其有因寒涼陰柔遏伏者往往愈清愈燥愈滋愈干又宜甘平甘潤佐以辛潤透邪其津乃回若舌與滿口生白衣為黴苔或生糜點謂之口糜因其人胃腎陰虛中無砥柱濕熱用事混合熏蒸證屬難治酌用導赤犀角地黃之類服之舌心絳干乃胃熱上爍心營宜清心胃舌尖絳干乃心火上炎宜導赤以瀉其府舌絳而光亮絳而不鮮甚至干晦痿枯者或淡而無色如豬腰樣者此胃肝腎陰枯極而舌無神氣者也急宜加減炙甘草湯加沙參玉竹雞子黃生龜板等類甘平濡潤以救之黑為腎色苔黑燥而厚此胃腸邪結傷及腎陰宜大承氣湯鹹苦下之黑燥而不甚厚調胃承氣湯微利之或增液承氣湯潤下之若舌淡黑而津不滿者此腎虛無根之火上炎用復脈生脈輩救之舌苔黃厚脈息沉數中脘按之微痛大便不解或雖解無多或雖多而仍覺不爽宜於辛苦劑中兼用酒製大黃為丸緩化而行往往服一二次大解一次再服再解如此五七次而邪始盡也若舌如沉香色或黃黑而燥脈沉實而小甚者沉微似伏四肢發厥或渴喜熱飲此皆裡氣不通之象酌用三承氣湯下之陰傷者加鮮生地元參知母蘆根之類足矣蓋速下其邪即所以存津液也必得苔退脈靜身涼舌之兩旁生出白薄苔方為邪盡一切外邪伏邪均系如此按此篇診舌之法頗為精細錄於石芾南醫原中至於舌苔白燥黃燥黑燥始用承氣湯下之亦未盡善余曾治溫病數人往往數日不大便燥糞已結而舌苔始終滑潤無舌苔可據者要之餘所遇者其變石氏所論者其常也知常知變而後可與言醫舌質舌苔辨十凡察舌須分舌質舌苔舌苔雖惡舌質如常胃氣濁惡而已苔從舌里生出刮之不能全淨者氣血尚能交紐為有根也凡舌苔以勻薄有根為吉白而厚者濕中有熱也忽厚忽薄者在輕病為神氣有權在困病為腎氣將熄邊厚中黃或中道無苔者陰虛血虛也中道一線深陷極窄如隙者胃痿也舌根高起累累如豆中路人字紋深廣者胃有積也舌上星點赤而鼓起者胃熱也在兩旁主肝熱在尖主心熱淡而陷下者胃虛也在小兒為有滯有蟲望似有苔一刮即淨全無苔跡者血虛也一片厚苔或黃或白如濕粉所塗兩邊不能漸勻漸薄者胃絕也舌上津液如常邪尚在表見白苔而滑厚而膩是寒邪入胃矣黃而厚者已化熱也黃而燥者熱已盛也厚苔漸退而底色紅如豬肝者火灼水虧津液將竭也見黑苔有二如黑而焦裂硬刺者為火極似炭之熱苔如黑而有津軟潤而滑者為水來剋火之寒苔如連牙床唇口俱黑者則胃將蒸爛矣在時疫斑疹傷寒熱病多有之更有舌中忽一塊如錢無苔而深紅者此脾胃包絡津液大虧潤溉不周也亦有瘀血在於胃中無病或病愈而見此苔者宜疏消瘀積不得徒滋津液按舌面細如魚子者心與命門真火所鼓若包絡有凝痰命門有伏冷則舌面忽一塊光平如鏡此論傷寒外感也溫熱初發便煩熱發渴舌正赤而多白苔如積粉者雖滑亦當以白虎清內熱也又中宮有水飲者舌多不燥不可誤認為寒證也亦有虛熱者舌心雖黑或灰黑而無積苔舌形枯瘦而不甚赤其症煩渴耳聾身熱不止大便五六日或十餘日不行腹不硬滿按之不痛睡中或呢喃一二句或帶笑或嘆息此津枯血燥之虛熱也宜大料六味湯若誤與承氣必死矣此論溫熱也黑苔者血瘀也灰苔者血瘀而挾痰水也婦人傷寒時病最易生黑苔不得遽以為凶舊法黑苔以芒刺燥裂濕潤細膩分寒熱余歷診瘀血苔黑雖內熱而不遽起刺有煙癮人苔易燥刺而非必內有真熱不過肺胃津傷耳凡見灰黑二苔總宜兼用行血其症寒熱甚者必神昏譫語無寒熱者必胸肋有一塊結熱內煩而夜不安眠也若僵縮言語不利或身重不能轉側及一邊不能眠乃凶舌枯晦而起刺者血燥熱結也雖結黑殼猶有生者平人胃中夙有冷痰瘀血舌上常見一塊光平如鏡又凡有痞積及心胃氣痛者病時舌苔多見怪異婦女尤甚以上摘錄周徵之診家直訣第三十一章察舌辨證之醫案黑苔醫案八則薛立齋云余昔留都時地官主事鄭汝東妹婿患傷寒舌見全黑院內醫士魯禧曰當用附子理中湯人咸驚駭而止及其困甚治棺魯與其鄰往復視之謂用前藥猶有生意其家既待以死拚而從之數劑而愈大抵舌黑之證有火極似水者即杜學士所謂薪為黑炭之意也宜涼膈散之類以瀉其陽有水來剋火者即魯醫士所療是也宜理中湯以消陰翳又須以老薑切片擦其舌色稍退者可治堅不退者不可治又弘治辛酉金臺姜夢輝患傷寒亦得黑苔手足厥冷吐逆不止眾醫猶作火治幾致危殆判院吳仁齋用附子理中湯而愈夫醫之為道有是病必有是藥附子療寒其效可數奈何世皆以為必不可用之藥寧視人之死而不救不亦哀哉凡用藥得宜效應不爽不可便謂為百無一生而棄之也張景岳云余在燕都嘗治一王生患陰虛傷寒年出三旬而舌黑之甚其芒刺干裂焦黑如炭身熱便結大渴喜冷而脈則無力神則昏沉群醫謂陽證陰脈必死無疑余察其形氣未脫遂以甘溫壯水等藥大劑進之以救其本仍間用涼水以滋其標蓋水為天一之精涼能解熱耳可助陰非若苦寒傷氣者之比故於津液乾燥陰虛便結而熱渴火盛之證亦所不忌由是水藥並進前後凡用人參熟地各一二斤附子肉桂各數兩冷水亦一二斗然後諸症漸退飲食漸進神氣俱復矣但察其舌黑則分毫不減余甚疑之莫得其解再後數日忽舌上脫一黑殼而內則新肉燦然始知其膚腠焦枯死而復活使非大為滋補安望再生若此一證特舉其甚者紀之此外凡舌黑用補而得以保全者蓋不可枚舉矣所以凡診傷寒者當以舌色辨表裡以舌色辨寒熱皆不可不知也若以舌色辨虛實則不能無誤蓋實固能黑以火盛而焦也虛亦能黑以水虧而枯也若以舌黃舌黑悉認為實熱則陰虛之證萬無一生矣上錄金鏡錄龔子才曰一人色青黑有刺乃熱劇也欲以舌貼上壁上稍可良由思慮過度怒氣所得為制一方名清心散服之即效方用赤茯神棗仁麥冬胡麻仁黃連各一錢遠志五分木通連翹各八分甘草三分清水煎服舌辨云一婦人症已危篤甚其舌黑而厚隔瓣余掘開其舌底有紅色余曰症雖危可救以大承氣湯加減一劑則知人二劑而安又云一人有此舌墨滑數點用大柴胡湯加減下之次早則舌滑俱無而見稍微紅色次調理而安又云一孕婦傷寒證已愈次病頭面腫大痛甚難禁余用三黃俱酒煮牛蒡子薄荷白芷防風石膏四劑全愈梁特嚴云余於辛卯七月道出清江浦見船戶數人同染瘟疫渾身發臭不省人事醫者俱云不治置之岸上徐俟其死余目擊心憫姑往診視皆口開吹氣舌則黑苔黑瓣底其親人向余求救不忍袖手即教以十全苦寒救補湯生石膏加重四倍循環急灌一日夜連投多劑病人陸續瀉出極臭之紅黑糞甚多次日黑中舌瓣漸退復連服數劑三日皆全愈是時清江疫癘大作未得治法輒數日而死有聞船戶之事者群來求治切其脈皆怪絕難憑望其舌竟皆黑瓣底均以前法告之其信者皆一二日即愈其稍知醫書者不肯多服苦寒仍歸無救余因稍有感冒留住十日以一方救活四十九人頗得仙方之譽王孟英治王氏婦年七旬有三風溫傷肺頭暈目眩舌縮無津身痛肢厥口乾不飲昏昧鼻鼾語言難出寸脈大證屬痰熱阻竅先清氣分邪熱杏仁象貝羚羊花粉嫩竹茹桑葉焦山梔一服症減肢和但舌心黑而尖絳乃心胃火燔懼其入營劫液用鮮生地犀角汁元參丹皮麥冬阿膠蔗漿梨汁三服色潤神蘇身涼脈靜但大便未通不嗜粥飲乃灼熱傷陰律液未復繼與調養胃陰兼佐醒脾旬日霍然紅舌醫案二則孟英治姚某年未三旬煙癮甚大適伊母病溫而歿勞瘁悲哀之際復病溫邪脅痛筋掣氣逆痰多壯熱神昏莖縮自汗醫皆束手所親徐麗生囑其速孟英視之脈見芤數舌絳無津有陰虛陽越熱熾液枯之險況初發即爾其根蒂之不堅可知與犀羚元參知母壯水熄風蓯蓉楝實鼠矢石英潛陽鎮逆沙參麥冬石斛玉竹益元充津花粉梔子銀花絲瓜絡蠲痰清熱一劑知四劑安隨以大劑養陰而愈又治姚令與室素患喘嗽復病春溫醫知其本元久虧投以溫補痙厥神昏耳聾譫語面赤舌絳痰喘不眠醫皆束手矣延孟英診之脈猶弦滑曰證雖危險生機未絕遽爾輕棄毋乃太忍與犀角羚羊元參沙參知母花粉石膏以清熱熄風救陰生液佐蓯蓉石英鱉魚甲金鈴旋覆貝母竹瀝以潛陽鎮逆通絡蠲痰三劑而平繼去犀羚石膏加生地服旬日而愈紫疱舌醫案二則程杏軒治汪木工夏間寒熱嘔瀉自汗頭痛他醫與疏表和中藥嘔瀉止而發熱不退汗多口渴形倦懶言舌苔微黃而潤脈虛細用清暑益氣湯加減服一劑夜熱更甚譫狂不安次早復診脈更細舌苔色紫肉碎凝有血痕渴嗜飲冷此必熱邪內伏未透當舍脈從症改用白虎湯加鮮生地丹皮山梔黃芩竹葉燈心服藥後周身汗出譫狂雖定神呆手足冰冷按脈至骨不見闔目不省人事知為熱厥舌形短而厚滿舌俱起紫疱大如葡萄並有青黃黑綠雜色罩於上後用紫雪丹蜜調塗舌上前方再加入犀角黃連元參以清熱金汁人中黃銀花綠豆以解毒另用冬雪水煎藥厥回脈出舌疱消苔退僅紫干耳再劑熱淨神清舌色如常是役也程謂能審其陽證似陰於後未能察其實證類虛於前自咎學力未到以初用清暑益氣湯之誤也王士雄治徐月嚴令正年逾四旬暮春患痰嗽發熱醫者詢知病當汛後於荊防發散中加當歸薑棗為方服三劑血隨痰溢口舌起疱如紫葡萄者八枚下唇右角腫凸如拇指大色如黑棗咽痛礙飲或云瓜瓤瘟或云葡萄瘟醫者望而卻走免余往視口穢噴人頰顎如漆舌紫苔色如靛臂斑或黑或藍溲若沸油渴呃多汗脈形細澀數夜無眠此乃陰分素虧熱伏營分氣機鬱結痰阻上竅詢其胸背斑已遍身幸而血溢汗多毒邪猶有出路故不昏陷令取錫類散吹喉並以童溺藕汁梨汁頻灌隨用元參丹參紫草花粉銀花焦梔連翹鮮石斛鮮大青竹茹枇杷葉夏枯草薔蔽根海蛇煎調神犀丹兩劑後舌本轉赤苔色見黃四劑後血止咽松脈轉弦數六劑便行口穢始減疱平而唇腫亦消八劑嗽平而苔退脈柔和斑回而痕如黑漆始改輕清善後徑愈人字紋舌醫案二則白苔亦有人字紋如程杏軒治一農人患傷寒數日寒熱交作自汗如雨脈虛神倦舌苔白滑分開兩歧宛如刀劃考己任編有陰證誤服涼藥舌見人字紋之語先與六味回陽飲繼進左右二歸飲數劑舌苔漸退而愈黑苔亦有人字紋如楊乘六治沈姓外感證危甚舌黑而枯滿舌遍裂人字紋曰脈不必診也此腎氣凌心八味證也誤用芩連無救矣逾日果歿他如傷寒金鏡錄有裂紋如人字形者因君火燔灼熱毒炎上而發用涼膈散治之以上兩案一則舌白一則舌黑皆用溫藥尤當辨明脈證分別治之藍舌醫案二則舌辨云余治孫仁泉傷寒後月餘舌藍如靛其斑亦藍如大萍遍身自服表劑不應詢其故曰斑不赤故表之余曰非表可治三臟氣已絕矣因心不能生脾脾不能生肺肺不能制肝肝木猖撅脾土受克則不食四肢墜脾痞口不知味余謂不治果旬日而歿又云渾藍舌者乃病後失於調理脾胃全無生氣也必死曩治一傷寒後二十餘日失於調理恣意飲食得此舌苔胸微悶脈微細余不下藥何也蓋肝色純藍而胃土無氣也眾不信翌日果死舌強醫案四則薛己治一婦人善怒舌本強手臂麻薛曰舌本屬脾被木剋制故耳用六君子湯加柴胡白芍治之又治鄭秋官過飲舌本強腫語言不清此脾虛濕熱用補中益氣湯加神麯麥芽乾葛澤瀉而愈又學士吳北川過飲痰壅舌本強硬服降火化痰藥痰氣益甚肢體不遂薛作脾虛濕熱治之而愈又一男子舌下牽強手大指次指不仁或大便閉結或皮膚赤暈薛曰大腸之脈散舌下此大腸血虛風熱當用逍遙散加槐角秦艽治之舌腫醫案五則宋度宗欲賞花一夜忽舌腫滿口蔡御醫用蒲黃末等分乾摻而愈蓋舌乃心之外候而手厥陰相火乃心之臣使蒲黃活血涼血得乾薑是陰陽相濟也芝隱方薛己曰一膏粱之人患舌腫敷服皆消腫之藥舌腫勢急與刺舌尖反兩旁出紫血杯許腫消二更服犀角地黃湯二劑翌早復腫脹仍刺去紫血杯許亦消一二仍服前湯良久舌大腫又刺去黑血二杯許腫漸消忽寒熱作嘔頭痛作暈脈浮洪而數此邪雖去而元氣愈傷與補中益氣湯倍參耆歸術四劑而安又數劑而愈張子和曰南鄰朱老翁年六十餘歲身熱數日不已舌根腫起和舌尖亦腫腫至滿口比原舌大二倍一外科以燔針刺其舌兩旁下廉泉穴病勢轉凶將至顛嚱戴人曰血實者宜決之以䤵針磨令鋒極尖輕砭之日砭八九次血出約一二盞如此者三次漸而血少痛減腫消夫舌者心之外候也心主血則血出則愈又曰諸痛癢瘡皆屬心火燔針艾火是何義也一婦人木舌脹其舌滿口諸藥不愈余用䤵針小而銳者砭之五七度腫減三日方平計所出血幾至盈斗繆氏子年十六歲舌上重生小舌腫不能言不能食物醫以刀割之敷以藥閱時又生屢治不痊精力日憊向余求藥檢方書用蛇蛻燒灰研末敷之立愈後不復發舌出醫案四則元順帝之長公主駙馬剛噶勒藏慶王因墜馬得一奇疾兩眼黑睛俱無而舌出至胸諸醫罔知所措廣惠司卿聶濟爾乃伊羅勒琨人也嘗識此症遂剪去之頃間復生一舌亦剪之又於真舌兩邊各去一指許卻塗以藥而愈錄輟耕錄凌漢章治一男子病後舌吐凌兄亦知醫謂曰此病後近女色太早也舌者心之苗腎水竭不能制心火病在陰虛其穴在左股太陽是當以陰攻陽凌曰然如其穴針之舌吐如故凌曰此知瀉而不知補也補數針舌漸復如故明史何首庸治前鋒賴將軍舌本腫出不能縮入何曰心氣亟熱也如久則飲食不下而死矣炙飲器灼之腫消再投以湯劑立愈雲南通志古今醫統曰王貺治一大賈因失驚舌伸出遂不能收經旬食不下咽尪羸已甚國醫不能療其家榜於市曰有能者酬千金貺醫名未著學且未精因檢針經有針法治此疾遂往治之用針舌之底抽針出舌遂伸縮於平時舌縮醫案一則馮楚瞻治一人無故舌縮不能言用白芥子研末醋調敷頸項下即能言服清脾降火等湯再用紫雪冰片散吹之而安舌爛醫案三則先兄口舌糜爛痰涎上壅飲食如常遇大風欲仆地用補中益氣湯及八味丸即愈間藥數日仍作每勞苦則痰盛目赤漱以冷水舌稍愈頃間舌益甚用附子片噙之即愈服前二藥諸症方痊薛氏醫案工部徐檢齋口舌生瘡喜冷飲食或咽喉作痛大便閉結此實熱也同上王孟英治段春木之室爛喉內外科治之束手姚雪蕉孝廉薦孟英視之骨瘦如柴肌熱如烙韌痰阻於咽喉不能咯吐須以紙帛攪而曳之患處紅腫白腐齦舌皆糜爛米飲不沾月事非期而至按其脈左細數右弦滑曰此陰虧之體伏火之病失於涼降擾及於營先以犀角地黃湯清營分而調妄行之血續與白虎湯加西洋參等肅氣道而瀉燎原之火外用錫類散掃痰腐而消惡毒繼投甘潤藥蠲餘熱而充津液日以向安月餘而起舌痛醫案一則仲侍御多思慮舌作痛用苦寒降火藥發熱便血盜汗口乾肢體日瘦此脾氣虧損血虛生熱用加味歸脾湯而愈薛已治驗舌斷醫案二則有人自行被攧穿斷舌心血出不止米醋用雞翎刷所斷處其血即止仍用真蒲黃杏仁去皮尖硼砂少許研為細末煉蜜調藥稀稠得所噙化而安得效方錢國賓治板橋李氏僕劉二與租房之婦私年餘不收其租一日主人算賬無抵劉二坐逼婦恨將劉舌咬下二寸延視根腫滿湯水不下制金瘡藥用敗龜板燒煙帶黑色一兩血竭一錢冰片三分共末摻上血痛俱止腫尚未消其人昏厥不省夢關帝示以半紅半白雞豆子大藥一粒用無根水吞服即生矣驚覺難言討筆書眾人方知自是其腫漸消可灌飲湯或薄粥其舌長完比前大小一樣日服參耆歸術湯愈第三十二章辨舌證治要方察病於舌色較切脈更有把握蓋舌無隔膜且為心苗目視明澈勝於手揣病既察定然後立方用藥自必效如桴鼓茲就本書引用應備各方分列發表攻裡和解化利清涼溫散補益雜治為八節聊備參考略附主治效能幹各方之下俾互相發明第一節發表之劑青蘇飲生香附錢半紫蘇葉二錢陳皮錢半生甘草七分加姜蔥煎咳嗽加杏仁桑皮有痰加半夏頭痛加川芎白芷傷風鼻塞頭昏加羌活荊芥加味香蘇飲醫學心悟即前方加秦艽荊芥